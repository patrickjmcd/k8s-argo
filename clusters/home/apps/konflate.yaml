# konflate: renders every open k8s-argo PR with flate (the Flux tree at the
# PR's merge-base vs. its head) and shows the resource-level diff -- what the
# cluster would actually change, not the YAML lines that moved. Posts it as a
# PR comment and a "Konflate" commit status, UI at https://konflate.x.pmcd.io.
# Gitea's repo webhook (pull_request + sync) -> /hooks re-renders at once;
# the 30m refresh is the backstop. Secrets: apps/konflate/onepassworditem.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: konflate-extras
  namespace: flux-system
spec:
  path: ./apps/konflate
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: home-operations
  namespace: flux-system
spec:
  interval: 12h
  url: oci://ghcr.io/home-operations/charts
  type: oci
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
  namespace: flux-system
spec:
  interval: 30m
  releaseName: konflate
  targetNamespace: konflate
  storageNamespace: konflate
  chart:
    spec:
      chart: konflate
      version: 0.6.6
      sourceRef:
        kind: HelmRepository
        name: home-operations
  install:
    serverSideApply: true
  upgrade:
    serverSideApply: enabled
  driftDetection:
    mode: enabled
  values:
    config:
      repo: forgejo://git.x.pmcd.io/patrickjmcd/k8s-argo
      publicUrl: https://konflate.x.pmcd.io
      logFormat: text
      prComments: true
      statusChecks: true
      # What charts see as .Capabilities (match the cluster, and the CRDs
      # whose presence charts test for before rendering monitors/routes).
      kubeVersion: v1.37.1
      helmApiVersions: monitoring.coreos.com/v1,monitoring.coreos.com/v1/ServiceMonitor,monitoring.coreos.com/v1/PodMonitor,monitoring.coreos.com/v1/PrometheusRule,gateway.networking.k8s.io/v1/HTTPRoute,cert-manager.io/v1/Certificate
    secret:
      existingSecret: konflate-1pw  # security-agent: ignore (Secret name, not a value)
    # Reloader restarts it when the 1Password item changes.
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    # Cache and rendered diffs live in an emptyDir: a restart re-renders the
    # open PRs in seconds; only the "recently merged" shelf is lost.
    persistence:
      enabled: false
    httpRoute:
      enabled: true
      parentRefs:
        - name: traefik-gateway
          namespace: default
      hostnames:
        - konflate.x.pmcd.io
