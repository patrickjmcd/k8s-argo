# Flux failures -> Alertmanager -> n8n -> ntfy topic "alerts", the same path as
# every Prometheus alert. Flux's alertmanager provider labels each alert with
# the event severity; Alertmanager's root route already forwards anything that
# isn't severity=info (core/prometheus.yaml), so only error events reach ntfy.
# Alerts carry no endsAt and resolve after Alertmanager's resolve_timeout (5m).
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Provider
metadata:
  name: alertmanager
  namespace: flux-system
spec:
  type: alertmanager
  address: http://kube-prometheus-stack-alertmanager.prometheus.svc.cluster.local:9093/api/v2/alerts/
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: flux-errors
  namespace: flux-system
spec:
  providerRef:
    name: alertmanager
  eventSeverity: error
  eventSources:
    - kind: GitRepository
      name: "*"
    - kind: OCIRepository
      name: "*"
    - kind: HelmRepository
      name: "*"
    - kind: Kustomization
      name: "*"
    - kind: HelmRelease
      name: "*"
