apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: flux-system
spec:
  interval: 30m
  releaseName: trivy-operator
  targetNamespace: trivy-system
  storageNamespace: trivy-system
  chart:
    spec:
      chart: trivy-operator
      version: 0.37.0
      sourceRef:
        kind: HelmRepository
        name: aquasecurity
  # Adopted from Argo (docs/flux-migration.md §4.2). Never remediate a failed
  # install: for an adopted release that means uninstalling what was running.
  install:
    createNamespace: true
    serverSideApply: true
    crds: CreateReplace
    remediation:
      retries: 0
      remediateLastFailure: false
  upgrade:
    serverSideApply: enabled
    crds: CreateReplace
    remediation:
      retries: 0
      remediateLastFailure: false
  driftDetection:
    mode: enabled
  values:
    operator:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
      metricsConfigAuditInfo: true
      metricsExposedSecretInfo: true
      # Sep 2026: standalone mode has every scan-job container download its
      # own copy of the trivy-db into a fresh per-pod emptyDir cache. A scan
      # job gets one container per container in the target workload's pod,
      # started in parallel -- for any multi-container workload they raced
      # to open the same boltdb cache file and lost: "Failed to acquire
      # cache or database lock ... cache may be in use by another process:
      # timeout", failing every such scan with BackoffLimitExceeded. The
      # built-in server downloads the DB once and scan jobs become thin
      # HTTP clients against it, removing the race entirely.
      builtInTrivyServer: true
      # Oct 2026: SBOM reports were 214 MiB of JSON (285 objects) -- more
      # than every other resource type combined. Every kube-apiserver
      # holds all objects in its watch cache, so they cost each
      # control-plane node a GiB+ of RAM and pushed the 7.6 GB ones
      # (kube-n3160, kube-macmini) into swap. They're only a rescan
      # cache / input for ClusterVulnerabilityReports; per-workload
      # VulnerabilityReports don't need them.
      sbomGenerationEnabled: false
    trivy:
      ignoreUnfixed: true
      resources:
        requests:
          cpu: 50m
          memory: 100Mi
        limits:
          cpu: 500m
          memory: 500Mi
    serviceMonitor:
      enabled: true
    nodeCollector:
      tolerations:
        - operator: Exists
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trivy-operator-extras
  namespace: flux-system
spec:
  path: ./core/trivy-operator
