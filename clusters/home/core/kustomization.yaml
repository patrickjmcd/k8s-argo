# One Flux Kustomization per core/ component (the Flux side of
# argo/applications/core.yaml). Each file only sets name + path (and
# dependsOn/force for hook Jobs); the shared settings below are patched onto
# all of them. Handoff procedure: docs/flux-migration.md §3.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cloudflared-tunnel.yaml
  - dozzle.yaml
  - csi-driver-nfs-assets.yaml
  - goldilocks-assets.yaml
  - pocketid.yaml
  - system-upgrade.yaml
  - garage.yaml
  - timescale.yaml
  - monitoring.yaml
  - helm-repositories.yaml
  - reloader.yaml
  - vpa.yaml
  - goldilocks.yaml
  - headlamp.yaml
  - loki.yaml
  - alloy.yaml
  - blackbox-exporter.yaml
  - external-dns.yaml
  - trivy-operator.yaml
  - kubernetes-mcp-server.yaml
  - tailscale.yaml
  - kro.yaml
  - traefik.yaml
  - prometheus.yaml
patches:
  - target:
      kind: Kustomization
    patch: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: all
        namespace: flux-system
      spec:
        interval: 10m
        retryInterval: 2m
        timeout: 5m
        sourceRef:
          kind: GitRepository
          name: flux-system
        prune: true
        wait: true
