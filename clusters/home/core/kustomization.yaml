# One Flux Kustomization per core/ component, plus the core HelmReleases.
# Each Kustomization file only sets name + path (and dependsOn/force for hook
# Jobs); the shared settings below are patched onto all of them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cloudflared-tunnel.yaml
  - dozzle.yaml
  - csi-driver-nfs-assets.yaml
  - goldilocks-assets.yaml
  - pocketid.yaml
  - system-upgrade.yaml
  - garage.yaml
  - timescale.yaml
  - monitoring.yaml
  - helm-repositories.yaml
  - reloader.yaml
  - vpa.yaml
  - goldilocks.yaml
  - headlamp.yaml
  - loki.yaml
  - alloy.yaml
  - blackbox-exporter.yaml
  - external-dns.yaml
  - trivy-operator.yaml
  - kubernetes-mcp-server.yaml
  - tailscale.yaml
  - kro.yaml
  - traefik.yaml
  - prometheus.yaml
  - kyverno.yaml
  - cert-manager.yaml
  - shared-postgres.yaml
  - cnpg.yaml
  - metallb.yaml
  - csi-driver-smb.yaml
  - csi-driver-nfs.yaml
  - node-tuning.yaml
  - kube-vip.yaml
  - longhorn.yaml
  - cilium.yaml
  - onepassword-connect.yaml
patches:
  - target:
      kind: Kustomization
    patch: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: all
        namespace: flux-system
      spec:
        # Drift correction only: a push reconciles everything at once (Gitea
        # webhook -> Receiver -> GitRepository, clusters/home/receiver.yaml).
        # At 10m, re-rendering ~100 Kustomizations kept kustomize-controller
        # at ~120m CPU around the clock.
        interval: 1h
        retryInterval: 2m
        timeout: 5m
        sourceRef:
          kind: GitRepository
          name: flux-system
        prune: true
        wait: true
