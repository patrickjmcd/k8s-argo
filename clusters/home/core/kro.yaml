apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kro
  namespace: flux-system
spec:
  interval: 30m
  releaseName: kro
  targetNamespace: kro-system
  storageNamespace: kro-system
  chart:
    spec:
      chart: kro
      version: 0.9.4
      sourceRef:
        kind: HelmRepository
        name: kro
  # Adopted from Argo (docs/flux-migration.md §4.2). Never remediate a failed
  # install: for an adopted release that means uninstalling what was running.
  install:
    createNamespace: true
    serverSideApply: true
    crds: CreateReplace
    remediation:
      retries: 0
      remediateLastFailure: false
  upgrade:
    serverSideApply: enabled
    crds: CreateReplace
    remediation:
      retries: 0
      remediateLastFailure: false
  driftDetection:
    mode: enabled
  values:
    deployment:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 1000m
          memory: 512Mi
---
# The HomelabApp RGD. Its CRD comes from the kro chart above; on a fresh
# cluster this fails its dry run and retries until the chart is installed.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kro-definitions
  namespace: flux-system
spec:
  path: ./core/kro-definitions
