apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 30m
  releaseName: loki
  targetNamespace: loki
  storageNamespace: loki
  chart:
    spec:
      chart: loki
      version: 7.5.0
      sourceRef:
        kind: HelmRepository
        name: grafana
  # Adopted from Argo (docs/flux-migration.md §4.2). Never remediate a failed
  # install: for an adopted release that means uninstalling what was running.
  install:
    createNamespace: true
    serverSideApply: true
    crds: CreateReplace
    remediation:
      retries: 0
      remediateLastFailure: false
  upgrade:
    serverSideApply: enabled
    crds: CreateReplace
    remediation:
      retries: 0
      remediateLastFailure: false
  driftDetection:
    mode: enabled
  values:
    # SingleBinary, not the default SimpleScalable/Distributed modes —
    # this is a homelab log volume, not the >1TB/day scale those modes
    # are built for.
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      analytics:
        reporting_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        # 7 days (cut from 30 in Oct 2026 to shrink Loki; Dozzle covers live
        # logs). The joshhawleygop override below is unaffected.
        retention_period: 168h
        # Per-stream overrides. joshhawleygop.com's nginx access logs are
        # the only store behind its Grafana visitor dashboard, so keep
        # them 5 years. It's one low-volume stream; disk cost is tiny.
        retention_stream:
          - selector: '{namespace="default", container="joshhawleygop"}'
            priority: 1
            period: 43800h
        # Default is 721h, which would cap every query at 30 days and
        # make the 5-year stream above unqueryable past that. Nothing
        # else is retained longer than 7 days, so this only widens
        # queries against joshhawleygop.
        max_query_length: 43830h
        reject_old_samples: true
        reject_old_samples_max_age: 168h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 20Gi
        storageClass: longhorn
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    # No gateway/read/write/backend split, no memcached caches, no
    # loki-canary, no bundled test pod, no MinIO — all of that is
    # SimpleScalable/Distributed-mode scaffolding this deployment
    # doesn't use.
    gateway:
      enabled: false
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    resultsCache:
      enabled: false
    chunksCache:
      enabled: false
    memcached:
      enabled: false
    test:
      enabled: false
    lokiCanary:
      enabled: false
    monitoring:
      serviceMonitor:
        enabled: false
      selfMonitoring:
        enabled: false
      lokiCanary:
        enabled: false
    minio:
      enabled: false
