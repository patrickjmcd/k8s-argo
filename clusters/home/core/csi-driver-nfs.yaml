apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: flux-system
spec:
  interval: 30m
  releaseName: csi-driver-nfs
  targetNamespace: kube-system
  storageNamespace: kube-system
  chart:
    spec:
      chart: csi-driver-nfs
      version: 4.13.6
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
  # Adopted from Argo (docs/flux-migration.md §4.2). Never remediate a failed
  # install: for an adopted release that means uninstalling what was running.
  install:
    createNamespace: true
    serverSideApply: true
    crds: CreateReplace
    remediation:
      retries: 0
      remediateLastFailure: false
  upgrade:
    serverSideApply: enabled
    crds: CreateReplace
    remediation:
      retries: 0
      remediateLastFailure: false
  driftDetection:
    mode: enabled
  # Keep the CSIDriver if the release is ever uninstalled: the NFS PVs mount
  # through it. StorageClasses live in core/csi-driver-nfs-assets.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: CSIDriver
            patch: |
              - op: add
                path: /metadata/annotations
                value:
                  helm.sh/resource-policy: keep
