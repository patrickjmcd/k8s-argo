apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: timescale
  namespace: flux-system
spec:
  path: ./core/timescale
---
# Former Argo PostSync hook (docs/flux-migration.md §4.4): runs once timescale is
# healthy, and again whenever the Job spec changes (force: true recreates it).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: timescale-jobs
  namespace: flux-system
spec:
  path: ./core/timescale/jobs
  dependsOn:
    - name: timescale
  force: true
