apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: flux-system
spec:
  interval: 30m
  releaseName: vpa
  targetNamespace: vpa
  storageNamespace: vpa
  chart:
    spec:
      chart: vpa
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: fairwinds
  # Adopted from Argo (docs/flux-migration.md §4.2). Never remediate a failed
  # install: for an adopted release that means uninstalling what was running.
  install:
    createNamespace: true
    serverSideApply: true
    crds: CreateReplace
    remediation:
      retries: 0
      remediateLastFailure: false
  upgrade:
    serverSideApply: enabled
    crds: CreateReplace
    remediation:
      retries: 0
      remediateLastFailure: false
  driftDetection:
    mode: enabled
  values:
    recommender:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 200m
          memory: 512Mi
    updater:
      enabled: false
    admissionController:
      enabled: false
