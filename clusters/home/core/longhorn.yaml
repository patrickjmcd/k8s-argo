# Longhorn, adopted from the Argo Application longhorn (docs/flux-migration.md
# §4.2). Never remediate a failed install or upgrade: for an adopted release
# that means uninstalling what was running. The chart's pre-delete uninstall
# Job only wipes data when the deleting-confirmation-flag setting is true;
# keep it false.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 30m
  releaseName: longhorn
  targetNamespace: longhorn-system
  storageNamespace: longhorn-system
  chart:
    spec:
      chart: longhorn
      version: 1.13.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
  install:
    createNamespace: true
    serverSideApply: true
    crds: CreateReplace
    remediation:
      retries: 0
      remediateLastFailure: false
  upgrade:
    serverSideApply: enabled
    crds: CreateReplace
    remediation:
      retries: 0
      remediateLastFailure: false
  driftDetection:
    mode: enabled
  # The chart's 28 CRDs are templates with no annotations setting, so an
  # uninstall would delete them and every volume object with them. Keep them.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: CustomResourceDefinition
            patch: |
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: ignored
                annotations:
                  helm.sh/resource-policy: keep
  values:
    preUpgradeChecker:
      jobEnabled: false
    defaultSettings:
      # dedicated=heavy lets Longhorn run on media-server (disk at /mnt/usb/longhorn)
      taintToleration: "node-role.kubernetes.io/control-plane:NoSchedule;dedicated=heavy:NoSchedule"
      replicaAutoBalance: "best-effort"
      # No phoning home: version checks and usage stats.
      upgradeChecker: false
      allowCollectingLonghornUsageMetrics: false
    longhornManager:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          effect: "NoSchedule"
          operator: "Exists"
        - key: "dedicated"
          value: "heavy"
          effect: "NoSchedule"
          operator: "Equal"
        - key: "node.kubernetes.io/not-ready"
          effect: "NoExecute"
          operator: "Exists"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/unreachable"
          effect: "NoExecute"
          operator: "Exists"
          tolerationSeconds: 30
      # Steady state is 250-300Mi on every node. The old 300Mi limit
      # OOM-killed it on pi5-kube1 minutes before that node hung
      # (Oct 11 2026). No CPU limit: it's on the CSI critical path.
      resources:
        requests:
          cpu: 50m
          memory: 320Mi
        limits:
          memory: 768Mi
    longhornDriver:
      tolerations:
        - key: "dedicated"
          value: "heavy"
          effect: "NoSchedule"
          operator: "Equal"
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
    
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-extras
  namespace: flux-system
spec:
  path: ./core/longhorn-assets
