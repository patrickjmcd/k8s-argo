# 1Password Connect + the 1Password operator (OnePasswordItem -> Secret), every
# app's secret source. Installed by hand on 2026-01-15 as Helm release
# `connect`; adopted 2026-10-27 by deleting that release record (backed up)
# and letting Flux install over the live objects: upgrading it instead would
# have deleted the two bootstrap Secrets below, which the old release rendered
# from inline values.
#
# Bootstrap Secrets, NOT in git and NOT managed by this release (it only
# references them by name): `op-credentials` (key 1password-credentials.json)
# and `onepassword-token` (key token) in default. On a fresh cluster create
# them by hand from the Connect server's credentials file and token before
# Flux reconciles this.
#
# Never remediate a failed install or upgrade: that would uninstall secret sync.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: connect
  namespace: flux-system
spec:
  interval: 30m
  releaseName: connect
  targetNamespace: default
  storageNamespace: default
  chart:
    spec:
      chart: connect
      version: 2.4.3
      sourceRef:
        kind: HelmRepository
        name: onepassword
  install:
    serverSideApply: true
    crds: CreateReplace
    remediation:
      retries: 0
      remediateLastFailure: false
  upgrade:
    serverSideApply: enabled
    crds: CreateReplace
    remediation:
      retries: 0
      remediateLastFailure: false
  driftDetection:
    mode: enabled
  values:
    connect:
      # credentialsName/credentialsKey defaults: op-credentials /
      # 1password-credentials.json (see the header).
      # The live Deployments carried the 30s node-failure tolerations in their
      # templates (Kyverno adds the same to every pod); kept so adoption
      # doesn't roll Connect.
      tolerations: &tolerations
        - effect: NoExecute
          key: node.kubernetes.io/not-ready
          operator: Exists
          tolerationSeconds: 30
        - effect: NoExecute
          key: node.kubernetes.io/unreachable
          operator: Exists
          tolerationSeconds: 30
    operator:
      create: true
      # token.name/key defaults: onepassword-token / token.
      tolerations: *tolerations
