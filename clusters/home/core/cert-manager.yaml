apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m
  releaseName: cert-manager
  targetNamespace: cert-manager
  storageNamespace: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: v1.21.2
      sourceRef:
        kind: HelmRepository
        name: jetstack
  # Adopted from Argo (docs/flux-migration.md §4.2). Never remediate a failed
  # install: for an adopted release that means uninstalling what was running.
  install:
    createNamespace: true
    serverSideApply: true
    crds: CreateReplace
    remediation:
      retries: 0
      remediateLastFailure: false
  upgrade:
    serverSideApply: enabled
    crds: CreateReplace
    remediation:
      retries: 0
      remediateLastFailure: false
  driftDetection:
    mode: enabled
  values:
    crds:
      enabled: true
    # No CPU limits on any cert-manager component. A 15m limit is 1.5ms of CPU
    # per 100ms CFS period, which throttled all three (18-35%) despite each
    # averaging 1-3m. The webhook is on the API admission path, so throttling it
    # stalls any request touching cert-manager resources. Memory limits are kept
    # but given real headroom -- they were previously pinned 1Mi above requests,
    # one spike away from an OOMKill (cainjector idles at 91Mi of its old 122Mi).
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 256Mi
    cainjector:
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 320Mi
    webhook:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 192Mi
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-extras
  namespace: flux-system
spec:
  path: ./core/cert-manager
