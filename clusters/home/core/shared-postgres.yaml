apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shared-postgres
  namespace: flux-system
spec:
  path: ./core/postgres
---
# Former Argo PostSync hooks (core/postgres/jobs/kustomization.yaml).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shared-postgres-jobs
  namespace: flux-system
spec:
  path: ./core/postgres/jobs
  dependsOn:
    - name: shared-postgres
  force: true
