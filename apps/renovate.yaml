apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: renovate
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  destination:
    name: in-cluster
    namespace: renovate
  project: apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  source:
    path: apps/renovate
    repoURL: http://gitea.gitea.svc.cluster.local:3000/patrickjmcd/k8s-argo.git
    targetRevision: main
