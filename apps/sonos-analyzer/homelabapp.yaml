# https://github.com/grahamfairbank/sonos-analyzer -- read-only Sonos network
# diagnostics (firmware, Wi-Fi/Ethernet, bonded rooms, signal matrix). Stateless.
# No hostNetwork: its SSDP discovery can't reach the speakers anyway (they're
# on 192.168.1.x, the nodes on 192.168.8.x), so type one speaker's IP in the
# UI (e.g. 192.168.1.163); one speaker is enough to find the rest.
# The UI has no login, so internal route only.
apiVersion: homelab.pmcd.io/v1alpha1
kind: HomelabApp
metadata:
  name: sonos-analyzer
  namespace: default
spec:
  image: ghcr.io/grahamfairbank/sonos-analyzer:0.5.0
  port: 8400
  env:
    TZ: America/Chicago
  resources:
    cpuRequest: 20m
    memoryRequest: 64Mi
    cpuLimit: "1"
    memoryLimit: 256Mi
  probes:
    type: httpGet
    path: /healthz
  route:
    hostnames:
    - sonos-analyzer.x.pmcd.io
