---
# Named "ultrafeeder" so piaware's BEASTHOST=ultrafeeder resolves in-namespace.
apiVersion: v1
kind: Service
metadata:
  name: ultrafeeder
  labels:
    app: ultrafeeder
spec:
  type: ClusterIP
  selector:
    app: ultrafeeder
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: beast-in
      port: 30004
      targetPort: 30004 # readsb Beast input — the consumer writes the Pi's stream here
    - name: beast-out
      port: 30005
      targetPort: 30005
    - name: mlat-in
      port: 31004
      targetPort: 31004 # piaware MLAT results back
---
# Named "dump978" so readsb's existing ULTRAFEEDER_CONFIG uat_in connector
# (adsb,dump978,30978,uat_in) resolves — but it points at the consumer, which
# relays the Pi's real dump978 output over NATS.
apiVersion: v1
kind: Service
metadata:
  name: dump978
  labels:
    app: adsb-nats-consumer
spec:
  type: ClusterIP
  selector:
    app: adsb-nats-consumer
  ports:
    - name: uat-978
      port: 30978
      targetPort: 30978
---
apiVersion: v1
kind: Service
metadata:
  name: piaware
  labels:
    app: piaware
spec:
  type: ClusterIP
  selector:
    app: piaware
  ports:
    - name: http
      port: 8080
      targetPort: 8080
