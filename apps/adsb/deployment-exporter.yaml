---
# Scrapes ultrafeeder's stats.json and exposes ADS-B metrics for Prometheus.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adsb-exporter
  labels:
    app: adsb-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adsb-exporter
  template:
    metadata:
      labels:
        app: adsb-exporter
    spec:
      containers:
        - name: exporter
          image: python:3.14-slim
          command:
            - sh
            - -c
            - "pip install --quiet --no-cache-dir prometheus_client && exec python /app/exporter.py"
          ports:
            - name: metrics
              containerPort: 9105
          volumeMounts:
            - name: script
              mountPath: /app
          resources:
            requests:
              cpu: "20m"
              memory: "48Mi"
            limits:
              memory: "96Mi"
      volumes:
        - name: script
          configMap:
            name: adsb-exporter
