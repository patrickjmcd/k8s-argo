---
# readsb + tar1090 in NET-ONLY mode: no SDR here anymore. Decoding happens on
# the upstairs Pi; its Beast stream arrives over NATS and the consumer writes it
# into readsb's Beast input (:30004). ultrafeeder then feeds the aggregators +
# MLAT. Because there's no SDR, this pod is unprivileged, needs no USB/host
# access, and can schedule on any node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ultrafeeder
  labels:
    app: ultrafeeder
spec:
  replicas: 1
  strategy:
    type: Recreate # globe-history is a RWO Longhorn PVC — avoid two attachers
  selector:
    matchLabels:
      app: ultrafeeder
  template:
    metadata:
      labels:
        app: ultrafeeder
    spec:
      containers:
        - name: ultrafeeder
          image: ultrafeeder
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80 # tar1090 map UI
            - name: beast-in
              containerPort: 30004 # Beast input (consumer writes the Pi's stream here)
            - name: beast-out
              containerPort: 30005 # Beast output (piaware reads this)
            - name: mlat-in
              containerPort: 31004 # piaware MLAT results back
          env:
            - name: TZ
              value: "America/Chicago"
            # No SDR on the cluster — pure network aggregator/relay.
            - name: READSB_NET_ONLY
              value: "true"
            - name: READSB_ALT
              value: "295"
            - name: READSB_MAX_RANGE
              value: "300"
            - name: TAR1090_SITENAME
              value: "mcd-adsb-station"
            - name: TAR1090_PAGETITLE
              value: "mcd-adsb-station"
            - name: TAR1090_ENABLE_AC_DB
              value: "true"
            # --- sensitive values, sourced from 1Password (adsb-1pw) ---
            - name: READSB_LAT
              valueFrom:
                secretKeyRef:
                  name: adsb-1pw
                  key: LAT
            - name: READSB_LON
              valueFrom:
                secretKeyRef:
                  name: adsb-1pw
                  key: LON
            - name: ULTRAFEEDER_CONFIG
              valueFrom:
                secretKeyRef:
                  name: adsb-1pw
                  key: ULTRAFEEDER_CONFIG
          volumeMounts:
            - name: globe-history
              mountPath: /var/globe_history
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              # No CPU limit (repo policy: readsb is steady + latency-sensitive).
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: globe-history
          persistentVolumeClaim:
            claimName: adsb-globe-history
