apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: adsb

resources:
  - namespace.yaml
  - deployment-ultrafeeder.yaml
  - deployment-piaware.yaml
  - configmap-consumer.yaml
  - deployment-consumer.yaml
  - configmap-exporter.yaml
  - deployment-exporter.yaml
  - metrics.yaml
  - service.yaml
  - httproute.yaml
  - storage.yaml
  - 1password.secret.yaml

# Pin images (repo convention: never use `latest`).
images:
  - name: ultrafeeder
    newName: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder
    newTag: latest-build-871
  - name: piaware
    newName: ghcr.io/sdr-enthusiasts/docker-piaware
    newTag: latest-build-640
