---
# Bridges NATS -> readsb for both bands: writes adsb.beast.1090 into
# ultrafeeder:30004, and serves adsb.uat.978 on :30978 (readsb dials in via the
# "dump978" Service). Plain python:slim + pip install nats-py at startup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adsb-nats-consumer
  labels:
    app: adsb-nats-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adsb-nats-consumer
  template:
    metadata:
      labels:
        app: adsb-nats-consumer
    spec:
      containers:
        - name: consumer
          image: python:3.14-slim
          command:
            - sh
            - -c
            - "pip install --quiet --no-cache-dir nats-py && exec python /app/consumer.py"
          ports:
            - name: uat-978
              containerPort: 30978 # readsb dials in here for the 978 stream
          volumeMounts:
            - name: script
              mountPath: /app
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "128Mi"
      volumes:
        - name: script
          configMap:
            name: adsb-nats-consumer
