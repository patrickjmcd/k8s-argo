# DB password for the recorder. Create the 1Password item
#   vaults/Kubernetes/items/adsb-postgres
# with fields: username=adsb, password=<generate one>
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: adsb-postgres-1pw
spec:
  itemPath: "vaults/Kubernetes/items/adsb-postgres"
