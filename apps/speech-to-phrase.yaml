apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: speech-to-phrase
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  destination:
    # Shares the namespace with piper (apps/voice-assistant).
    namespace: voice-assistant
    name: in-cluster
  project: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
  source:
    # HomelabApp (core/kro-definitions) instead of the homelab-app chart.
    path: apps/speech-to-phrase
    repoURL: https://github.com/patrickjmcd/k8s-argo.git
    targetRevision: main
