apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uptime-kuma
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  destination:
    namespace: default
    name: in-cluster
  project: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
  source:
    # HomelabApp (core/kro-definitions) instead of the homelab-app chart.
    path: apps/uptime-kuma
    repoURL: https://github.com/patrickjmcd/k8s-argo.git
    targetRevision: main
