apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: dispatcharr
    app.kubernetes.io/name: dispatcharr
  name: dispatcharr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: dispatcharr
      app.kubernetes.io/name: dispatcharr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: dispatcharr
        app.kubernetes.io/name: dispatcharr
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-10-11T22:04:04Z"
    spec:
      containers:
        - name: dispatcharr
          env:
            - name: TZ
              value: America/Chicago
            - name: DISPATCHARR_ENV
              value: modular
            - name: USE_LEGACY_NUMPY
              value: "true"
            - name: POSTGRES_HOST
              value: "shared-postgres-rw.postgres.svc.cluster.local"
            - name: POSTGRES_PASSWORD
              value: ""
          envFrom:
            - secretRef:
                name: dispatcharr-1pw
          image: dispatcharr
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9191
              name: http
              protocol: TCP
            # Dispatcharr Exporter plugin (enable "Auto-start Server" in its settings)
            - containerPort: 9192
              name: metrics
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: http
            timeoutSeconds: 1
          livenessProbe:
            tcpSocket:
              port: http
            failureThreshold: 5
            initialDelaySeconds: 180
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
          startupProbe:
            failureThreshold: 30
            periodSeconds: 5
            successThreshold: 1
            tcpSocket:
              port: http
            timeoutSeconds: 1
          resources:
            limits:
              # Headroom for the Could Not Dispatch plugin's in-container ffmpeg
              # slate encoder; 1008Mi (17Mi over the request) OOMKilled on first use.
              memory: 1792Mi
            requests:
              cpu: 15m
              memory: 991Mi
          volumeMounts:
            - mountPath: /data
              name: data
      restartPolicy: Always
      # The HDHomeRun (192.168.1.176) only streams to clients on its own
      # subnet: from VLAN 8 nodes it tunes, locks the tuner and sends 0 bytes.
      # media-server is on 192.168.1.x, so OTA streams work from here.
      nodeSelector:
        node-type: heavy
      tolerations:
        - key: dedicated
          value: heavy
          effect: NoSchedule
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: smb-dispatcharr-claim
