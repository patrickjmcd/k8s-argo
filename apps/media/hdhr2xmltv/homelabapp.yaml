apiVersion: homelab.pmcd.io/v1alpha1
kind: HomelabApp
metadata:
  name: hdhr2xmltv
  namespace: media
spec:
  image: ghcr.io/patrickjmcd/hdhr2xmltv:1.1.0
  port: 80
  containerPort: 8080
  resources:
    cpuRequest: 15m
    memoryRequest: 105Mi
    cpuLimit: 100m
    memoryLimit: 128Mi
  probes:
    type: httpGet
    path: /readyz
    readiness:
      initialDelaySeconds: 5
    liveness:
      enabled: true
      path: /healthz
      initialDelaySeconds: 5
      timeoutSeconds: 1
      failureThreshold: 3
    startup:
      enabled: false
  route:
    hostnames:
    - hdhr2xmltv.x.pmcd.io
  onePassword:
    enabled: true
  env:
    CACHE_TTL_MINUTES: '60'
  extraVolumes:
  - name: media
    claimName: smb-media-claim
  - name: data
    emptyDir: true
    sizeLimit: 500Mi
  extraVolumeMounts:
  - name: media
    mountPath: /mnt/media
  - name: data
    mountPath: /data
