apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smb-seerr-claim
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Mi
  volumeName: smb-seerr
  storageClassName: ''
