apiVersion: homelab.pmcd.io/v1alpha1
kind: HomelabApp
metadata:
  name: seerr
  namespace: media
spec:
  image: ghcr.io/seerr-team/seerr:v3.4.1
  port: 80
  containerPort: 5055
  resources:
    cpuRequest: 15m
    memoryRequest: 283Mi
    cpuLimit: 500m
    memoryLimit: 512Mi
  probes:
    type: httpGet
    path: /api/v1/status
    readiness:
      periodSeconds: 15
      timeoutSeconds: 3
    liveness:
      enabled: true
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      failureThreshold: 10
  route:
    hostnames:
    - requests.x.pmcd.io
    - seerr.x.pmcd.io
    publicHostnames:
    - seerr.pmcd.io
    - request.pmcd.dev
  env:
    TZ: America/Chicago
  persistence:
    claimName: smb-seerr-claim
    mountPath: /app/config
  glance:
    monitor: true
    title: Seerr
