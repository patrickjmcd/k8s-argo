apiVersion: homelab.pmcd.io/v1alpha1
kind: HomelabApp
metadata:
  name: ytdl-triage
  namespace: media
spec:
  image: ghcr.io/patrickjmcd/ytdl-triage:e4d92f9
  port: 80
  containerPort: 8080
  resources:
    cpuRequest: 15m
    memoryRequest: 64Mi
    cpuLimit: 300m
    memoryLimit: 256Mi
  probes:
    type: httpGet
    path: /readyz
    readiness:
      initialDelaySeconds: 5
    liveness:
      enabled: true
      path: /healthz
      initialDelaySeconds: 5
      timeoutSeconds: 1
      failureThreshold: 3
    startup:
      enabled: false
  route:
    hostnames:
    - ytdl-triage.x.pmcd.io
  extraVolumes:
  - name: media
    claimName: smb-media-claim
  extraVolumeMounts:
  - name: media
    mountPath: /organized
    subPath: video/youtube/Organized
