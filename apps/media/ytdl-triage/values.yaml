image:
  repository: ghcr.io/patrickjmcd/ytdl-triage
  tag: "e4d92f9"

service:
  port: 80
  containerPort: 8080

resources:
  requests:
    cpu: 15m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

probes:
  readiness:
    type: httpGet
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  liveness:
    enabled: true
    type: httpGet
    path: /healthz
    initialDelaySeconds: 5
    failureThreshold: 3
    periodSeconds: 10
    timeoutSeconds: 1
  startup:
    enabled: false

httproute:
  enabled: true
  hostnames:
    - ytdl-triage.x.pmcd.io

# Defaults (ORGANIZED_DIR=/organized, NEEDS_REVIEW_DIR=$ORGANIZED_DIR/Needs
# Review) already match where this is mounted below, same as the youtubedl
# postprocessor's own ORGANIZED_DIR — no env overrides needed.

extraVolumes:
  - name: media
    persistentVolumeClaim:
      claimName: smb-media-claim

extraVolumeMounts:
  - mountPath: /organized
    name: media
    subPath: video/youtube/Organized
