# Feishin: web player for Navidrome (apps/media/navidrome), replacing Aonsoku.
# A static SPA -- the browser talks to Navidrome's Subsonic API directly, so
# SERVER_URL must be the browser-reachable Navidrome URL, not the in-cluster
# Service. SERVER_LOCK pins it to Navidrome; each user signs in with their own
# Navidrome account.
apiVersion: homelab.pmcd.io/v1alpha1
kind: HomelabApp
metadata:
  name: feishin
  namespace: media
spec:
  image: ghcr.io/jeffvli/feishin:1.17.0
  port: 80
  containerPort: 9180
  env:
    SERVER_NAME: Navidrome
    SERVER_TYPE: navidrome
    SERVER_URL: https://navidrome.x.pmcd.io
    SERVER_LOCK: "true"
    ANALYTICS_DISABLED: "true"
  resources:
    cpuRequest: 10m
    memoryRequest: 64Mi
    cpuLimit: 500m
    memoryLimit: 256Mi
  probes:
    type: httpGet
    path: /
    liveness:
      enabled: true
  route:
    hostnames:
      - music.x.pmcd.io
      - feishin.x.pmcd.io
  glance:
    monitor: true
    title: Music
