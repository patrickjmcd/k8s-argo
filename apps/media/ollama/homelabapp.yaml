# Ollama, CPU-only, serving text embeddings for SUB/WAVE (apps/media/subwave).
# In subwave: Settings -> Embedding -> Ollama URL http://ollama.media.svc:11434,
# model nomic-embed-text. Cluster-internal only: no route, no auth.
apiVersion: homelab.pmcd.io/v1alpha1
kind: HomelabApp
metadata:
  name: ollama
  namespace: media
spec:
  image: ollama/ollama:0.40.11
  port: 11434
  # Start the server, pull the embedding model once it answers, then wait on
  # the server so it stays PID 1's child.
  command:
    - /bin/sh
    - -c
    - |
      ollama serve & pid=$!
      trap 'kill -TERM $pid' TERM INT
      until ollama list >/dev/null 2>&1; do sleep 1; done
      ollama pull nomic-embed-text
      wait $pid
  env:
    TZ: America/Chicago
    OLLAMA_HOST: 0.0.0.0:11434
    # OLLAMA_KEEP_ALIVE left at the 5m default: the model unloads when idle and
    # reloads in about a second; backfill batches keep it warm.
  # Soft-prefer media-server (16 cores, spare memory) over the Pis.
  preferredNodes:
    - media-server
  tolerations:
    - key: dedicated
      operator: Equal
      value: heavy
      effect: NoSchedule
  nodeSelector:
    kubernetes.io/arch: amd64
  resources:
    cpuRequest: 500m
    memoryRequest: 256Mi
    # No CPU limit: embedding is bursty and a quota just stretches backfills
    # (CLAUDE.md "Resource requests and limits").
    cpuLimit: ""
    memoryLimit: 3Gi
  probes:
    type: httpGet
    path: /
    liveness:
      enabled: true
  route:
    enabled: false
  # Scratch storage, not a PVC: the only thing here is the 274MB model, which
  # is re-pulled on every start.
  extraVolumes:
    - name: models
      emptyDir: true
      sizeLimit: 2Gi
  extraVolumeMounts:
    - name: models
      mountPath: /root/.ollama
