# Lives outside the HomelabApp on purpose: kro would delete a PVC it owned if
# persistence were ever toggled off. No B2 backup label -- the models are
# re-pulled on start, so there is nothing here worth restoring.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-ollama-data
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
