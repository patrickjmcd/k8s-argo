apiVersion: homelab.pmcd.io/v1alpha1
kind: HomelabApp
metadata:
  name: concertarr
  namespace: media
spec:
  image: ghcr.io/patrickjmcd/concertarr:d7018ef
  port: 80
  containerPort: 8000
  resources:
    cpuRequest: 15m
    memoryRequest: 128Mi
    cpuLimit: 500m
    memoryLimit: 512Mi
  probes:
    type: httpGet
    path: /healthz
    readiness:
      periodSeconds: 15
      timeoutSeconds: 5
    liveness:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
  route:
    hostnames:
    - concertarr.x.pmcd.io
  env:
    TZ: America/Chicago
    CONCERTARR_MEDIA_ROOT: /mnt/media/concerts
    CONCERTARR_POLL_INTERVAL_MINUTES: '180'
    CONCERTARR_PREFERRED_FORMATS: Flac,VBR MP3,MP3,Ogg Vorbis
  persistence:
    claimName: longhorn-concertarr-data
    mountPath: /app/data
  extraVolumes:
  - name: media
    claimName: smb-media-claim
  extraVolumeMounts:
  - name: media
    mountPath: /mnt/media
