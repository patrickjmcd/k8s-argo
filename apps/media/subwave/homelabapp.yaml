# SUB/WAVE AI-DJ radio station (getsubwave.com). Uses the all-in-one image --
# icecast + liquidsoap, controller, web UI, Piper/Kokoro TTS and the heavy
# analyzer (CLAP audio embeddings/moods + Demucs stems; the -heavy image, since
# ANALYZER_HEAVY is inert on the AIO) behind one in-container Caddy on :80,
# which already does the /api, /stream* and /api/listener-auth routing the
# split stack needs from an external proxy. Navidrome, LLM, TTS and persona are set in the
# /onboarding wizard and saved under the state dir.
apiVersion: homelab.pmcd.io/v1alpha1
kind: HomelabApp
metadata:
  name: subwave
  namespace: media
spec:
  image: ghcr.io/perminder-klair/subwave-aio-heavy:1.28.0
  port: 80
  env:
    TZ: America/Chicago
    ADMIN_USER: admin
    SITE_URL: https://subwave.x.pmcd.io
    # Play tracks straight off the share instead of streaming them from
    # Navidrome; any path mismatch just falls back to streaming.
    MUSIC_LIBRARY_PATH: /music
  # ADMIN_PASS
  onePassword:
    enabled: true
  # Pinned to media-server (16 cores): a soft preference let it land on
  # macbook-debian, where CLAP/Demucs timed out on ~70% of tracks and starved
  # liquidsoap (Oct 2026). The aio image is amd64-only anyway.
  nodeSelector:
    kubernetes.io/hostname: media-server
  tolerations:
    - key: dedicated
      operator: Equal
      value: heavy
      effect: NoSchedule
  resources:
    cpuRequest: 1000m
    # ~3.5Gi observed mid-analysis.
    memoryRequest: 4Gi
    # No CPU limit: liquidsoap encodes the live stream in real time, and
    # throttling it stalls every listener (CLAUDE.md "Resource requests").
    cpuLimit: ""
    # CLAP + Demucs models on top of liquidsoap and the TTS workers.
    memoryLimit: 8Gi
  probes:
    type: httpGet
    path: /api/health
    startup:
      # First boot renders Icecast secrets and warms the TTS models.
      failureThreshold: 60
    liveness:
      enabled: true
      # The admin Library page's /api/library/* queries block the controller's
      # event loop on the 26k-track library.db, stalling every /api route (incl.
      # /api/health). The default 5 x 10s killed it mid-query 10x in 17h (Oct
      # 2026); allow ~5 min instead.
      failureThreshold: 30
  route:
    hostnames:
      - subwave.x.pmcd.io
  persistence:
    claimName: longhorn-subwave-data
    mountPath: /var/sub-wave
  extraVolumes:
    - name: media
      claimName: smb-media-claim
  extraVolumeMounts:
    - name: media
      mountPath: /music
      subPath: music/library
      readOnly: true
  glance:
    monitor: true
