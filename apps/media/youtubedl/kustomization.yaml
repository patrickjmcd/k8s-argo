apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - httproute.yaml
  - storage.yaml
  - deployment.yaml
  - service.yaml
  - 1password.secret.yaml

images:
  - name: youtubedl
    newName: tzahi12345/youtubedl-material
    newTag: nightly
    digest: sha256:ca6f08a9c3aeca75ddee7356252fb712998f45e99da9542d0e14c2eaef5e8e08

configMapGenerator:
  - name: youtubedl-config
    envs:
      - .env
  - name: ytdl-postprocessor-script
    files:
      - watcher.py
      - backfill_labels.py
      - backfill_artist_filenames.py