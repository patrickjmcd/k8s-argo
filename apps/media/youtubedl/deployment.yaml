apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtubedl
  labels:
    app.kubernetes.io/instance: youtubedl
    app.kubernetes.io/name: youtubedl
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: youtubedl
      app.kubernetes.io/name: youtubedl
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: youtubedl
        app.kubernetes.io/name: youtubedl
    spec:
      initContainers:
        - name: ensure-ytdl-js-runtime
          image: youtubedl
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          command: ["node", "-e"]
          args:
            - |
              const fs = require('fs');
              const p = '/app/appdata/default.json';
              let c;
              try { c = JSON.parse(fs.readFileSync(p)); } catch (e) { c = { YoutubeDLMaterial: {} }; }
              c.YoutubeDLMaterial.Downloader = c.YoutubeDLMaterial.Downloader || {};
              // yt-dlp needs a JS runtime to solve YouTube's PO-token challenge or downloads 403.
              // Node is already bundled in this image; args are ,,-delimited per this app's custom_args parser.
              c.YoutubeDLMaterial.Downloader.custom_args = '--js-runtimes,,node,,--remote-components,,ejs:github';
              fs.writeFileSync(p, JSON.stringify(c, null, 2));
          volumeMounts:
            - name: config
              mountPath: /app/appdata
      containers:
        - name: youtubedl-material
          image: youtubedl
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: youtubedl-config
          ports:
            - name: http
              containerPort: 17442
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /app/appdata
            - name: media
              mountPath: /app/video
              subPath: video/youtube/Incoming
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 0
            failureThreshold: 3
            timeoutSeconds: 1
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 0
            failureThreshold: 3
            timeoutSeconds: 1
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 0
            failureThreshold: 30
            timeoutSeconds: 1
            periodSeconds: 5
          resources:
            limits:
              cpu: 1
              memory: 512Mi
            requests:
              cpu: 35m
              memory: 400Mi
        - name: postprocessor
          image: python:3.14-slim
          resources:
            requests:
              cpu: 11m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          env:
            - name: STABLE_SECONDS
              value: "15"
            - name: UNKNOWN_ARTIST
              value: "Unknown Artist"
            - name: COPY_MODE
              value: "0"
            - name: OPENAI_MODEL
              value: "gpt-4.1-mini"
            - name: USE_OPENAI
              value: "1"
            - name: CONF_AUTO
              value: "0.85"
            - name: CONF_REVIEW
              value: "0.70"
            - name: ENABLE_EMBEDDINGS
              value: "0"
            - name: EMBEDDING_MODEL
              value: "text-embedding-3-small"
            - name: PLEX_URL
              value: "http://192.168.1.210:32400"
            - name: PLEX_SECTION_ID
              value: "6"
            - name: PLEX_PATH_PREFIX
              value: "/mnt/unas/Media/video/youtube/Organized"
          command: [ "sh","-lc" ]
          args:
            - >
              pip install --no-cache-dir watchdog openai sqlite-vec &&
              python /app/watcher.py
          envFrom:
            - secretRef:
                name: youtubedl-1pw
          volumeMounts:
            - name: media
              mountPath: /incoming
              subPath: video/youtube/Incoming
            - name: media
              mountPath: /organized
              subPath: video/youtube/Organized
            - name: script
              mountPath: /app/watcher.py
              subPath: watcher.py
              readOnly: true
            - name: script
              mountPath: /app/backfill_labels.py
              subPath: backfill_labels.py
              readOnly: true
            - name: cache
              mountPath: /cache
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: longhorn-youtubedl-config
        - name: media
          persistentVolumeClaim:
            claimName: smb-media-claim
        - name: script
          configMap:
            name: ytdl-postprocessor-script
        - name: cache
          emptyDir: { }
