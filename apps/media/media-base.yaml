apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  destination:
    namespace: media
    name: in-cluster
  project: apps
  syncPolicy: {}
  source:
    path: apps/media/base
    repoURL: http://gitea.gitea.svc.cluster.local:3000/patrickjmcd/k8s-argo.git
    targetRevision: main
