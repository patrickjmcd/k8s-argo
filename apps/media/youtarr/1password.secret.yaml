# DB credentials for Youtarr's MariaDB. Create the 1Password item
#   vaults/Kubernetes/items/youtarr-db
# with fields: password=<generate one>, root-password=<generate one>
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: youtarr-db-1pw
spec:
  itemPath: "vaults/Kubernetes/items/youtarr-db"
