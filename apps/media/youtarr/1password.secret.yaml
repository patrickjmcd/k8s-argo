# DB credentials for Youtarr's MariaDB. 1Password item
#   vaults/Kubernetes/items/Youtarr
# with fields: password=<generate one>, root-password=<generate one>
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: youtarr-db-1pw
spec:
  itemPath: "vaults/Kubernetes/items/Youtarr"
---
# ANTHROPIC_API_KEY etc. for the postprocessor. Same 1Password item the old
# youtubedl app used (removed Oct 2026); now owned here.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: youtarr-postprocessor-1pw
spec:
  itemPath: "vaults/Kubernetes/items/youtubedl"
