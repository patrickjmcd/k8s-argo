# Shelfmark: search for one book, pick a release, done -- no authors to
# monitor (replaces Readarr). Searches Prowlarr, sends NZBs to SABnzbd
# (category books -> /mnt/media/downloads/complete/Books), then moves the file
# into Calibre-Web Automated's ingest folder (apps/media/calibre-web).
# Direct downloads (Anna's Archive etc.) stay off.
apiVersion: homelab.pmcd.io/v1alpha1
kind: HomelabApp
metadata:
  name: shelfmark
  namespace: media
spec:
  image: ghcr.io/calibrain/shelfmark:v1.6.2
  port: 80
  containerPort: 8084
  # API keys: SABNZBD_API_KEY comes in under its own name; Prowlarr's is
  # renamed below with a $(VAR) reference.
  envFromSecrets:
    - prowlarr-1pw
    - sabnzbd-1pw
  env:
    TZ: America/Chicago
    PUID: "1000"
    PGID: "1000"
    ONBOARDING: "false"
    # Internal hostname only, like the *arr apps.
    AUTH_METHOD: none
    CALIBRE_WEB_URL: https://books.x.pmcd.io
    SEARCH_MODE: universal
    BOOK_LANGUAGE: en
    # Onboarding is skipped, so the metadata provider has to be enabled here.
    METADATA_PROVIDER: openlibrary
    OPENLIBRARY_ENABLED: "true"
    DIRECT_DOWNLOAD_ENABLED: "false"
    PROWLARR_ENABLED: "true"
    PROWLARR_URL: http://prowlarr.media.svc.cluster.local
    PROWLARR_API_KEY: $(PROWLARR__AUTH__APIKEY)
    PROWLARR_USENET_CLIENT: sabnzbd
    SABNZBD_URL: http://sabnzbd.media.svc.cluster.local
    SABNZBD_CATEGORY: books
    # Leaves SABnzbd's history clean once the file is in CWA.
    PROWLARR_USENET_ACTION: move
    BOOKS_OUTPUT_MODE: folder
    INGEST_DIR: /cwa-book-ingest
    # Wanted list: books on the Hardcover "Want to Read" shelf become requests
    # every hour and are searched until found (backing off to every few days
    # when nothing matches), then removed from the shelf once downloaded.
    # HARDCOVER_SYNC_TOKEN (no "Bearer " prefix) comes from shelfmark-1pw.
    # Synced requests need an admin user to own them, which AUTH_METHOD none
    # never creates: /config/users.db holds a passwordless "admin" (created by
    # hand, Nov 2026 -- UserDB("/config/users.db").create_user("admin", role="admin")).
    HARDCOVER_SYNC_ENABLED: "true"
    HARDCOVER_SYNC_STATUSES: "1"
    HARDCOVER_SYNC_CONTENT_TYPE: ebook
    HARDCOVER_SYNC_INTERVAL: "1"
    HARDCOVER_SYNC_INTERVAL_UNIT: hours
    # Auto-download looks each synced book up through the Hardcover metadata
    # provider and skips it without a key; the sync token works as one.
    HARDCOVER_ENABLED: "true"
    HARDCOVER_API_KEY: $(HARDCOVER_SYNC_TOKEN)
    # Shelfmark can't see what's already in CWA (metadata.db is on CWA's RWO
    # volume), so remove owned books from the shelf, or they download again.
    # Empty source priority = every enabled source, i.e. just Prowlarr.
    AUTO_DOWNLOAD_ENABLED: "true"
    # A failed download tries another release an hour later.
    AUTO_DOWNLOAD_FAILURE_RETRY_MINUTES: "60"
  resources:
    cpuRequest: 25m
    memoryRequest: 256Mi
    cpuLimit: "1"
    memoryLimit: 1Gi
  probes:
    liveness:
      enabled: true
  route:
    hostnames:
      - shelfmark.x.pmcd.io
  persistence:
    claimName: longhorn-shelfmark-config
    mountPath: /config
  extraVolumes:
    - name: media
      claimName: smb-media-claim
  extraVolumeMounts:
    # Same path SABnzbd writes to, so the completed path it reports resolves.
    - name: media
      mountPath: /mnt/media
    - name: media
      mountPath: /cwa-book-ingest
      subPath: books/cwa-ingest
  onePassword:
    enabled: true
  glance:
    monitor: true
    title: Shelfmark
