# Lives outside the HomelabApp on purpose: kro would delete a PVC it owned if
# persistence were ever toggled off.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-aurral-data
  namespace: media
  labels:
    recurring-job-group.longhorn.io/b2-backup: enabled
    # makes Longhorn sync the label above from this PVC to its volume
    recurring-job.longhorn.io/source: enabled
  annotations:
    # Never prune the data volume, even if the app is removed from git.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  # SQLite db, settings and the artwork cache (capped at 256MB by default).
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
