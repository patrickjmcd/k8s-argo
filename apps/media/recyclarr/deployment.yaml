# Recyclarr 9 runs as a server (no more one-shot `sync`): it syncs TRaSH Guides
# into Sonarr/Radarr on the schedule in settings.yml and keeps track of the
# custom formats/profiles it owns in /state. Layout follows the official chart
# (oci://ghcr.io/recyclarr/charts/recyclarr): API key as a file, config under
# /config/configs read-only, state on a PVC.
# Manual sync: kubectl -n media exec deploy/recyclarr -- recyclarr sync
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recyclarr
  labels:
    app.kubernetes.io/name: recyclarr
spec:
  replicas: 1
  # One server owns the state volume (RWO).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: recyclarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recyclarr
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recyclarr
          image: ghcr.io/recyclarr/recyclarr:9.0.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: TZ
              value: America/Chicago
            - name: RECYCLARR_API_KEY_FILE
              value: /secrets/api-key
            - name: RECYCLARR_DATA_DIR
              value: /data
            - name: RECYCLARR_STATE_DIR
              value: /state
          envFrom:
            - secretRef:
                name: sonarr-1pw
            - secretRef:
                name: radarr-1pw
          ports:
            - name: http
              containerPort: 7982
            - name: management
              containerPort: 7983
          # The first start clones the TRaSH Guides before the server listens.
          startupProbe:
            httpGet:
              path: /livez
              port: management
            periodSeconds: 2
            failureThreshold: 150
          livenessProbe:
            httpGet:
              path: /livez
              port: management
          readinessProbe:
            httpGet:
              path: /readyz
              port: management
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: api-key
              mountPath: /secrets
              readOnly: true
            - name: state
              mountPath: /state
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: configs
              mountPath: /config/configs
              readOnly: true
            - name: settings
              mountPath: /config/settings.yml
              subPath: settings.yml
              readOnly: true
      volumes:
        - name: api-key
          secret:
            secretName: recyclarr-1pw
            items:
              - key: recyclarr-api-key
                path: api-key
        - name: state
          persistentVolumeClaim:
            claimName: longhorn-recyclarr-data
        # Logs and the cloned guides; re-downloaded after a restart.
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: configs
          configMap:
            name: recyclarr-config
        - name: settings
          configMap:
            name: recyclarr-settings
