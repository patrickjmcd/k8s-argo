# /config: artwork cache (MediaCover), the app's own backups and logs.
# Everything that matters is in Postgres (shared-postgres, B2-backed), so this
# is a cache -- no B2 backup labels. Before Oct 2026 /config had no volume at
# all and was wiped on every restart (missing posters/thumbnails).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-prowlarr-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
