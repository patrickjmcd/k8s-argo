apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: media-apps-kustomize
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: bazarr
          - name: jellyfin
          - name: lidarr
          - name: notifiarr
          - name: sabnzbd
          - name: kometa
          - name: youtubedl
          - name: youtarr
          - name: dispatcharr
          - name: ersatztv
          # HomelabApp (kro) instance, not the chart -- see apps/media/tautulli.
          - name: tautulli
          - name: seerr
          - name: radarr
          - name: sonarr
          - name: prowlarr
          - name: readarr
          - name: agregarr
          - name: hdhr2xmltv
          - name: medialyze
          - name: concertarr
          - name: ytdl-triage
  template:
    metadata:
      name: '{{name}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/manifest-generate-paths: .
        # Compare through the API server so CRD defaults (e.g. HomelabApp
        # extraVolumes list items) don't show as permanent drift.
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: apps
      source:
        repoURL: https://github.com/patrickjmcd/k8s-argo.git
        targetRevision: main
        path: 'apps/media/{{name}}'
      destination:
        name: in-cluster
        namespace: media
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
