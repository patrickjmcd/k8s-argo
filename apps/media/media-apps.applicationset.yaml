apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: media-apps
  namespace: argocd
spec:
  # Removing an app from the list (e.g. moving it to media-apps-kustomize)
  # deletes its Application; without this the deletion cascades and takes
  # the app's PVC with it.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - list:
        elements:
          - name: radarr
          - name: sonarr
          - name: prowlarr
          - name: readarr
          - name: agregarr
          - name: tautulli
          - name: hdhr2xmltv
          - name: seerr
          - name: medialyze
          - name: concertarr
          - name: ytdl-triage
  template:
    metadata:
      name: '{{name}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        # Absolute paths: with multi-source apps "." only covers the chart,
        # so values-only commits were served from Argo's manifest cache.
        argocd.argoproj.io/manifest-generate-paths: /charts/homelab-app;/apps/media/{{name}}
    spec:
      project: apps
      sources:
        - repoURL: https://github.com/patrickjmcd/k8s-argo.git
          targetRevision: main
          ref: values
        - path: charts/homelab-app
          repoURL: https://github.com/patrickjmcd/k8s-argo.git
          targetRevision: main
          helm:
            releaseName: '{{name}}'
            valueFiles:
              - $values/apps/media/{{name}}/values.yaml
      destination:
        name: in-cluster
        namespace: media
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: media-apps-kustomize
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: bazarr
          - name: jellyfin
          - name: lidarr
          - name: notifiarr
          - name: sabnzbd
          - name: kometa
          - name: youtubedl
          - name: youtarr
          - name: dispatcharr
          - name: ersatztv
  template:
    metadata:
      name: '{{name}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/manifest-generate-paths: .
    spec:
      project: apps
      source:
        repoURL: https://github.com/patrickjmcd/k8s-argo.git
        targetRevision: main
        path: 'apps/media/{{name}}'
      destination:
        name: in-cluster
        namespace: media
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
