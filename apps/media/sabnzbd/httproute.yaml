apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sabnzbd-httproute
  namespace: media
  annotations:
    glance.pmcd.io/monitor: "true"
    glance.pmcd.io/monitor-title: "SABnzbd"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: default
  hostnames:
    - sabnzbd.x.pmcd.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sabnzbd
          kind: Service
          namespace: media
          port: 80
---
# Public via Cloudflare Tunnel (core/traefik-assets/public-gateway.yaml);
# external-dns creates the DNS record.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sabnzbd-public
  namespace: media
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
      namespace: default
  hostnames:
    - sabnzbd.pmcd.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sabnzbd
          kind: Service
          namespace: media
          port: 80
