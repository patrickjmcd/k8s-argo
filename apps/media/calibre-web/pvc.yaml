# /config: app.db (users, per-user Send-to-Kindle address, SMTP settings) and
# CWA's own state.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-calibre-web-config
  namespace: media
  labels:
    recurring-job-group.longhorn.io/b2-backup: enabled
    recurring-job.longhorn.io/source: enabled
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
# The Calibre library (metadata.db + book files). On Longhorn, not SMB:
# metadata.db is SQLite, which doesn't belong on a network share.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-calibre-web-library
  namespace: media
  labels:
    recurring-job-group.longhorn.io/b2-backup: enabled
    recurring-job.longhorn.io/source: enabled
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
