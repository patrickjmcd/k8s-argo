apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Static site content, mounted into the nginx container by values.yaml.
# Fixed name so the Helm release can reference it.
configMapGenerator:
  - name: joshhawleygop-site
    files:
      - site/index.html

generatorOptions:
  disableNameSuffixHash: true
