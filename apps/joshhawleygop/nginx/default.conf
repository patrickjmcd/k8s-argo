# Replaces the image's /etc/nginx/conf.d/default.conf (http context).
# Access logs are one JSON object per line on stdout, so Alloy ships them to
# Loki and the "joshhawleygop" Grafana dashboard can count visitors.

# Requests arrive Cloudflare -> cloudflared -> Traefik, so $remote_addr is
# the gateway. Cloudflare sets CF-Connecting-IP to the real client.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Kubelet readiness probes hit / every 10s; keep them out of the stats.
map $http_user_agent $loggable {
    ~^kube-probe/ 0;
    default       1;
}

log_format access_json escape=json
    '{"log":"access",'
    '"time":"$time_iso8601",'
    '"ip":"$client_ip",'
    '"country":"$http_cf_ipcountry",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":"$status",'
    '"bytes":"$body_bytes_sent",'
    '"referer":"$http_referer",'
    '"ua":"$http_user_agent",'
    '"host":"$host",'
    '"rt":"$request_time"}';

# Extra domains, and www, 301 to the canonical host. Logged too, so the
# dashboard's "Visits via other domains" panel can count them by host.
server {
    listen      8080;
    server_name www.joshhawleygop.com
                senatorjoshhawley.com www.senatorjoshhawley.com
                joshhawley4senate.com www.joshhawley4senate.com;
    server_tokens off;

    access_log /dev/stdout access_json if=$loggable;

    return 301 https://joshhawleygop.com$request_uri;
}

# The site. build.py writes a flat directory (ConfigMap keys can't contain
# "/"), and this block maps clean URLs onto it:
#   /                 -> index.html
#   /january-6        -> january-6.html
#   /news/<slug>      -> post--<slug>.html
# Anything ending in .html or a trailing slash 301s to its clean URL, so each
# page has exactly one address (matches the canonical tags).
server {
    listen      8080 default_server;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    access_log /dev/stdout access_json if=$loggable;

    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css text/plain text/xml application/xml application/rss+xml image/svg+xml;

    # Server-level headers apply everywhere because no location sets its own
    # add_header (caching uses "expires" instead, which doesn't reset them).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    error_page 404 /404.html;
    location = /404.html { internal; }
    location = /404 { return 404; }

    location = / {
        expires 5m;
        try_files /index.html =404;
    }
    location = /index.html { return 301 /; }

    location ~ ^/news/([a-z0-9-]+)$ {
        expires 5m;
        try_files /post--$1.html =404;
    }
    location ~ ^/post--([a-z0-9-]+)\.html$ { return 301 /news/$1; }
    location ~ ^/(.+)\.html$ { return 301 /$1; }
    location ~ ^/(.+)/$ { return 301 /$1; }

    location = /favicon.ico { access_log off; return 204; }
    location ~ \.(png|svg)$ {
        expires 7d;
    }

    location / {
        expires 5m;
        try_files $uri $uri.html =404;
    }
}
