# Replaces the image's /etc/nginx/conf.d/default.conf (http context).
# Access logs are one JSON object per line on stdout, so Alloy ships them to
# Loki and the "joshhawleygop" Grafana dashboard can count visitors.

# Requests arrive Cloudflare -> cloudflared -> Traefik, so $remote_addr is
# the gateway. Cloudflare sets CF-Connecting-IP to the real client.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Kubelet readiness probes hit / every 10s; keep them out of the stats.
map $http_user_agent $loggable {
    ~^kube-probe/ 0;
    default       1;
}

log_format access_json escape=json
    '{"log":"access",'
    '"time":"$time_iso8601",'
    '"ip":"$client_ip",'
    '"country":"$http_cf_ipcountry",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":"$status",'
    '"bytes":"$body_bytes_sent",'
    '"referer":"$http_referer",'
    '"ua":"$http_user_agent",'
    '"host":"$host",'
    '"rt":"$request_time"}';

# Extra domains 301 to the canonical site. Logged too, so the dashboard's
# "Visits via other domains" panel can count them by host.
server {
    listen      8080;
    server_name senatorjoshhawley.com www.senatorjoshhawley.com
                joshhawley4senate.com www.joshhawley4senate.com;
    server_tokens off;

    access_log /dev/stdout access_json if=$loggable;

    return 301 https://joshhawleygop.com$request_uri;
}

server {
    listen      8080 default_server;
    server_name _;
    server_tokens off;

    access_log /dev/stdout access_json if=$loggable;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
