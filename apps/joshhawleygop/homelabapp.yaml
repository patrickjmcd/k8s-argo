apiVersion: homelab.pmcd.io/v1alpha1
kind: HomelabApp
metadata:
  name: joshhawleygop
  namespace: default
spec:
  image: nginxinc/nginx-unprivileged:1.30.5-alpine
  port: 80
  containerPort: 8080
  resources:
    cpuRequest: 15m
    memoryRequest: 100Mi
    cpuLimit: 100m
    memoryLimit: 256Mi
  probes:
    type: httpGet
    liveness:
      enabled: true
      type: tcpSocket
      timeoutSeconds: 1
      failureThreshold: 3
    startup:
      type: tcpSocket
  route:
    enabled: false
  podAnnotations:
    joshhawleygop/nginx-conf-rev: '3'
  extraVolumes:
  - name: site
    configMap: joshhawleygop-site
  - name: nginx-conf
    configMap: joshhawleygop-nginx
  extraVolumeMounts:
  - name: site
    mountPath: /usr/share/nginx/html
    readOnly: true
  - name: nginx-conf
    mountPath: /etc/nginx/conf.d/default.conf
    subPath: default.conf
    readOnly: true
