# Static site: nginx serving apps/joshhawleygop/site/ (mounted from the
# joshhawleygop-site ConfigMap built by kustomization.yaml).
image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.30.5-alpine"

service:
  port: 80
  containerPort: 8080

resources:
  requests:
    cpu: 15m
    memory: 100Mi
  limits:
    cpu: 100m
    memory: 256Mi

probes:
  readiness:
    type: httpGet
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  liveness:
    enabled: true
    type: tcpSocket
    initialDelaySeconds: 60
    failureThreshold: 3
    periodSeconds: 10
    timeoutSeconds: 1
  startup:
    enabled: true
    type: tcpSocket
    failureThreshold: 30
    periodSeconds: 5

httproute:
  publicHostnames:
    - joshhawleygop.com
  enabled: false

extraVolumes:
  - name: site
    configMap:
      name: joshhawleygop-site

extraVolumeMounts:
  # No subPath, so edits to the ConfigMap propagate without a pod restart.
  - name: site
    mountPath: /usr/share/nginx/html
    readOnly: true
