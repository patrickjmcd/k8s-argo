# Static site: nginx serving apps/joshhawleygop/site/ (mounted from the
# joshhawleygop-site ConfigMap built by kustomization.yaml).
image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.30.5-alpine"

service:
  port: 80
  containerPort: 8080

resources:
  requests:
    cpu: 15m
    memory: 100Mi
  limits:
    cpu: 100m
    memory: 256Mi

probes:
  readiness:
    type: httpGet
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  liveness:
    enabled: true
    type: tcpSocket
    initialDelaySeconds: 60
    failureThreshold: 3
    periodSeconds: 10
    timeoutSeconds: 1
  startup:
    enabled: true
    type: tcpSocket
    failureThreshold: 30
    periodSeconds: 5

httproute:
  publicHostnames:
    - joshhawleygop.com
    - www.joshhawleygop.com
    # Redirect to joshhawleygop.com (nginx/default.conf)
    - senatorjoshhawley.com
    - www.senatorjoshhawley.com
    - joshhawley4senate.com
    - www.joshhawley4senate.com
  enabled: false

extraVolumes:
  - name: site
    configMap:
      name: joshhawleygop-site
  - name: nginx-conf
    configMap:
      name: joshhawleygop-nginx

extraVolumeMounts:
  # No subPath, so edits to the ConfigMap propagate without a pod restart.
  - name: site
    mountPath: /usr/share/nginx/html
    readOnly: true
  # JSON access logs for the Grafana visitor dashboard. subPath mounts don't
  # hot-reload: restart the pod after editing nginx/default.conf.
  - name: nginx-conf
    mountPath: /etc/nginx/conf.d/default.conf
    subPath: default.conf
    readOnly: true
