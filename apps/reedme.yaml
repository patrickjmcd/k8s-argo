apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reedme
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  destination:
    name: in-cluster
    namespace: default
  project: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
  # HomelabApp (core/kro-definitions) instead of the homelab-app chart.
  source:
    path: apps/reedme
    repoURL: https://github.com/patrickjmcd/k8s-argo.git
    targetRevision: main
