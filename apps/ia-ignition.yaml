apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ia-ignition
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  destination:
    namespace: default
    name: in-cluster
  project: apps
  #  syncPolicy:
  #    automated: { }
  source:
    path: apps/ia-ignition
    repoURL: http://gitea.gitea.svc.cluster.local:3000/patrickjmcd/k8s-argo.git
    targetRevision: main
