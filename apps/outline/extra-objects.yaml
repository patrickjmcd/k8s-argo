# S3 key for Outline's bucket on Garage (core/garage); also synced into the
# garage namespace, where the bootstrap Job imports it.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: garage-outline
  namespace: default
spec:
  itemPath: "vaults/Kubernetes/items/garage-outline"
---
# Outline API key (field OUTLINE_API_TOKEN) for the nightly Markdown export.
# Create it in Outline (Settings -> API) as a workspace admin.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: outline-export
  namespace: default
spec:
  itemPath: "vaults/Kubernetes/items/outline-export"
---
# Short alias. Redirects rather than serving: Outline is pinned to
# URL=https://outline.x.pmcd.io (PocketID callback, Garage CORS).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: outline-notes-redirect
  namespace: default
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: default
  hostnames:
    - notes.x.pmcd.io
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: outline.x.pmcd.io
            statusCode: 301
