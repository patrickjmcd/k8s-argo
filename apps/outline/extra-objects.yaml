# S3 key for Outline's bucket on Garage (core/garage); also synced into the
# garage namespace, where the bootstrap Job imports it.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: garage-outline
  namespace: default
spec:
  itemPath: "vaults/Kubernetes/items/garage-outline"
---
# Outline API key (field OUTLINE_API_TOKEN) for the nightly Markdown export.
# Create it in Outline (Settings -> API) as a workspace admin.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: outline-export
  namespace: default
spec:
  itemPath: "vaults/Kubernetes/items/outline-export"
---
# Old and short names. Redirects rather than serving: Outline only works on
# the host in URL (PocketID callback, Garage CORS, OAuth issuer).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: outline-alias-redirect
  namespace: default
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: default
  hostnames:
    - outline.x.pmcd.io
    - notes.x.pmcd.io
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: outline.pmcd.dev
            statusCode: 301
---
# Public side of outline.pmcd.dev (Cloudflare Tunnel): only what the claude.ai
# Outline connector calls from Anthropic's servers -- OAuth discovery, client
# registration, token exchange/revocation and the MCP endpoint itself. The UI,
# /api and /oauth/authorize stay LAN/Tailscale-only, so approving a new
# connection still needs a browser on the internal network.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: outline-public-mcp
  namespace: default
spec:
  parentRefs:
    - name: public-gateway
      namespace: default
  hostnames:
    - outline.pmcd.dev
  rules:
    - matches:
        - path: {type: PathPrefix, value: /mcp}
        - path: {type: Exact, value: /oauth/token}
        - path: {type: Exact, value: /oauth/register}
        - path: {type: Exact, value: /oauth/revoke}
        - path: {type: Exact, value: /.well-known/oauth-authorization-server}
        - path: {type: Exact, value: /.well-known/oauth-protected-resource}
        - path: {type: Exact, value: /.well-known/oauth-protected-resource/mcp}
      backendRefs:
        - name: outline
          port: 80
