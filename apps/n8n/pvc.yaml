apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smb-n8n-claim
  namespace: default
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Mi
  volumeName: smb-n8n
  storageClassName: ''
