# ntfy (ntfy.sh) -- push notifications to phones/desktops over HTTP. Private:
# anonymous access is denied; users and access tokens are provisioned from
# the 1Password item (NTFY_AUTH_USERS / NTFY_AUTH_TOKENS, see below), so the
# auth database never needs hand edits. LAN/Tailscale only.
apiVersion: homelab.pmcd.io/v1alpha1
kind: HomelabApp
metadata:
  name: ntfy
  namespace: ntfy
spec:
  image: binwiederhier/ntfy:v2.34.0
  port: 80
  args:
    - serve
  env:
    TZ: America/Chicago
    NTFY_BASE_URL: https://ntfy.x.pmcd.io
    NTFY_BEHIND_PROXY: "true"
    NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
    NTFY_CACHE_DURATION: 72h
    NTFY_AUTH_FILE: /var/lib/ntfy/user.db
    NTFY_AUTH_DEFAULT_ACCESS: deny-all
    NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
    NTFY_ENABLE_LOGIN: "true"
    # iOS can only get instant pushes through Apple's servers: ntfy forwards a
    # poll request (message ID only, no content) via ntfy.sh, and the app then
    # fetches the message from this server.
    NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
    NTFY_ENABLE_METRICS: "true"
  # From vaults/Kubernetes/items/ntfy:
  #   NTFY_AUTH_USERS  "<user>:<bcrypt hash>:admin" (comma-separated; hash via
  #                    `ntfy user hash`). Users removed here are deleted.
  #   NTFY_AUTH_TOKENS "<user>:tk_<29 chars>:<label>" for publishers
  #                    (Alertmanager, n8n, scripts).
  onePassword:
    enabled: true
  # Webhook templates (ntfy's template-dir default), used as
  # POST /<topic>?template=<file name without .yml>. A template that calls
  # `fail` rejects the request (HTTP 400), so nothing is published: that is
  # how gitea-pr drops every pull_request event except "opened".
  # Gitea system webhook -> /gitea?template=gitea-pr is created by
  # scripts/create-gitea-pr-ntfy-hook.sh. Messages stay plain text (iOS shows
  # markdown literally).
  configMap:
    enabled: true
    mountPath: /etc/ntfy/templates
    data:
      gitea-pr.yml: |
        title: |
          {{- if not (and .pull_request (eq .action "opened")) }}{{ fail "only opened pull requests notify" }}{{ end -}}
          New PR in {{ .repository.full_name }}: #{{ .pull_request.number }}
        message: |
          {{ .pull_request.title }}
          {{ .pull_request.head.ref }} → {{ .pull_request.base.ref }}, by {{ .pull_request.user.login }}
          {{ .pull_request.html_url }}
  resources:
    cpuRequest: 10m
    memoryRequest: 32Mi
    memoryLimit: 256Mi
  probes:
    type: httpGet
    path: /v1/health
    liveness:
      enabled: true
  route:
    hostnames:
    - ntfy.x.pmcd.io
  persistence:
    claimName: longhorn-ntfy-data
    mountPath: /var/lib/ntfy
  glance:
    monitor: true
    title: ntfy
