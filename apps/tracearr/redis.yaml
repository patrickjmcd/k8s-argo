# Cache and job queue only -- nothing durable, so no volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracearr-redis
  namespace: tracearr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracearr-redis
  template:
    metadata:
      labels:
        app: tracearr-redis
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - heavy
      tolerations:
        - key: dedicated
          operator: Equal
          value: heavy
          effect: NoSchedule
      containers:
        - name: redis
          image: redis:8.10.3-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tracearr-redis
  namespace: tracearr
spec:
  selector:
    app: tracearr-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
