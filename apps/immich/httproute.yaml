apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich-httproute
  namespace: immich
  annotations:
    glance.pmcd.io/monitor: "true"
    glance.pmcd.io/monitor-hostname: "immich.x.pmcd.io"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: default
  hostnames:
    # pics.pmcd.dev stays here too: LAN DNS overrides it to 192.168.8.200, so
    # LAN clients reach this route; everyone else comes in via immich-public.
    - pics.pmcd.dev
    - immich.x.pmcd.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 600s
      backendRefs:
        - name: immich-server
          kind: Service
          namespace: immich
          port: 2283
---
# Public via Cloudflare Tunnel (core/traefik-assets/public-gateway.yaml);
# external-dns creates the DNS record.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich-public
  namespace: immich
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
      namespace: default
  hostnames:
    - pics.pmcd.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 600s
      backendRefs:
        - name: immich-server
          kind: Service
          namespace: immich
          port: 2283
