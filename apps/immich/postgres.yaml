apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: immich
spec:
  instances: 3

  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-standard-trixie
    major: 18

  storage:
    storageClass: local-path
    size: 15Gi

  primaryUpdateMethod: switchover

  # Soft-prefer the Pi 5s over the Pi 4s - see core/postgres/cluster.yaml
  # for why (Sep 2026 incident where both this cluster and shared-postgres
  # independently piled replicas onto the weakest nodes in the fleet).
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 80
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - pi5-kube0
                  - pi5-kube1
                  - pi5-kube2
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich-db
  namespace: immich
spec:
  name: app
  owner: app
  cluster:
    name: postgres
  extensions:
    - name: vector
    - name: earthdistance
    - name: cube
    - name: unaccent
    - name: uuid-ossp
    - name: pg_trgm
