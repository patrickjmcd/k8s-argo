apiVersion: homelab.pmcd.io/v1alpha1
kind: HomelabApp
metadata:
  name: homebox-companion
  namespace: default
spec:
  image: ghcr.io/duelion/homebox-companion:3.2.2
  port: 80
  containerPort: 8000
  resources:
    cpuRequest: 25m
    memoryRequest: 256Mi  # 14-day peak 239Mi (was 650Mi)
    cpuLimit: 1000m
    memoryLimit: 512Mi  # ~2x peak, Nov 2026
  probes:
    liveness:
      enabled: true
      initialDelaySeconds: 180
  route:
    hostnames:
    - homebox-companion.x.pmcd.io
  onePassword:
    enabled: true
  env:
    TZ: America/Chicago
