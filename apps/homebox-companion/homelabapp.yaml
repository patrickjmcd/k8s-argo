apiVersion: homelab.pmcd.io/v1alpha1
kind: HomelabApp
metadata:
  name: homebox-companion
  namespace: default
spec:
  image: ghcr.io/duelion/homebox-companion:3.1.1
  port: 80
  containerPort: 8000
  resources:
    cpuRequest: 25m
    memoryRequest: 650Mi
    cpuLimit: 1000m
    memoryLimit: 1Gi
  probes:
    liveness:
      enabled: true
      initialDelaySeconds: 180
  route:
    hostnames:
    - homebox-companion.x.pmcd.io
  onePassword:
    enabled: true
  env:
    TZ: America/Chicago
