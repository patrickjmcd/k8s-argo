apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelable-mcp
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  destination:
    namespace: homelable
    name: in-cluster
  project: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
  source:
    # HomelabApp (core/kro-definitions) instead of the homelab-app chart.
    path: apps/homelable-mcp
    repoURL: https://github.com/patrickjmcd/k8s-argo.git
    targetRevision: main
