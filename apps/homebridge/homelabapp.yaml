apiVersion: homelab.pmcd.io/v1alpha1
kind: HomelabApp
metadata:
  name: homebridge
  namespace: homebridge
spec:
  image: homebridge/homebridge:2026-09-02
  port: 8581
  resources:
    cpuRequest: 25m
    memoryRequest: 128Mi
    cpuLimit: 500m
    memoryLimit: 512Mi
  route:
    hostnames:
    - homebridge.x.pmcd.io
    publicHostnames:
    - homebridge.pmcd.io
  nodeSelector:
    kubernetes.io/hostname: media-server
  hostNetwork: true
  tolerations:
  - key: dedicated
    operator: Equal
    value: heavy
    effect: NoSchedule
  # Longhorn rather than a hostPath on media-server's USB drive: that drive
  # drops off the bus now and then, and an unmounted hostPath would start
  # Homebridge empty (new bridge identity, every accessory re-paired). The
  # old copy stays at media-server:/mnt/usb/homebridge-data as a rollback.
  persistence:
    claimName: longhorn-homebridge-data
    mountPath: /homebridge
