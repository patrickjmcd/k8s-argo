apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-homebridge-data
  namespace: homebridge
  labels:
    recurring-job-group.longhorn.io/b2-backup: enabled
    recurring-job.longhorn.io/source: enabled
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
# Restored from the 2026-10-29 08:07Z B2 backup after longhorn-homebridge-data's
# ext4 was found corrupted at ~08:14Z (same incident as subwave). Static PV so
# the PVC binds to exactly that Longhorn volume.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: homebridge-restore-20261029
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: homebridge-restore-20261029
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-homebridge-data-restored
  namespace: homebridge
  labels:
    recurring-job-group.longhorn.io/b2-backup: enabled
    recurring-job.longhorn.io/source: enabled
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  volumeName: homebridge-restore-20261029
  resources:
    requests:
      storage: 2Gi
