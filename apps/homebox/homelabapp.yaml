apiVersion: homelab.pmcd.io/v1alpha1
kind: HomelabApp
metadata:
  name: homebox
  namespace: default
spec:
  image: ghcr.io/sysadminsmedia/homebox:0.27.1
  port: 80
  containerPort: 7745
  resources:
    cpuRequest: 25m
    memoryRequest: 400Mi
    cpuLimit: 1000m
    memoryLimit: 800Mi
  probes:
    liveness:
      enabled: true
      initialDelaySeconds: 180
  route:
    hostnames:
    - homebox.x.pmcd.io
  onePassword:
    enabled: true
  env:
    TZ: America/Chicago
    HBOX_DATABASE_DRIVER: postgres
    HBOX_DATABASE_HOST: shared-postgres-rw.postgres.svc.cluster.local
    HBOX_DATABASE_PORT: '5432'
    HBOX_DATABASE_USERNAME: homebox
    HBOX_DATABASE_PASSWORD: ''
    HBOX_DATABASE_DATABASE: homebox
    HBOX_DATABASE_SSL_MODE: disable
    HBOX_LABEL_MAKER_PADDING: '5'
    HBOX_LABEL_MAKER_MARGIN: '5'
    HBOX_LABEL_MAKER_WIDTH: '320'
    HBOX_LABEL_MAKER_HEIGHT: '240'
    HBOX_LABEL_MAKER_DYNAMIC_LENGTH: 'false'
    HBOX_LABEL_MAKER_FONT_SIZE: '24'
    # Home Assistant builds the label and prints it on the Niimbot. URL comes
    # first because Homebox drops empty arguments, and the description can be.
    HBOX_LABEL_MAKER_PRINT_COMMAND: sh /scripts/print-label.sh {{.URL}} {{.TitleText}} {{.DescriptionText}}
  configMap:
    enabled: true
    mountPath: /scripts/print-label.sh
    subPath: print-label.sh
    data:
      print-label.sh: |
        #!/bin/sh
        # Posts label fields to the Home Assistant webhook. HBOX_LABEL_WEBHOOK_URL
        # comes from the homebox 1Password item.
        # Asset labels: title = asset ID, description = name + "Location: X".
        # Item labels:  title = name,     description = "Location: X".
        set -eu
        url=$1 title=$2 desc=${3:-}
        esc() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }
        location=$(printf '%s\n' "$desc" | sed -n 's/^Location: //p')
        case $url in
          */a/*) asset=$title name=$(printf '%s\n' "$desc" | sed -n 1p) ;;
          *) asset= name=$title ;;
        esac
        wget -q -O /dev/null --header=Content-Type:application/json \
          --post-data="{\"name\":\"$(esc "$name")\",\"location\":\"$(esc "$location")\",\"asset_id\":\"$(esc "$asset")\",\"qr_url\":\"$(esc "$url")\"}" \
          "$HBOX_LABEL_WEBHOOK_URL"
  persistence:
    claimName: smb-homebox-claim
  glance:
    monitor: true
