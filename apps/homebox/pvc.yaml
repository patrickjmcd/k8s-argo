apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smb-homebox-claim
  namespace: default
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 500Mi
  volumeName: smb-homebox
  storageClassName: ''
