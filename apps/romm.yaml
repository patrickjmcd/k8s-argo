apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: romm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  destination:
    namespace: romm
    name: in-cluster
  project: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - repoURL: https://github.com/patrickjmcd/k8s-argo.git
      targetRevision: main
      ref: values
    - path: charts/homelab-app
      repoURL: https://github.com/patrickjmcd/k8s-argo.git
      targetRevision: main
      helm:
        releaseName: romm
        valueFiles:
          - $values/apps/romm/values.yaml
    - path: apps/romm
      repoURL: https://github.com/patrickjmcd/k8s-argo.git
      targetRevision: main
