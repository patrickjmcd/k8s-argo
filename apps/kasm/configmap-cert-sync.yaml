# LinuxServer custom service (s6, from /custom-services.d): installs the
# cert-manager certificate (/certs) over both self-signed certs Kasm makes and
# re-syncs on renewal:
#   - the setup wizard (:3000), /opt/kasm/certs/kasm_wizard.* -- generated by
#     the image's init; node reads it once at start, so restart the service.
#   - the Kasm proxy (:443), /opt/kasm/current/certs/kasm_nginx.* -- generated
#     by the install, so only present once the wizard has run; reload nginx.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kasm-cert-sync
  namespace: kasm
data:
  kasm-cert-sync: |
    #!/usr/bin/with-contenv bash
    SRC=/certs

    # sync_cert <dir> <name>: copy tls.crt/tls.key to <dir>/<name>.{crt,key} if
    # they differ; returns 0 only when something changed.
    sync_cert() {
      local crt="$1/$2.crt" key="$1/$2.key"
      [ -d "$1" ] || return 1
      cmp -s "$SRC/tls.crt" "$crt" && cmp -s "$SRC/tls.key" "$key" && return 1
      # Write in place (not cp/mv) so the file's inode, owner and mode stay
      # the same -- the proxy container bind-mounts these files.
      cat "$SRC/tls.crt" > "$crt"
      cat "$SRC/tls.key" > "$key"
      echo "kasm-cert-sync: installed kasm.pmcd.dev certificate as $crt"
    }

    while true; do
      if [ -s "$SRC/tls.crt" ] && [ -s "$SRC/tls.key" ]; then
        if sync_cert /opt/kasm/certs kasm_wizard; then
          s6-svc -r /run/service/svc-kasm-wizard
        fi
        if sync_cert /opt/kasm/current/certs kasm_nginx; then
          docker exec kasm_proxy nginx -s reload \
            || echo "kasm-cert-sync: kasm_proxy not running; it will load the cert on start"
        fi
      fi
      sleep 300
    done
