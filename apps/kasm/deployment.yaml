# Kasm Workspaces via the LinuxServer all-in-one image (testing only). The
# container runs its own Docker daemon and launches every Kasm service and
# workspace session as a nested container, hence privileged. Kasm's official
# Helm chart is the multi-pod production route if this graduates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kasm
  namespace: kasm
  labels:
    app.kubernetes.io/name: kasm
    app.kubernetes.io/instance: kasm
spec:
  replicas: 1
  # Never run two Kasm installs (and inner Docker daemons) on the same
  # hostPath at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kasm
      app.kubernetes.io/instance: kasm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kasm
        app.kubernetes.io/instance: kasm
    spec:
      # Needs an amd64 node with real headroom: Kasm plus a few sessions runs
      # 4-8Gi, the Pis and control-plane nodes don't have it. media-server is
      # the dedicated heavy-workload node.
      nodeSelector:
        kubernetes.io/hostname: media-server
      tolerations:
        - key: dedicated
          operator: Equal
          value: heavy
          effect: NoSchedule
      containers:
        - name: kasm
          image: lscr.io/linuxserver/kasm:1.19.0-ls151
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: TZ
              value: America/Chicago
            # Port Kasm's proxy listens on and advertises to sessions; must
            # match the externally reachable port.
            - name: KASM_PORT
              value: "443"
          ports:
            - name: wizard
              containerPort: 3000
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /opt
            - name: profiles
              mountPath: /profiles
            - name: tls
              mountPath: /certs
              readOnly: true
            - name: cert-sync
              mountPath: /custom-services.d
              readOnly: true
          # No CPU limit: session start and image pulls are very bursty.
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 8Gi
          # Readiness only -- a liveness restart would kill the inner Docker
          # daemon and every running session with it. The wizard on 3000 is
          # up from boot; 443 only after the install completes.
          readinessProbe:
            tcpSocket:
              port: wizard
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        # media-server is not a Longhorn node; use the 4.6T USB drive, same as
        # apps/homebridge. ext4, so the inner Docker can use overlay2 on /opt.
        - name: data
          hostPath:
            path: /mnt/usb/kasm-data
            type: DirectoryOrCreate
        - name: profiles
          hostPath:
            path: /mnt/usb/kasm-profiles
            type: DirectoryOrCreate
        - name: tls
          secret:
            secretName: kasm-tls
        - name: cert-sync
          configMap:
            name: kasm-cert-sync
            defaultMode: 0755
