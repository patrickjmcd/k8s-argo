apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-minecraft-data
  namespace: minecraft
  labels:
    recurring-job-group.longhorn.io/b2-backup: enabled
    # makes Longhorn sync the label above from this PVC to its volume
    recurring-job.longhorn.io/source: enabled
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  # best-effort keeps a replica on media-server alongside the pod
  storageClassName: longhorn-best-effort
  resources:
    requests:
      storage: 20Gi
