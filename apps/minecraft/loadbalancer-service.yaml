# Raw TCP/UDP game ports can't go through the Traefik Gateway, so the server
# gets its own MetalLB IP. Internal + Tailscale only -- not port-forwarded.
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: minecraft
  annotations:
    # See apps/nats/loadbalancer-service.yaml for why kube-vip is excluded
    # from MetalLB-managed LoadBalancer IPs on this cluster.
    kube-vip.io/ignore: "true"
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.8.202
  selector:
    app.kubernetes.io/name: minecraft
  ports:
    - name: java
      port: 25565
      targetPort: java
      protocol: TCP
    - name: bedrock
      port: 19132
      targetPort: bedrock
      protocol: UDP
