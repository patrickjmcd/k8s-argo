image:
  repository: ghcr.io/druggeri/nut_exporter
  tag: "3.3.0"

service:
  port: 9199
  portName: http

httproute:
  enabled: false

serviceMonitor:
  enabled: true
  path: /ups_metrics
  port: http

# Talks to the NUT server (upsd) already running on pve (Trigkey), which has
# the Tripp Lite UPS on USB. Only one UPS is visible, so no `ups=` query
# param is needed. upsd allows unauthenticated reads, so no credentials.
env:
  NUT_EXPORTER_SERVER: "192.168.1.12"
  NUT_EXPORTER_SERVERPORT: "3493"

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
