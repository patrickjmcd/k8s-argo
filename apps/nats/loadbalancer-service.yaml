---
# Exposes the NATS client port (4222) on a MetalLB IP so the upstairs Pi
# (192.168.1.x) can publish to it. The chart's own Service stays ClusterIP;
# this is a second, LAN-facing Service we own.
apiVersion: v1
kind: Service
metadata:
  name: nats-lan
  # No fixed IP — let MetalLB auto-assign a free address from the pool
  # (.200 = Traefik, .201 = wyoming-whisper were taken). Read the assigned
  # IP with: kubectl -n nats get svc nats-lan
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: nats
    app.kubernetes.io/instance: nats
    # component distinguishes the server pod from the nats-box utility pod
    # (both share name+instance) — without it the LB also targets nats-box,
    # which doesn't listen on 4222.
    app.kubernetes.io/component: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
      protocol: TCP
