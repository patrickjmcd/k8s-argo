---
# Exposes the NATS client port (4222) on a LAN-reachable IP so the upstairs
# Pi (192.168.1.x) can publish to it. The chart's own Service stays
# ClusterIP; this is a second, LAN-facing Service we own.
apiVersion: v1
kind: Service
metadata:
  name: nats-lan
  annotations:
    # ROLLED BACK from kube-vip 2026-09-01: kube-vip successfully won
    # leader election and inserted the ARP/IP twice (confirmed in its own
    # logs) but never populated Service.status.loadBalancer, so kube-proxy
    # never programmed the DNAT rule and nats-lan stayed unreachable both
    # times. Parked back on MetalLB pending investigation.
    kube-vip.io/ignore: "true"
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.8.205
  selector:
    app.kubernetes.io/name: nats
    app.kubernetes.io/instance: nats
    # component distinguishes the server pod from the nats-box utility pod
    # (both share name+instance) — without it the LB also targets nats-box,
    # which doesn't listen on 4222.
    app.kubernetes.io/component: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
      protocol: TCP
