---
# Exposes the NATS client port (4222) on a LAN-reachable IP so the upstairs
# Pi (192.168.1.x) can publish to it. The chart's own Service stays
# ClusterIP; this is a second, LAN-facing Service we own.
apiVersion: v1
kind: Service
metadata:
  name: nats-lan
  # Migrated to kube-vip. Root cause of the first failed attempt: MetalLB
  # and kube-vip were both still watching this Service concurrently (.205
  # stayed in MetalLB's pool during the cutover), which raced writes to
  # Service.status.loadBalancer. This time .205 was excluded from
  # MetalLB's pool (core/metallb-system/ip-address-pool.yaml) BEFORE this
  # annotation was removed, and the object gets deleted/recreated fresh
  # rather than toggling kube-vip.io/ignore on a live object — kube-vip's
  # AddOrModify() does no teardown on an ignore->unignore transition
  # (matches kube-vip/kube-vip#953), so a fresh create avoids that path
  # entirely.
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.8.205
  selector:
    app.kubernetes.io/name: nats
    app.kubernetes.io/instance: nats
    # component distinguishes the server pod from the nats-box utility pod
    # (both share name+instance) — without it the LB also targets nats-box,
    # which doesn't listen on 4222.
    app.kubernetes.io/component: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
      protocol: TCP
