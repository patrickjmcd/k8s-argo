image:
  repository: ghcr.io/sirkirby/unifi-network-mcp
  tag: "0.32.6"

service:
  port: 3000

env:
  UNIFI_MCP_HTTP_ENABLED: "true"
  UNIFI_MCP_HOST: "0.0.0.0"
  UNIFI_MCP_PORT: "3000"
  UNIFI_NETWORK_VERIFY_SSL: "false"
  # UNIFI_MCP_ALLOWED_HOSTS is set correctly but the SDK's host-and-port
  # matcher still rejects the bare hostname after its own normalization —
  # confirmed at the exact deployed tag (network/v0.32.5), looks like an
  # upstream matcher bug. The maintainer's own comment in runtime.py says to
  # disable DNS-rebinding protection for "Kubernetes/proxy deployments where
  # allowed_hosts is insufficient" — exactly this case. Safe to do because
  # BasicAuth (below) now provides the actual authentication this check was
  # compensating for on an otherwise-unauthenticated server.
  UNIFI_MCP_ALLOWED_HOSTS: "unifi-mcp.x.pmcd.io"
  UNIFI_MCP_ENABLE_DNS_REBINDING_PROTECTION: "false"

onePassword:
  enabled: true
  itemPath: "vaults/Kubernetes/items/unifi-mcp"

envFrom:
  - secretRef:
      name: unifi-mcp-1pw

resources:
  requests:
    cpu: 15m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

httproute:
  enabled: true
  hostnames:
    - unifi-mcp.x.pmcd.io
  middlewares:
    - name: unifi-mcp-basicauth

# unifi-mcp has no authentication of its own (HTTP transport is documented as
# "unauthenticated, keep it on loopback"). BasicAuth here is the "authenticated
# proxy" the maintainer's docs call for when exposing it beyond localhost.
# Secret has a single 'users' key (htpasswd-format lines) per Traefik's
# loadAuthCredentials — https://doc.traefik.io/traefik/middlewares/http/basicauth/
extraObjects:
  - apiVersion: onepassword.com/v1
    kind: OnePasswordItem
    metadata:
      name: unifi-mcp-basicauth
      namespace: default
    spec:
      itemPath: "vaults/Kubernetes/items/unifi-mcp-basicauth"
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: unifi-mcp-basicauth
      namespace: default
    spec:
      basicAuth:
        secret: unifi-mcp-basicauth  # security-agent: ignore — k8s Secret name, not a credential
