apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: unifi-mcp-basicauth
  namespace: default
spec:
  itemPath: vaults/Kubernetes/items/unifi-mcp-basicauth
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: unifi-mcp-basicauth
  namespace: default
spec:
  basicAuth:
    secret: unifi-mcp-basicauth
