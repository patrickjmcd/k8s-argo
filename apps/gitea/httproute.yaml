apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea
  annotations:
    glance.pmcd.io/monitor: "true"
    glance.pmcd.io/monitor-title: "Gitea"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: default
  hostnames:
    - git.x.pmcd.io
  rules:
    - backendRefs:
        - name: gitea
          port: 3000
