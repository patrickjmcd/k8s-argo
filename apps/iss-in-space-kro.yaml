apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iss-in-space-kro
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  destination:
    namespace: default
    name: in-cluster
  project: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # The HomelabApp CRD is generated by kro from core/kro-definitions and
      # may not exist yet on the first sync.
      - SkipDryRunOnMissingResource=true
  source:
    path: apps/iss-in-space-kro
    repoURL: https://github.com/patrickjmcd/k8s-argo.git
    targetRevision: main
