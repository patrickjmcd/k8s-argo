# S3 key for Kaneo's bucket on Garage (core/garage), shared with the garage
# namespace, where the bootstrap Job imports it.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: garage-kaneo
  namespace: kaneo
spec:
  itemPath: "vaults/Kubernetes/items/garage-kaneo"
---
# Short alias. Redirects rather than serving: better-auth only trusts
# KANEO_CLIENT_URL (kaneo.x.pmcd.io), as do the PocketID callback and Garage CORS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kaneo-tasks-redirect
  namespace: kaneo
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: default
  hostnames:
    - tasks.x.pmcd.io
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: kaneo.x.pmcd.io
            statusCode: 301
