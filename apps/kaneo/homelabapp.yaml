# Kaneo (kaneo.app) -- project management. Bundled image: nginx serves the web
# app on 5173 and proxies /api to the API (1337) in the same container.
# Database: kaneo on the shared CNPG cluster (core/postgres), trust auth.
apiVersion: homelab.pmcd.io/v1alpha1
kind: HomelabApp
metadata:
  name: kaneo
  namespace: kaneo
spec:
  image: ghcr.io/usekaneo/kaneo:2.34.0
  port: 80
  containerPort: 5173
  env:
    TZ: America/Chicago
    KANEO_CLIENT_URL: https://kaneo.x.pmcd.io
    DATABASE_URL: postgresql://kaneo@shared-postgres-rw.postgres.svc.cluster.local:5432/kaneo?sslmode=disable
    DISABLE_GUEST_ACCESS: "true"
    # Sign-in via PocketID (OIDC client "Kaneo"); CUSTOM_OAUTH_CLIENT_ID and
    # CUSTOM_OAUTH_CLIENT_SECRET come from the 1Password item. New accounts can
    # only be created through PocketID -- who gets in is controlled there.
    CUSTOM_OAUTH_DISCOVERY_URL: https://auth.pmcd.dev/.well-known/openid-configuration
    CUSTOM_OAUTH_AUTHORIZATION_URL: https://auth.pmcd.dev/authorize
    CUSTOM_OAUTH_TOKEN_URL: https://auth.pmcd.dev/api/oidc/token
    CUSTOM_OAUTH_USER_INFO_URL: https://auth.pmcd.dev/api/oidc/userinfo
    CUSTOM_OAUTH_LOGOUT_URL: https://auth.pmcd.dev/api/oidc/end-session
    CUSTOM_OAUTH_SCOPES: openid,profile,email
    CUSTOM_AUTH_PKCE: "true"
    DISABLE_PASSWORD_REGISTRATION: "true"
    # Skip Kaneo's sign-in page and go straight to PocketID. The local password
    # account still exists (linked to the PocketID identity); to get the login
    # form back, e.g. if PocketID is down, set this to "false".
    CUSTOM_OAUTH_AUTO_LOGIN: "true"
    # Uploads (task images, attachments) on Garage (core/garage). Browsers PUT
    # via presigned URLs, so the endpoint must be the public one; CORS for
    # kaneo.x.pmcd.io is set by Garage's bootstrap Job.
    S3_ENDPOINT: https://s3.x.pmcd.io
    S3_BUCKET: kaneo
    S3_REGION: garage
    S3_FORCE_PATH_STYLE: "true"
  # AUTH_SECRET, NOTIFICATION_SECRET_ENCRYPTION_KEY, CUSTOM_OAUTH_CLIENT_ID and
  # CUSTOM_OAUTH_CLIENT_SECRET, from vaults/Kubernetes/items/kaneo. Both must stay stable: changing
  # AUTH_SECRET signs everyone out, and the notification key decrypts stored
  # webhook/notification secrets.
  onePassword:
    enabled: true
  # S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY for the Garage bucket
  envFromSecrets:
    - garage-kaneo
  resources:
    cpuRequest: 50m
    memoryRequest: 256Mi
    cpuLimit: 1000m
    memoryLimit: 768Mi
  probes:
    type: httpGet
    path: /api/health
    startup:
      # first boot runs database migrations
      failureThreshold: 60
    liveness:
      enabled: true
  route:
    hostnames:
      - kaneo.x.pmcd.io
  glance:
    monitor: true
