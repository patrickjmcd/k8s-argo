# Flux never creates namespaces (Argo did via CreateNamespace=true). Never
# pruned: deleting a Namespace deletes everything in it.
apiVersion: v1
kind: Namespace
metadata:
  name: kaneo
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
    kustomize.toolkit.fluxcd.io/prune: disabled
