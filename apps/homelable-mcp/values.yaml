image:
  repository: ghcr.io/pouzor/homelable-mcp
  tag: "3.4.1"

service:
  port: 8001

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

probes:
  readiness:
    type: tcpSocket
  liveness:
    enabled: true
    type: tcpSocket
    initialDelaySeconds: 30
  startup:
    enabled: true
    type: tcpSocket

httproute:
  enabled: false

# Reuses the OnePasswordItem created by the backend app (apps/homelable-backend) —
# same secret, MCP_API_KEY / MCP_SERVICE_KEY fields. Not owned here to avoid two
# Applications both managing the same OnePasswordItem resource.
env:
  BACKEND_URL: "http://backend:8000"

envFrom:
  - secretRef:
      name: homelable-backend-1pw
