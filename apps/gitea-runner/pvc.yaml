# Holds only .runner (the registration act_runner gets from Gitea), so a
# restart doesn't register a duplicate runner. Nothing worth backing up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-gitea-runner-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
