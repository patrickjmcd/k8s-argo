# SilverBullet data root: accounts, spaces and the notes themselves (plain
# Markdown under /data/notes). Nightly to B2.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-silverbullet-data
  namespace: default
  labels:
    recurring-job-group.longhorn.io/b2-backup: enabled
    recurring-job.longhorn.io/source: enabled
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
