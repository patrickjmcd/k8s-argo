apiVersion: v1
kind: Service
metadata:
  name: wyoming-openwakeword
  namespace: voice-assistant
  annotations:
    # kube-vip pilot is nats-lan only for now.
    kube-vip.io/ignore: "true"
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.8.203
  selector:
    app: wyoming-openwakeword
  ports:
    - name: wyoming
      port: 10400
      targetPort: 10400
      protocol: TCP
