apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyoming-piper
  namespace: voice-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wyoming-piper
  template:
    metadata:
      labels:
        app: wyoming-piper
    spec:
      # Runs anywhere (multi-arch image, no hardware needs). Prefer the
      # x86 MacBook since synthesis is noticeably faster than on a Pi, but
      # fall back to any node when it's down.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - macbook-debian
      tolerations:
        - effect: NoExecute
          key: node.kubernetes.io/not-ready
          operator: Exists
          tolerationSeconds: 30
        - effect: NoExecute
          key: node.kubernetes.io/unreachable
          operator: Exists
          tolerationSeconds: 30
      containers:
        - name: wyoming-piper
          image: rhasspy/wyoming-piper:2.5.2
          args:
            - --uri
            - tcp://0.0.0.0:10200
            - --voice
            - en_US-lessac-medium
            - --data-dir
            - /data
            - --download-dir
            - /data
          ports:
            - name: wyoming
              containerPort: 10200
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            tcpSocket:
              port: 10200
            failureThreshold: 18
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 10200
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        # Voice model (~60MB) re-downloads on start; not worth a PVC now
        # that the pod is free to move between nodes.
        - name: data
          emptyDir: {}
