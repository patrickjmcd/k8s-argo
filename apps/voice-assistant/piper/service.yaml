apiVersion: v1
kind: Service
metadata:
  name: wyoming-piper
  namespace: voice-assistant
  annotations:
    # kube-vip pilot is nats-lan only for now.
    kube-vip.io/ignore: "true"
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.8.202
  selector:
    app: wyoming-piper
  ports:
    - name: wyoming
      port: 10200
      targetPort: 10200
      protocol: TCP
