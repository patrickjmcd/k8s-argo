apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deployment.yaml
- httproute.yaml
- service.yaml
- storage.yaml
- 1password.secret.yaml

images:
- name: ia-ignition
  newName:  inductiveautomation/ignition
  # Pinned exact patch version -- the floating "8.3" tag let nodes cache
  # different patch releases via imagePullPolicy: IfNotPresent, and scheduling
  # onto a node with an older cached patch than what's already on the PVC
  # causes Ignition to refuse to start ("Version mismatch on existing volume").
  newTag: "8.3.9"

configMapGenerator:
  - name: ia-ignition-config
    envs:
      - .env
  - name: ignition-config-scripts
    files:
      - scripts/seed-data-volume.sh
      - scripts/seed-redundancy.sh
      - scripts/prepare-gan-certificates.sh
      - scripts/prepare-tls-certificates.sh
      - scripts/invoke-args.sh
      - scripts/redundant-health-check.sh
  - name: ignition-config-files
    files:
      - config/redundancy-primary.xml
      - config/redundancy-backup.xml
      - config/logback.xml