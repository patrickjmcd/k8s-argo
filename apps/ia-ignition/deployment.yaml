apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: ia-ignition
    app.kubernetes.io/name: ia-ignition
  name: ia-ignition
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: ia-ignition
      app.kubernetes.io/name: ia-ignition
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: ia-ignition
        app.kubernetes.io/name: ia-ignition
    spec:
      initContainers:
        - name: preconfigure
          image: inductiveautomation/ignition:latest
          command:
            - /config/scripts/invoke-args.sh
          args:
            - /config/scripts/seed-data-volume.sh
            - /config/scripts/seed-redundancy.sh
            - cp /config/files/logback.xml /data/logback.xml
          volumeMounts:
            - mountPath: /data
              name: appconfig
            - mountPath: /config/files
              name: ignition-config-files
            - mountPath: /config/scripts
              name: ignition-config-scripts
        # MQTT Engine + Transmission (Cirrus Link) and the Flint Designer Bridge
        # aren't in the base image and user-lib/modules/ isn't on the PVC -- it's
        # baked into the image, so anything copied there directly on a running
        # pod is lost on restart. This seeds a shared emptyDir with the image's
        # ORIGINAL modules (so we don't lose alarm-notification/opcua/etc by
        # overlaying the path) plus the extra .modl files staged on the data PVC
        # (uploaded once via `kubectl cp` -- third-party binaries, not committed
        # to git). modules.json (on the PVC, /data/modules.json) already has all
        # module IDs registered pointing at these exact filenames.
        - name: install-extra-modules
          image: inductiveautomation/ignition:latest
          command:
            - sh
            - -c
            - |
              cp -a /usr/local/bin/ignition/user-lib/modules/. /shared-modules/
              cp "/data/extra-modules/MQTT Engine-module.modl" "/shared-modules/MQTT Engine-module.modl"
              cp "/data/extra-modules/MQTT Transmission-module.modl" "/shared-modules/MQTT Transmission-module.modl"
              cp "/data/extra-modules/Flint-Designer-Bridge-1.2.0-8.3.modl" "/shared-modules/Flint-Designer-Bridge-1.2.0-8.3.modl"
          volumeMounts:
            - mountPath: /data
              name: appconfig
            - mountPath: /shared-modules
              name: extra-modules
      containers:
        - name: ia-ignition
          image: ia-ignition
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ia-ignition-config
            - secretRef:
                name: ia-ignition-1pw
          ports:
            - containerPort: 8088
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: 2000m
              memory: 2Gi
            requests:
              cpu: 1200m
              memory: 1500Mi
          readinessProbe:
            httpGet:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - mountPath: /usr/local/bin/ignition/data
              name: appconfig
            - mountPath: /usr/local/bin/ignition/user-lib/modules
              name: extra-modules
      volumes:
        - name: appconfig
          persistentVolumeClaim:
            claimName: longhorn-ia-ignition-config
        - name: extra-modules
          emptyDir: {}
        - name: ignition-config-scripts
          configMap:
            name: ignition-config-scripts
            defaultMode: 0755
        - name: ignition-config-files
          configMap:
            name: ignition-config-files
            defaultMode: 0644
        - name: ignition-gan-ca
          secret:
            secretName: ignition-gan-ca
        - name: gan-tls
          secret:
            secretName: backend-gan-tls