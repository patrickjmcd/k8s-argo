apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: ia-ignition
    app.kubernetes.io/name: ia-ignition
  name: ia-ignition
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  # Sep 2026: required now that the PVC is ReadWriteOnce (see storage.yaml).
  # Default RollingUpdate tries to bring up the new pod before tearing down
  # the old one -- but RWO can only attach to one node at a time, so the new
  # pod deadlocks waiting for a volume the old pod won't release until the
  # new one is Ready. Recreate tears down first, avoiding the deadlock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: ia-ignition
      app.kubernetes.io/name: ia-ignition
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: ia-ignition
        app.kubernetes.io/name: ia-ignition
    spec:
      initContainers:
        - name: preconfigure
          image: ia-ignition
          imagePullPolicy: IfNotPresent
          command:
            - /config/scripts/invoke-args.sh
          args:
            - /config/scripts/seed-data-volume.sh
            - /config/scripts/seed-redundancy.sh
            - cp /config/files/logback.xml /data/logback.xml
          volumeMounts:
            - mountPath: /data
              name: appconfig
            - mountPath: /config/files
              name: ignition-config-files
            - mountPath: /config/scripts
              name: ignition-config-scripts
        # MQTT Engine + Transmission (Cirrus Link) and the Flint Designer Bridge
        # aren't in the base image and user-lib/modules/ isn't on the PVC -- it's
        # baked into the image, so anything copied there directly on a running
        # pod is lost on restart. This seeds a shared emptyDir with only the base
        # image modules this project actually uses (Perspective + WebDev -- this
        # project has no PLC/OPC-UA, historian, reporting, SFC, JDBC, or Kafka
        # use) plus the extra .modl files staged on the data PVC (uploaded once
        # via `kubectl cp` -- third-party binaries, not committed to git).
        #
        # Sep 2026: trimmed from 24 active modules to 5. Not omitting a file
        # here is NOT enough on its own -- Ignition's real module registry is
        # /usr/local/bin/ignition/data/modules.json on the PVC, which also
        # needs each dropped module's "onStartup" set to "disabled" (not just
        # "enabled" left stale), or it logs errors trying to load a module
        # whose file it still expects. A reference copy of the resulting
        # modules.json (5 enabled / 20 disabled) is committed at
        # config/modules.json.trimmed-backup for restoring after a PVC
        # rebuild: `kubectl cp` it to /usr/local/bin/ignition/data/modules.json
        # then restart. Non-fatal side effects observed after disabling:
        # MQTT Engine logs a NoClassDefFoundError probing for the (now absent)
        # Historian module on startup, and a pre-existing OPC-UA server
        # resource fails to deserialize since OPC-UA is disabled -- neither
        # affects Perspective/MQTT Engine/MQTT Transmission functionality.
        #
        # Sep 2026: added Tag-CICD-3.2.1-8.3.modl (bw-design-group/ignition-tag-cicd) so
        # the ignition-tag-sync sidecar below can import tag config pulled from
        # the ignition-ha repo. Same staging convention: .modl downloaded from
        # the module's GitHub releases and `kubectl cp`'d to
        # /data/extra-modules/, not committed to git. Once confirmed loading
        # cleanly, config/modules.json.trimmed-backup needs a matching update
        # -- it's a snapshot of the gateway's real modules.json (with its
        # gateway-generated certFingerprint/licenseAgreementHash), not
        # something to hand-edit; re-capture it from the live gateway with
        # `kubectl cp` after Tag-CICD is confirmed enabled there.
        - name: install-extra-modules
          image: ia-ignition
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              cp "/usr/local/bin/ignition/user-lib/modules/Perspective-module.modl" "/shared-modules/Perspective-module.modl"
              cp "/usr/local/bin/ignition/user-lib/modules/Web Developer Module.modl" "/shared-modules/Web Developer Module.modl"
              cp "/data/extra-modules/MQTT Engine-module.modl" "/shared-modules/MQTT Engine-module.modl"
              cp "/data/extra-modules/MQTT Transmission-module.modl" "/shared-modules/MQTT Transmission-module.modl"
              cp "/data/extra-modules/Flint-Designer-Bridge-1.2.0-8.3.modl" "/shared-modules/Flint-Designer-Bridge-1.2.0-8.3.modl"
              cp "/data/extra-modules/Tag-CICD-3.2.1-8.3.modl" "/shared-modules/Tag-CICD-3.2.1-8.3.modl"
          volumeMounts:
            - mountPath: /data
              name: appconfig
            - mountPath: /shared-modules
              name: extra-modules
      containers:
        - name: ia-ignition
          image: ia-ignition
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ia-ignition-config
          # Only GATEWAY_ADMIN_PASSWORD from ia-ignition-1pw is used -- deliberately
          # NOT pulling IGNITION_ACTIVATION_TOKEN/IGNITION_LICENSE_KEY via envFrom.
          # This gateway runs Maker Edition (free, no activation needed), and the
          # stored token is orphaned from before the data volume was wiped/reseeded
          # (leased activation is bound to gateway identity). Feeding it in just
          # made every boot burn ~1-2 minutes retrying a rejected lease renewal.
          env:
            - name: GATEWAY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ia-ignition-1pw
                  key: GATEWAY_ADMIN_PASSWORD
            # Reuses unifi-toolkit's existing Protect-scoped API key (no new
            # 1Password item) so Perspective gateway scripts can pull camera
            # snapshots from the UniFi Protect integration API.
            - name: UNIFI_PROTECT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: unifi-toolkit-1pw
                  key: UNIFI_API_KEY
          ports:
            - containerPort: 8088
              name: http
              protocol: TCP
          # Sep 2026: no CPU limit -- confirmed via cgroup cpu.stat that the
          # previous 2000m limit was throttling ~33% of scheduling periods
          # (parallel class-loading/JIT/GC threads briefly want more than 2
          # cores even though average usage is ~150-230m), directly slowing
          # startup. Matches this repo's own policy (see CLAUDE.md) for
          # latency-sensitive/critical-path components. CPU request dropped
          # from 1200m (way over actual usage) to 250m, headroom above the
          # ~150-230m steady state and Goldilocks' ~109-150m recommendation.
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 1500Mi
          readinessProbe:
            httpGet:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - mountPath: /usr/local/bin/ignition/data
              name: appconfig
            - mountPath: /usr/local/bin/ignition/user-lib/modules
              name: extra-modules
            # Read-only mirror of the ignition-ha checkout the sidecar below
            # maintains. The Tag CICD import endpoint reads tag files from a
            # gateway-local path (same as its export side, see sync-tags.sh),
            # so the gateway process itself -- not just the sidecar -- needs
            # this on its filesystem.
            - mountPath: /usr/local/bin/ignition/ignition-ha
              name: ignition-ha-tags
              readOnly: true
        # Git -> gateway one-way sync for tag configuration. Source of truth
        # is github.com/patrickjmcd/ignition-ha (private); exporting FROM the
        # gateway stays a manual Designer -> PR -> merge step (see that repo's
        # README) -- this sidecar only ever pulls and imports, it never pushes.
        # No maintained image exists for this, hence installing git/curl at
        # startup on a pinned alpine base rather than a purpose-built one.
        - name: ignition-tag-sync
          image: alpine:3.22
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              apk add --no-cache git curl jq openssh-client
              exec /config/scripts/sync-tags.sh
          env:
            - name: GATEWAY_URL
              value: http://localhost:8088
            - name: IGNITION_HA_REPO
              value: git@github.com:patrickjmcd/ignition-ha.git
            # Path the gateway container sees the same checkout at (see its
            # ignition-ha-tags mount above) -- passed to the import endpoint
            # as filePath, gateway-install-dir-relative, not this container's
            # own /data mount path.
            - name: GATEWAY_LOCAL_REPO_PATH
              value: ignition-ha
            - name: SYNC_INTERVAL_SECONDS
              value: "300"
            - name: TAG_CICD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ia-ignition-1pw
                  key: TAG_CICD_API_TOKEN
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 32Mi
          volumeMounts:
            - mountPath: /config/scripts
              name: ignition-config-scripts
            - mountPath: /data
              name: ignition-ha-tags
            - mountPath: /run/secrets/ignition-ha-deploy-key
              name: ignition-ha-deploy-key
              readOnly: true
      volumes:
        - name: appconfig
          persistentVolumeClaim:
            claimName: longhorn-ia-ignition-config-rwo
        - name: extra-modules
          emptyDir: {}
        - name: ignition-config-scripts
          configMap:
            name: ignition-config-scripts
            defaultMode: 0755
        - name: ignition-config-files
          configMap:
            name: ignition-config-files
            defaultMode: 0644
        - name: ignition-gan-ca
          secret:
            secretName: ignition-gan-ca
        - name: gan-tls
          secret:
            secretName: backend-gan-tls
        - name: ignition-ha-tags
          emptyDir: {}
        - name: ignition-ha-deploy-key
          secret:
            secretName: ia-ignition-1pw
            defaultMode: 0400
            items:
              # 1Password field is stored base64-encoded (see sync-tags.sh
              # comment for why) -- decoded into the id_ed25519 sync-tags.sh
              # actually uses on first run.
              - key: IGNITION_HA_DEPLOY_KEY
                path: id_ed25519.b64