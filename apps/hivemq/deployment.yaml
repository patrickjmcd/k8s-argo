apiVersion: apps/v1
kind: Deployment
metadata:
  name: hivemq
  namespace: hivemq
  labels:
    app.kubernetes.io/name: hivemq
    app.kubernetes.io/instance: hivemq
spec:
  replicas: 1
  # Default RollingUpdate can schedule the new pod on a different node before
  # the old one terminates -- with a ReadWriteOnce Longhorn volume that's a
  # deadlock (new pod's node can't attach while the old pod still holds it).
  # Recreate avoids it: old pod fully terminates (and detaches) before the
  # new one is created. Fine for a single-replica broker; a few seconds of
  # downtime on rollout is acceptable here.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hivemq
      app.kubernetes.io/instance: hivemq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hivemq
        app.kubernetes.io/instance: hivemq
    spec:
      # Image runs as uid=10000/gid=0 (non-root). Longhorn PVCs provision
      # root:root with no group-write, so the container can't write its
      # data.lock/persistence files without this -- fsGroup makes k8s chown
      # the volume to this group (and applies it as a supplemental group to
      # the container) regardless of the exact uid the image happens to use.
      securityContext:
        fsGroup: 10000
      containers:
        - name: hivemq
          image: hivemq/hivemq-ce:2024.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
            - name: websocket
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /opt/hivemq/data
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: longhorn-hivemq-data
