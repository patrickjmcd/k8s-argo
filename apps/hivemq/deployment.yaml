apiVersion: apps/v1
kind: Deployment
metadata:
  name: hivemq
  namespace: hivemq
  labels:
    app.kubernetes.io/name: hivemq
    app.kubernetes.io/instance: hivemq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hivemq
      app.kubernetes.io/instance: hivemq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hivemq
        app.kubernetes.io/instance: hivemq
    spec:
      containers:
        - name: hivemq
          image: hivemq/hivemq-ce:2024.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
            - name: control-center
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /opt/hivemq/data
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: longhorn-hivemq-data
