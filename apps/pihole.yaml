apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pihole
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  destination:
    namespace: pihole
    name: in-cluster
  project: apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  source:
    path: apps/pihole
    repoURL: http://gitea.gitea.svc.cluster.local:3000/patrickjmcd/k8s-argo.git
    targetRevision: main
