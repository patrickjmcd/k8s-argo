apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  labels:
    app: pihole
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-10-03T20:55:51Z"
    spec:
      initContainers:
        - name: patch-pihole-config
          image: pihole/pihole:2026.10.0
          command:
            - sh
            - -c
            - |
              # Set the /var/ftl paths as real config, not via FTLCONF_ env vars:
              # gravity.sh re-execs itself with sudo, which drops the env, and
              # FTL ignores a toml value it marked "(env)" when the var is
              # missing -- so gravity would update /etc/pihole/gravity.db while
              # FTL reads /var/ftl/gravity.db. Hand-edited toml lines were reset
              # to defaults on startup, so use FTL's own config CLI.
              pihole-FTL --config files.database /var/ftl/pihole-FTL.db
              pihole-FTL --config files.tmp_db /var/ftl/pihole-tmp.db
              pihole-FTL --config files.gravity /var/ftl/gravity.db
              chown -R pihole:pihole /etc/pihole/pihole.toml /etc/pihole/config_backups
              cp -p /etc/pihole/gravity.db /var/ftl/gravity.db 2>/dev/null || true
              TOML=/etc/pihole/pihole.toml
              sed -i 's/^\( *resolveIPv4\) = .*/\1 = false/' "$TOML"
              sed -i 's/^\( *resolveIPv6\) = .*/\1 = false/' "$TOML"
              sed -i 's/^\( *networkNames\) = .*/\1 = false/' "$TOML"
              sed -i 's/^\( *refreshNames\) = .*/\1 = "NONE"/' "$TOML"
          volumeMounts:
            - name: pihole-data
              mountPath: /etc/pihole
            - name: ftl-db
              mountPath: /var/ftl
      containers:
        - name: pihole
          image: pihole/pihole:2026.10.0
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: TZ
              value: "America/Chicago"
            - name: PIHOLE_DNS_1
              value: "1.1.1.1"
            - name: PIHOLE_DNS_2
              value: "8.8.8.8"
            - name: DNSMASQ_LISTENING
              value: "all"
            - name: VIRTUAL_HOST
              value: "pihole.x.pmcd.io"
            - name: FTLCONF_misc_etc_dnsmasq_d
              value: "true"
            - name: FTLCONF_database_maxDBdays
              value: "28"
            - name: FTLCONF_resolver_resolveIPv4
              value: "false"
            - name: FTLCONF_resolver_resolveIPv6
              value: "false"
            - name: FTLCONF_resolver_networkNames
              value: "false"
            - name: FTLCONF_resolver_refreshNames
              value: "NONE"
            - name: FTLCONF_dns_rateLimit_count
              value: "1000"
            - name: FTLCONF_dns_rateLimit_interval
              value: "60"
          envFrom:
            - secretRef:
                name: pihole-1pw
          volumeMounts:
            - name: pihole-data
              mountPath: /etc/pihole
            - name: local-dns-config
              mountPath: /etc/dnsmasq.d
            - name: ftl-db
              mountPath: /var/ftl
            - name: hosts-override
              mountPath: /etc/pihole/hosts/local-overrides
              subPath: local-overrides
          startupProbe:
            exec:
              command:
                - dig
                - +time=2
                - +tries=1
                - x.pmcd.io
                - "@127.0.0.1"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 50
          livenessProbe:
            exec:
              command:
                - dig
                - +time=2
                - +tries=1
                - x.pmcd.io
                - "@127.0.0.1"
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              memory: 600Mi
        # gravity.db lives on the emptyDir (copied in by the initContainer) so
        # FTL reads it from local disk. Gravity updates and list/group edits
        # write there too, so save it back to the PVC whenever it changes or
        # they are lost on the next restart. .backup is a consistent online copy.
        - name: gravity-sync
          image: pihole/pihole:2026.10.0
          env:
            - name: TZ
              value: "America/Chicago"
          command:
            - sh
            - -c
            - |
              SRC=/var/ftl/gravity.db
              DST=/etc/pihole/gravity.db
              while true; do
                if [ -f "$SRC" ] && [ "$SRC" -nt "$DST" ]; then
                  if pihole-FTL sqlite3 "$SRC" ".backup '$DST.sync'"; then
                    chown pihole:pihole "$DST.sync"
                    chmod 640 "$DST.sync"
                    touch -r "$SRC" "$DST.sync"
                    mv "$DST.sync" "$DST"
                    echo "$(date) saved $SRC to $DST"
                  else
                    rm -f "$DST.sync"
                  fi
                fi
                sleep 300
              done
          volumeMounts:
            - name: pihole-data
              mountPath: /etc/pihole
            - name: ftl-db
              mountPath: /var/ftl
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 128Mi
      volumes:
        - name: pihole-data
          persistentVolumeClaim:
            claimName: pihole-data
        - name: local-dns-config
          configMap:
            name: pihole-local-dns
        - name: hosts-override
          configMap:
            name: pihole-hosts-override
        - name: ftl-db
          emptyDir: {}
