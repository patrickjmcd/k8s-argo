apiVersion: v1
kind: ConfigMap
metadata:
  name: pihole-local-dns
data:
  local-dns.conf: |
    address=/x.pmcd.io/192.168.8.200
    # NATS runs on its own MetalLB LoadBalancer, not Traefik — override the
    # wildcard for just this name (dnsmasq resolves by longest match).
    address=/nats.x.pmcd.io/192.168.8.205
    address=/pics.pmcd.dev/192.168.8.200
    host-record=pics.pmcd.dev,192.168.8.200
    address=/jellyfin.pmcd.dev/192.168.8.200
    address=/outline.pmcd.dev/192.168.8.200
    host-record=outline.pmcd.dev,192.168.8.200
    # Minecraft (apps/minecraft) has its own MetalLB IP for raw TCP/UDP.
    address=/minecraft.pmcd.dev/192.168.8.202
    # Switch has no "Add Server" button: send the Lifeboat featured server to
    # BedrockConnect, whose server list hands off to minecraft.pmcd.dev.
    # (Lifeboat itself is unreachable on this network as a result.)
    address=/mco.lbsg.net/192.168.8.203
