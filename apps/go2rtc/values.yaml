image:
  repository: alexxit/go2rtc
  tag: "1.9.14"

service:
  port: 1984

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

probes:
  readiness:
    type: tcpSocket
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  liveness:
    enabled: true
    type: tcpSocket
    initialDelaySeconds: 15
    failureThreshold: 3
    periodSeconds: 10
    timeoutSeconds: 1
  startup:
    enabled: true
    type: tcpSocket
    failureThreshold: 30
    periodSeconds: 2

httproute:
  enabled: true
  hostnames:
    - go2rtc.x.pmcd.io

# Gateway API/HTTPRoute is HTTP-only (L7), so go2rtc's plain RTSP restream
# (port 8554) needs its own LoadBalancer Service to be reachable from the
# LAN at all -- this is what Home Assistant (running outside the cluster)
# points its camera config at, instead of pulling RTSPS from Protect itself.
extraObjects:
  - apiVersion: v1
    kind: Service
    metadata:
      name: go2rtc-rtsp
    spec:
      type: LoadBalancer
      selector:
        app.kubernetes.io/name: go2rtc
        app.kubernetes.io/instance: go2rtc
      ports:
        - name: rtsp
          port: 8554
          targetPort: 8554
          protocol: TCP

onePassword:
  enabled: true
  itemPath: "vaults/Kubernetes/items/go2rtc"

envFrom:
  - secretRef:
      name: go2rtc-1pw

# go2rtc has no built-in env-var expansion in its config file (that's a
# Glance-specific feature elsewhere in this repo, not a general one) -- so
# the streams file is generated at container start from real shell
# variable expansion, then merged with the static config via go2rtc's
# multiple -config flag support.
#
# Streams are pulled via go2rtc's bundled ffmpeg rather than its native RTSP
# client: go2rtc's own SRTP decryption silently fails on UniFi Protect's
# "enableSrtp" RTSPS streams (handshake succeeds, then it drops the producer
# ~0.5s later with nothing logged, even at trace level) -- confirmed ffmpeg
# handles the exact same stream fine. video/audio=copy avoids transcoding
# since the source codecs (H264/opus) are already browser-compatible.
command:
  - "sh"
  - "-c"
  - |
    cat > /tmp/streams.yaml <<EOF
    streams:
      living_room: ffmpeg:$LIVING_ROOM_RTSP_URL#video=copy#audio=copy
      james_bedroom: ffmpeg:$JAMES_BEDROOM_RTSP_URL#video=copy#audio=copy
      backyard: ffmpeg:$BACKYARD_RTSP_URL#video=copy#audio=copy
      front_yard: ffmpeg:$FRONT_YARD_RTSP_URL#video=copy#audio=copy
      doorbell: ffmpeg:$DOORBELL_RTSP_URL#video=copy#audio=copy
      scotties_bedroom: ffmpeg:$SCOTTIES_BEDROOM_RTSP_URL#video=copy#audio=copy
    EOF
    mkdir -p /tmp/static
    cat > /tmp/static/video-rtc.js.b64 <<'B64EOF'
