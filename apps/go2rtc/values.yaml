image:
  repository: alexxit/go2rtc
  tag: "1.9.14"

service:
  port: 1984

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

probes:
  readiness:
    type: tcpSocket
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  liveness:
    enabled: true
    type: tcpSocket
    initialDelaySeconds: 15
    failureThreshold: 3
    periodSeconds: 10
    timeoutSeconds: 1
  startup:
    enabled: true
    type: tcpSocket
    failureThreshold: 30
    periodSeconds: 2

httproute:
  enabled: true
  hostnames:
    - go2rtc.x.pmcd.io

onePassword:
  enabled: true
  itemPath: "vaults/Kubernetes/items/go2rtc"

envFrom:
  - secretRef:
      name: go2rtc-1pw

# go2rtc has no built-in env-var expansion in its config file (that's a
# Glance-specific feature elsewhere in this repo, not a general one) -- so
# the streams file is generated at container start from real shell
# variable expansion, then merged with the static config via go2rtc's
# multiple -config flag support.
command:
  - "sh"
  - "-c"
  - |
    cat > /tmp/streams.yaml <<EOF
    streams:
      living_room: $LIVING_ROOM_RTSP_URL
      james_bedroom: $JAMES_BEDROOM_RTSP_URL
      backyard: $BACKYARD_RTSP_URL
      front_yard: $FRONT_YARD_RTSP_URL
      doorbell: $DOORBELL_RTSP_URL
      scotties_bedroom: $SCOTTIES_BEDROOM_RTSP_URL
    EOF
    exec /usr/local/bin/go2rtc -config /config/go2rtc.yaml -config /tmp/streams.yaml

# Both Home Assistant and the Ignition dashboard pull live video from here
# rather than each maintaining its own RTSPS/token plumbing back to UniFi
# Protect. Source URLs are Protect's internal secure RTSPS streams (port
# 7441, same ones Home Assistant's own UniFi Protect integration uses),
# stored in the go2rtc 1Password item -- see `command` above for how they
# actually get into the running config.
configMap:
  enabled: true
  mountPath: /config/go2rtc.yaml
  subPath: go2rtc.yaml
  data:
    go2rtc.yaml: |
      log:
        level: debug
      api:
        listen: ":1984"
      rtsp:
        listen: ":8554"
      webrtc:
        listen: ":8555"
