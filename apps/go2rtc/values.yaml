image:
  repository: alexxit/go2rtc
  tag: "1.9.14"

service:
  port: 1984

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

probes:
  readiness:
    type: tcpSocket
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  liveness:
    enabled: true
    type: tcpSocket
    initialDelaySeconds: 15
    failureThreshold: 3
    periodSeconds: 10
    timeoutSeconds: 1
  startup:
    enabled: true
    type: tcpSocket
    failureThreshold: 30
    periodSeconds: 2

httproute:
  enabled: true
  hostnames:
    - go2rtc.x.pmcd.io

onePassword:
  enabled: true
  itemPath: "vaults/Kubernetes/items/go2rtc"

envFrom:
  - secretRef:
      name: go2rtc-1pw

command:
  - "/usr/local/bin/go2rtc"
  - "-config"
  - "/config/go2rtc.yaml"

# Both Home Assistant and the Ignition dashboard pull live video from here
# rather than each maintaining its own RTSPS/token plumbing back to UniFi
# Protect. Source URLs are Protect's internal secure RTSPS streams (port
# 7441, same ones Home Assistant's own UniFi Protect integration uses),
# stored in the go2rtc 1Password item and expanded by go2rtc itself at
# startup ($VAR syntax is a native go2rtc config feature).
configMap:
  enabled: true
  mountPath: /config/go2rtc.yaml
  subPath: go2rtc.yaml
  data:
    go2rtc.yaml: |
      api:
        listen: ":1984"
      rtsp:
        listen: ":8554"
      webrtc:
        listen: ":8555"
      streams:
        living_room: ${LIVING_ROOM_RTSP_URL}
        james_bedroom: ${JAMES_BEDROOM_RTSP_URL}
        backyard: ${BACKYARD_RTSP_URL}
        front_yard: ${FRONT_YARD_RTSP_URL}
        doorbell: ${DOORBELL_RTSP_URL}
        scotties_bedroom: ${SCOTTIES_BEDROOM_RTSP_URL}
