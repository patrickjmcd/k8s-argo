# Both Home Assistant and the Ignition dashboard pull live video from here
# rather than each maintaining its own RTSPS/token plumbing back to UniFi
# Protect. Source URLs are Protect's internal secure RTSPS streams (port
# 7441, same ones Home Assistant's own UniFi Protect integration uses),
# stored in the go2rtc 1Password item -- see `command` above for how they
# actually get into the running config.
configMap:
  enabled: true
  mountPath: /config/go2rtc.yaml
  subPath: go2rtc.yaml
  data:
    go2rtc.yaml: |
      log:
        level: debug
        format: text
      api:
        listen: ":1984"
        # static_dir REPLACES go2rtc's built-in asset serving entirely (it
        # doesn't fall back to embedded assets for other paths) -- confirmed
        # by this breaking /video-stream.js with a 404 the first time. So
        # `command` below also copies video-stream.js/video-rtc.js into this
        # same directory alongside our custom player.html, rather than just
        # writing player.html alone.
        static_dir: "/tmp/static"
      rtsp:
        listen: ":8554"
      webrtc:
        listen: ":8555"
