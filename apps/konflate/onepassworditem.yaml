# Fields KONFLATE_TOKEN, KONFLATE_WRITE_TOKEN (a Gitea token, scopes
# write:repository + write:issue) and KONFLATE_WEBHOOK_SECRET, loaded as env
# by the chart (secret.existingSecret). Created by
# scripts/create-konflate-secrets.sh.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: konflate-1pw
  namespace: konflate
spec:
  itemPath: "vaults/Kubernetes/items/konflate"
