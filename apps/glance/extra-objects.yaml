# America/Chicago zone file, mounted as /etc/localtime: the Glance image has no
# tzdata, so it can't honour TZ and would show game times in UTC.
apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-localtime
  namespace: default
binaryData:
  localtime: 
