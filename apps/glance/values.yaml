image:
  repository: glanceapp/glance
  tag: "v0.8.5"

service:
  port: 80
  containerPort: 8080

resources:
  requests:
    cpu: 15m
    memory: 100Mi
  limits:
    cpu: 100m
    memory: 256Mi

probes:
  readiness:
    type: tcpSocket
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  liveness:
    enabled: true
    type: tcpSocket
    initialDelaySeconds: 60
    failureThreshold: 3
    periodSeconds: 10
    timeoutSeconds: 1
  startup:
    enabled: true
    type: tcpSocket
    failureThreshold: 30
    periodSeconds: 5

httproute:
  enabled: true
  hostnames:
    - glance.x.pmcd.io

onePassword:
  enabled: true
  itemPath: "vaults/Kubernetes/items/glance"

envFrom:
  - secretRef:
      name: glance-1pw
  - secretRef:
      name: glance-pihole-1pw
  - secretRef:
      name: glance-radarr-1pw
  - secretRef:
      name: glance-sonarr-1pw

extraObjects:
  - apiVersion: onepassword.com/v1
    kind: OnePasswordItem
    metadata:
      name: glance-pihole-1pw
    spec:
      itemPath: "vaults/Kubernetes/items/pihole"
  - apiVersion: onepassword.com/v1
    kind: OnePasswordItem
    metadata:
      name: glance-radarr-1pw
    spec:
      itemPath: "vaults/Kubernetes/items/radarr"
  - apiVersion: onepassword.com/v1
    kind: OnePasswordItem
    metadata:
      name: glance-sonarr-1pw
    spec:
      itemPath: "vaults/Kubernetes/items/sonarr"

command:
  - "/app/glance"
  - "-config"
  - "/config/glance.yml"

configMap:
  enabled: true
  mountPath: /config/glance.yml
  subPath: glance.yml
  data:
    glance.yml: |
      pages:
        - name: Home
          columns:
            - size: small
              widgets:
                - type: calendar

                - type: search
                  search-engine: duckduckgo
                  bangs:
                    - title: YouTube
                      shortcut: "!yt"
                      url: https://www.youtube.com/results?search_query={QUERY}
                    - title: GitHub
                      shortcut: "!gh"
                      url: https://github.com/search?q={QUERY}
                    - title: Reddit
                      shortcut: "!r"
                      url: https://www.reddit.com/search/?q={QUERY}
                    - title: Hacker News
                      shortcut: "!hn"
                      url: https://hn.algolia.com/?query={QUERY}

                - type: rss
                  limit: 10
                  collapse-after: 3
                  cache: 3h
                  feeds:
                    - url: https://kill-the-newsletter.com/feeds/8xoz2d7l650tjeu4j2xk.xml
                      title: Kill The Newsletter KC
                    - url: https://www.kcur.org/podcast/kansas-city-today/rss.xml
                      title: KCUR
                    - url: https://api.axios.com/feed/
                      title: Axios
                    - url: https://technotim.live/feed.xml
                      title: Techno Tim

                - type: monitor
                  cache: 1m
                  title: Services
                  sites:
                    # Not backed by an in-repo HTTPRoute (external), kept static.
                    - title: Home Assistant
                      url: https://ha.pmcd.dev
                    - title: PocketID
                      url: https://auth.pmcd.dev
                    # BEGIN GLANCE-GENERATED:Services
                    - title: ArgoCD
                      url: https://argo.x.pmcd.io
                    - title: Grafana
                      url: https://grafana.x.pmcd.io
                    - title: Homebox
                      url: https://homebox.x.pmcd.io
                    - title: Immich
                      url: https://immich.x.pmcd.io
                    - title: Logs
                      url: https://logs.x.pmcd.io
                    - title: Longhorn
                      url: https://longhorn.x.pmcd.io
                    - title: Mealie
                      url: https://mealie.x.pmcd.io
                    - title: N8N
                      url: https://n8n.x.pmcd.io
                    - title: Octoprint
                      url: https://octoprint.x.pmcd.io
                    - title: Outline
                      url: https://outline.x.pmcd.io
                    - title: PiHole
                      url: https://pihole.x.pmcd.io
                    - title: Prometheus
                      url: https://prometheus.x.pmcd.io
                    - title: Traefik
                      url: https://traefik.x.pmcd.io
                    - title: Tronbyt
                      url: https://tronbyt.x.pmcd.io
                    - title: Uptime Kuma
                      url: https://status.x.pmcd.io
                    # END GLANCE-GENERATED:Services

                - type: monitor
                  cache: 1m
                  title: Media Services
                  sites:
                    # BEGIN GLANCE-GENERATED:Media Services
                    - title: Agregarr
                      url: https://agregarr.x.pmcd.io
                    - title: Bazarr
                      url: https://bazarr.x.pmcd.io
                    - title: Dispatcharr
                      url: https://dispatcharr.x.pmcd.io
                    - title: Jellyfin
                      url: https://jellyfin.x.pmcd.io
                    - title: Lidarr
                      url: https://lidarr.x.pmcd.io
                    - title: Notifiarr
                      url: https://notifiarr.x.pmcd.io
                    - title: Prowlarr
                      url: https://prowlarr.x.pmcd.io
                    - title: Radarr
                      url: https://radarr.x.pmcd.io
                    - title: Readarr
                      url: https://readarr.x.pmcd.io
                    - title: SABnzbd
                      url: https://sabnzbd.x.pmcd.io
                    - title: Seerr
                      url: https://requests.x.pmcd.io
                    - title: Sonarr
                      url: https://sonarr.x.pmcd.io
                    - title: Tautulli
                      url: https://tautulli.x.pmcd.io
                    - title: Youtube-DL
                      url: https://youtubedl.x.pmcd.io
                    # END GLANCE-GENERATED:Media Services

            - size: full
              widgets:
                - type: rss
                  limit: 10
                  collapse-after: 3
                  cache: 3h
                  style: horizontal-cards
                  feeds:
                    - url: ${RSS_404MEDIA}
                      title: 404 Media

                - type: hacker-news

                - type: videos
                  channels:
                    - UC4eYXhJI4-7wSWc8UNRwD4A # NPR Music
                    - UCJquYOG5EL82sKTfH9aMA9Q # Rick Beato
                    - UCR-DXc1voovS8nhAvccRZhg # Jeff Geerling
                    - UCv6J_jJa8GJqFwQNgNrMuww # ServeTheHome
                    - UCOk-gHyjcWZNj3Br4oxwh0A # Techno Tim

                - type: reddit
                  subreddit: kansascity

                - type: reddit
                  subreddit: selfhosted

            - size: small
              widgets:
                - type: weather
                  location: Kansas City, United States
                  units: imperial

                - type: custom-api
                  title: Cardinals
                  cache: 1h
                  url: https://statsapi.mlb.com/api/v1/teams/138?hydrate=previousSchedule(team,linescore),nextSchedule(team,linescore)
                  template: |
                    {{ $prevAway := "" }}
                    {{ $prevHome := "" }}
                    {{ $prevAwayScore := 0 }}
                    {{ $prevHomeScore := 0 }}
                    {{ $prevFound := false }}
                    {{ range .JSON.Array "teams.0.previousGameSchedule.dates" }}
                      {{ range .Array "games" }}
                        {{ $prevAway = .String "teams.away.team.name" }}
                        {{ $prevHome = .String "teams.home.team.name" }}
                        {{ $prevAwayScore = .Int "teams.away.score" }}
                        {{ $prevHomeScore = .Int "teams.home.score" }}
                        {{ $prevFound = true }}
                      {{ end }}
                    {{ end }}
                    <p class="color-subdue size-h6">LAST</p>
                    {{ if $prevFound }}
                      <div class="flex justify-between">
                        <span>{{ $prevAway }}</span>
                        <span class="color-highlight">{{ $prevAwayScore }}</span>
                      </div>
                      <div class="flex justify-between">
                        <span>{{ $prevHome }}</span>
                        <span class="color-highlight">{{ $prevHomeScore }}</span>
                      </div>
                    {{ else }}
                      <p class="color-subdue">No previous game</p>
                    {{ end }}
                    {{ $nextAway := "" }}
                    {{ $nextHome := "" }}
                    {{ $nextDate := "" }}
                    {{ $nextFound := false }}
                    {{ range .JSON.Array "teams.0.nextGameSchedule.dates" }}
                      {{ range .Array "games" }}
                        {{ if not $nextFound }}
                          {{ $nextAway = .String "teams.away.team.name" }}
                          {{ $nextHome = .String "teams.home.team.name" }}
                          {{ $nextDate = .String "officialDate" }}
                          {{ $nextFound = true }}
                        {{ end }}
                      {{ end }}
                    {{ end }}
                    {{ if $nextFound }}
                      <p class="color-subdue size-h6" style="margin-top: 0.5rem">NEXT</p>
                      <div class="flex justify-between">
                        <span>{{ $nextAway }} @ {{ $nextHome }}</span>
                      </div>
                      <p class="color-subdue size-h4">{{ $nextDate }}</p>
                    {{ end }}

                - type: custom-api
                  title: Chiefs
                  cache: 1h
                  url: https://www.thesportsdb.com/api/v1/json/3/eventsnext.php?id=134931
                  subrequests:
                    last:
                      url: https://www.thesportsdb.com/api/v1/json/3/eventslast.php?id=134931
                  template: |
                    {{ $last := .Subrequest "last" }}
                    <p class="color-subdue size-h6">LAST</p>
                    {{ if eq ($last.JSON.String "results.0.strStatus") "FT" }}
                      <div class="flex justify-between">
                        <span>{{ $last.JSON.String "results.0.strAwayTeam" }}</span>
                        <span class="color-highlight">{{ $last.JSON.Int "results.0.intAwayScore" }}</span>
                      </div>
                      <div class="flex justify-between">
                        <span>{{ $last.JSON.String "results.0.strHomeTeam" }}</span>
                        <span class="color-highlight">{{ $last.JSON.Int "results.0.intHomeScore" }}</span>
                      </div>
                    {{ else }}
                      <p class="color-subdue">No result yet</p>
                    {{ end }}
                    {{ if gt (len (.JSON.Array "events")) 0 }}
                      <p class="color-subdue size-h6" style="margin-top: 0.5rem">NEXT</p>
                      <div class="flex justify-between">
                        <span>{{ .JSON.String "events.0.strAwayTeam" }} @ {{ .JSON.String "events.0.strHomeTeam" }}</span>
                      </div>
                      <p class="color-subdue size-h4">{{ .JSON.String "events.0.dateEventLocal" }} {{ .JSON.String "events.0.strTimeLocal" }}</p>
                    {{ end }}

                - type: dns-stats
                  service: pihole-v6
                  url: https://pihole.x.pmcd.io
                  password: ${WEBPASSWORD}

                - type: custom-api
                  title: Unifi
                  cache: 1m
                  allow-insecure: true
                  url: https://192.168.1.1/proxy/network/api/stat/sites
                  headers:
                    X-API-KEY: ${UNIFI_API_KEY}
                    Accept: application/json
                  template: |
                    <style>
                      .list-horizontal-text.no-bullets-unifi > *:not(:last-child)::after {
                          content: none !important;
                      }
                      .list-horizontal-text.no-bullets-unifi > *:not(:last-child) {
                        margin-right: 1em;
                      }
                    </style>
                    {{ range .JSON.Array "data" }}
                      <div style="display:flex; align-items:center; gap:12px;">
                        <div style="width:40px; height:40px; flex-shrink:0; display:flex; justify-content:center; align-items:center; overflow:hidden;">
                          <img src="https://cdn.jsdelivr.net/gh/selfhst/icons/svg/ubiquiti-unifi-light.svg" width="24" height="24" style="object-fit:contain;">
                        </div>
                        <div style="flex-grow:1; min-width:0;">
                          <a class="size-h4 block text-truncate color-highlight">
                            {{ .String "health.#(subsystem=\"wan\").gw_name" }}
                            {{ if eq (.String "health.#(subsystem=\"wan\").status") "ok" }}
                            <span
                              style="width: 8px; height: 8px; border-radius: 50%; background-color: var(--color-positive); display: inline-block; vertical-align: middle;"
                              data-popover-type="text"
                              data-popover-text="WAN Connected"
                            ></span>
                            {{ else }}
                            <span
                              style="width: 8px; height: 8px; border-radius: 50%; background-color: var(--color-negative); display: inline-block; vertical-align: middle;"
                              data-popover-type="text"
                              data-popover-text="WAN Disconnected"
                            ></span>
                            {{ end }}
                          </a>
                          <ul class="list-horizontal-text no-bullets-unifi">
                            <li data-popover-type="text" data-popover-text="Uptime: {{ printf "%.1f" (div (.Float "health.#(subsystem=\"wan\").gw_system-stats.uptime") 86400) }} Days">
                              <p style="display:inline-flex;align-items:center;">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122.88 99.54" fill="currentColor" stroke="currentColor" stroke-width="0"  class="size-6" style="height:1em;vertical-align:middle;margin-right:0.5em;">
                                    <path d="M73.12,0c6.73,0,13.16,1.34,19.03,3.77c6.09,2.52,11.57,6.22,16.16,10.81l0,0c4.58,4.58,8.28,10.06,10.8,16.17 c2.43,5.87,3.77,12.3,3.77,19.02c0,6.73-1.34,13.16-3.77,19.03c-2.52,6.09-6.22,11.57-10.81,16.16l0,0 c-4.58,4.58-10.06,8.28-16.17,10.8c-5.87,2.43-12.3,3.77-19.02,3.77c-6.73,0-13.16-1.34-19.03-3.77 c-6.09-2.52-11.57-6.22-16.15-10.8l-0.01-0.01c-4.59-4.59-8.28-10.07-10.8-16.15c-0.78-1.89-1.45-3.83-2-5.82 c1.04,0.1,2.1,0.15,3.17,0.15c2.03,0,4.01-0.18,5.94-0.53c0.32,0.96,0.67,1.91,1.05,2.84c2.07,5,5.11,9.5,8.89,13.28 c3.78,3.78,8.29,6.82,13.28,8.89c4.81,1.99,10.1,3.1,15.66,3.1s10.84-1.1,15.66-3.1c5-2.07,9.5-5.11,13.28-8.89 c3.78-3.78,6.82-8.29,8.89-13.28c1.99-4.81,3.1-10.1,3.1-15.66s-1.1-10.84-3.1-15.66c-2.07-5-5.11-9.5-8.89-13.28 s-8.29-6.82-13.28-8.89c-4.81-1.99-10.1-3.1-15.66-3.1s-10.84,1.1-15.66,3.1c-0.43,0.18-0.86,0.37-1.28,0.56 c-1.64-2.58-3.62-4.92-5.89-6.95c1.24-0.64,2.51-1.23,3.8-1.77C59.97,1.34,66.39,0,73.12,0L73.12,0L73.12,0z M67.41,26.11 c0-1.22,0.5-2.32,1.29-3.12c0.8-0.8,1.9-1.29,3.12-1.29c1.22,0,2.32,0.49,3.12,1.29c0.8,0.8,1.29,1.9,1.29,3.12v23.22l17.35,10.29 c1.04,0.62,1.74,1.61,2.02,2.7c0.28,1.09,0.15,2.29-0.47,3.33v0.01l0,0c-0.62,1.04-1.61,1.74-2.7,2.02s-2.29,0.15-3.33-0.47h-0.01 l0,0L69.68,55.7c-0.67-0.37-1.22-0.91-1.62-1.55c-0.41-0.67-0.65-1.46-0.65-2.3V26.11L67.41,26.11L67.41,26.11z"/>
                                    <path style="fill-rule:evenodd; clip-rule:evenodd;" d="M26.98,2.64c14.9,0,26.98,12.08,26.98,26.98c0,14.9-12.08,26.98-26.98,26.98S0,44.52,0,29.62 C0,14.72,12.08,2.64,26.98,2.64L26.98,2.64L26.98,2.64z M26.98,13.72l14.48,17.9h-8.99v9.52H21.49v-9.52H12.5L26.98,13.72 L26.98,13.72z"/>
                                </svg>
                                {{ printf "%.1f" (div (.Float "health.#(subsystem=\"wan\").gw_system-stats.uptime") 86400) }}
                              </p>
                            </li>
                            <li data-popover-type="text" data-popover-text="Wired clients: {{ .Int "health.#(subsystem=\"lan\").num_user" }}">
                              <p style="display:inline-flex;align-items:center;">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="0"  class="size-6" style="height:1em;vertical-align:middle;margin-right:0.5em;">
                                  <path fill="none" d="M0 0h24v24H0z"></path><path d="M7.77 6.76 6.23 5.48.82 12l5.41 6.52 1.54-1.28L3.42 12l4.35-5.24zM7 13h2v-2H7v2zm10-2h-2v2h2v-2zm-6 2h2v-2h-2v2zm6.77-7.52-1.54 1.28L20.58 12l-4.35 5.24 1.54 1.28L23.18 12l-5.41-6.52z"></path>
                                </svg>
                                {{ .Int "health.#(subsystem=\"lan\").num_user" }}
                              </p>
                            </li>
                            <li data-popover-type="text" data-popover-text="Wireless clients: {{ .Int "health.#(subsystem=\"wlan\").num_user" }}">
                              <p style="display:inline-flex;align-items:center;">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="0"  class="size-6" style="height:1em;vertical-align:middle;margin-right:0.5em;">
                                  <path d="M12 6c3.537 0 6.837 1.353 9.293 3.809l1.414-1.414C19.874 5.561 16.071 4 12 4c-4.071.001-7.874 1.561-10.707 4.395l1.414 1.414C5.163 7.353 8.463 6 12 6zm5.671 8.307c-3.074-3.074-8.268-3.074-11.342 0l1.414 1.414c2.307-2.307 6.207-2.307 8.514 0l1.414-1.414z"></path><path d="M20.437 11.293c-4.572-4.574-12.301-4.574-16.873 0l1.414 1.414c3.807-3.807 10.238-3.807 14.045 0l1.414-1.414z"></path><circle cx="12" cy="18" r="2"></circle>
                                </svg>
                                {{ .Int "health.#(subsystem=\"wlan\").num_user"  }}
                              </p>
                            </li>
                          </ul>
                        </div>
                      </div>
                    {{ end }}

                - type: custom-api
                  title: Immich stats
                  cache: 1d
                  url: http://immich-server.immich.svc.cluster.local:2283/api/server/statistics
                  headers:
                    x-api-key: ${IMMICH_API_KEY}
                    Accept: application/json
                  template: |
                    <div class="flex justify-between text-center">
                      <div>
                          <div class="color-highlight size-h3">{{ .JSON.Int "photos" | formatNumber }}</div>
                          <div class="size-h6">PHOTOS</div>
                      </div>
                      <div>
                          <div class="color-highlight size-h3">{{ .JSON.Int "videos" | formatNumber }}</div>
                          <div class="size-h6">VIDEOS</div>
                      </div>
                      <div>
                          <div class="color-highlight size-h3">{{ div (.JSON.Int "usage" | toFloat) 1073741824 | toInt | formatNumber }}GB</div>
                          <div class="size-h6">USAGE</div>
                      </div>
                    </div>

                - type: custom-api
                  title: Radarr Stats
                  cache: 1m
                  url: http://radarr.media.svc.cluster.local/api/v3/movie?apikey=${RADARR__AUTH__APIKEY}
                  subrequests:
                    missing:
                      url: http://radarr.media.svc.cluster.local/api/v3/wanted/missing?apikey=${RADARR__AUTH__APIKEY}
                    queue:
                      url: http://radarr.media.svc.cluster.local/api/v3/queue?apikey=${RADARR__AUTH__APIKEY}
                  template: |
                    <div class="flex justify-between text-center">
                      <div>
                        <div class="color-highlight size-h3">{{ len (.JSON.Array "") }}</div>
                        <div class="size-h6">MOVIES</div>
                      </div>
                      <div>
                        <div class="color-highlight size-h3">{{ (.Subrequest "missing").JSON.Int "totalRecords" }}</div>
                        <div class="size-h6">MISSING</div>
                      </div>
                      <div>
                        <div class="color-highlight size-h3">{{ (.Subrequest "queue").JSON.Int "totalRecords" }}</div>
                        <div class="size-h6">QUEUED</div>
                      </div>
                    </div>

                - type: custom-api
                  title: Sonarr Stats
                  cache: 1m
                  url: http://sonarr.media.svc.cluster.local/api/v3/series?apikey=${SONARR__AUTH__APIKEY}
                  subrequests:
                    missing:
                      url: http://sonarr.media.svc.cluster.local/api/v3/wanted/missing?apikey=${SONARR__AUTH__APIKEY}
                    queue:
                      url: http://sonarr.media.svc.cluster.local/api/v3/queue?apikey=${SONARR__AUTH__APIKEY}
                  template: |
                    <div class="flex justify-between text-center">
                      <div>
                        <div class="color-highlight size-h3">{{ len (.JSON.Array "") }}</div>
                        <div class="size-h6">SERIES</div>
                      </div>
                      <div>
                        <div class="color-highlight size-h3">{{ (.Subrequest "missing").JSON.Int "totalRecords" }}</div>
                        <div class="size-h6">MISSING</div>
                      </div>
                      <div>
                        <div class="color-highlight size-h3">{{ (.Subrequest "queue").JSON.Int "totalRecords" }}</div>
                        <div class="size-h6">QUEUED</div>
                      </div>
                    </div>

                - type: stocks
                  stocks:
                    - symbol: SPY
                      name: S&P 500
                    - symbol: BTC-USD
                      name: Bitcoin
                    - symbol: NVDA
                      name: NVIDIA
                    - symbol: AAPL
                      name: Apple
                    - symbol: MSFT
                      name: Microsoft
                    - symbol: GOOGL
                      name: Google
                    - symbol: AMD
                      name: AMD
                    - symbol: RDDT
                      name: Reddit

        - name: Bookmarks
          columns:
            - size: small
              widgets:
                - type: bookmarks
                  groups:
                    - title: Home & Automation
                      links:
                        - title: Home Assistant
                          url: https://ha.pmcd.dev
                        - title: N8N
                          url: https://n8n.x.pmcd.io
                        - title: Octoprint
                          url: https://octoprint.x.pmcd.io
                        - title: ISS Tracker
                          url: https://iss.x.pmcd.io

                    - title: Personal Apps
                      links:
                        - title: Mealie
                          url: https://mealie.x.pmcd.io
                        - title: Homebox
                          url: https://homebox.x.pmcd.io
                        - title: Outline
                          url: https://outline.x.pmcd.io
                        - title: Immich
                          url: https://immich.x.pmcd.io
                        - title: Reedme
                          url: https://reedme.x.pmcd.io

            - size: full
              widgets:
                - type: bookmarks
                  groups:
                    - title: Infrastructure
                      links:
                        - title: ArgoCD
                          url: https://argo.x.pmcd.io
                        - title: Grafana
                          url: https://grafana.x.pmcd.io
                        - title: Prometheus
                          url: https://prometheus.x.pmcd.io
                        - title: Longhorn
                          url: https://longhorn.x.pmcd.io
                        - title: Uptime Kuma
                          url: https://status.x.pmcd.io
                        - title: Traefik
                          url: https://traefik.x.pmcd.io
                        - title: Dozzle
                          url: https://logs.x.pmcd.io
                        - title: PiHole
                          url: https://pihole.x.pmcd.io
                        - title: PocketID
                          url: https://auth.pmcd.dev
                        - title: Tronbyt
                          url: https://tronbyt.x.pmcd.io

                    - title: Media
                      links:
                        - title: Jellyfin
