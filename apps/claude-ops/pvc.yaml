# claude-ops home (~/.claude: login, memory, session history) and repo
# clones. Nightly to B2; the Claude login token is in here too.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-claude-ops-data
  namespace: default
  labels:
    recurring-job-group.longhorn.io/b2-backup: enabled
    recurring-job.longhorn.io/source: enabled
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
