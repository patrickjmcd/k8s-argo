apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-system
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    argocd.argoproj.io/sync-wave: "-1"
spec:
  destination:
    namespace: metallb-system
    name: in-cluster
  project: core-components
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - path: core/metallb-system
      repoURL: https://github.com/patrickjmcd/k8s-argo.git
      targetRevision: main
    - chart: metallb
      repoURL: https://metallb.github.io/metallb
      targetRevision: 0.16.1
      helm:
        releaseName: metallb
        valuesObject:
          speaker:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: NotIn
                          values:
                            - pi4-kube0
                            - pi4-kube1
          # Native L2 mode. The chart defaults to the frr-k8s backend (an FRR
          # routing daemon per node), which only matters for BGP; we only
          # announce over L2. Native mode drops ~1.4 GiB of FRR pods and the
          # frr-k8s crashloop that took .204/.205 dark in Aug 2026.
          frrk8s:
            enabled: false
