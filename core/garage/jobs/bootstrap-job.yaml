# Runs bootstrap.py (idempotent): single-node layout, buckets, imported keys,
# grants and CORS. Add buckets/keys in bootstrap.py; the hashed ConfigMap name
# makes any edit re-run the Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-bootstrap
  namespace: garage
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: python:3.15-alpine
          command: ["python3", "/scripts/bootstrap.py"]
          env:
            - name: GARAGE_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: garage-1pw, key: ADMIN_TOKEN}}
            - name: KANEO_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: garage-kaneo, key: S3_ACCESS_KEY_ID}}
            - name: KANEO_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: garage-kaneo, key: S3_SECRET_ACCESS_KEY}}
            # Outline reads AWS_* names directly, so its item uses those
            - name: OUTLINE_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: garage-outline, key: AWS_ACCESS_KEY_ID}}
            - name: OUTLINE_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: garage-outline, key: AWS_SECRET_ACCESS_KEY}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
      volumes:
        - name: scripts
          configMap: {name: garage-bootstrap}
