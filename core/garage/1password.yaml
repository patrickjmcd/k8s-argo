# RPC_SECRET, ADMIN_TOKEN, METRICS_TOKEN -- mounted as files (garage.toml's
# *_file options); Garage refuses world-readable secret files, hence 0400.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: garage-1pw
  namespace: garage
spec:
  itemPath: "vaults/Kubernetes/items/garage"
---
# S3 key for Kaneo; imported into Garage by bootstrap-job.yaml. The same item
# is synced into the kaneo namespace (apps/kaneo/extra-objects.yaml).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: garage-kaneo
  namespace: garage
spec:
  itemPath: "vaults/Kubernetes/items/garage-kaneo"
