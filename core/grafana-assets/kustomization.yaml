apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Everything here lives in prometheus (Argo used to default the namespace; Flux
# needs it set). The empty `grafana` Namespace that used to be listed here was
# never used and is no longer managed.
namespace: prometheus
resources:
  - httproute.yaml
  - dashboard-jellyfin.yaml
  - dashboard-k8s-global.yaml

# Grafana sidecar discovers dashboards by this label; generated here so the
# large JSON stays in .json files rather than inline YAML.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"

configMapGenerator:
  - name: grafana-dashboard-longhorn        # grafana.com ID 16888
    files:
      - dashboards/longhorn.json
  - name: grafana-dashboard-node-exporter-full   # grafana.com ID 1860
    files:
      - dashboards/node-exporter-full.json
  - name: grafana-dashboard-argocd          # grafana.com ID 14584
    files:
      - dashboards/argocd.json
  - name: grafana-dashboard-nats            # grafana.com ID 2279 (gnatsd_* metrics)
    files:
      - dashboards/nats.json
  - name: grafana-dashboard-adsb            # home-built, from apps/adsb adsb-exporter
    files:
      - dashboards/adsb.json
  - name: grafana-dashboard-adsb-frequent  # home-built, from adsb-recorder Postgres db
    files:
      - dashboards/adsb-frequent.json
  - name: grafana-dashboard-trivy-operator  # home-built, from core/trivy-operator metrics
    files:
      - dashboards/trivy-operator.json
  - name: grafana-dashboard-nut-ups         # from DRuggeri/nut_exporter's dashboard/dashboard.json
    files:
      - dashboards/nut-ups.json
  - name: grafana-dashboard-joshhawleygop   # home-built, from nginx JSON access logs in Loki
    files:
      - dashboards/joshhawleygop.json
  - name: grafana-dashboard-hardware-temps  # home-built, node-exporter hwmon (see prometheus-assets/node-thermal-rules.yaml)
    files:
      - dashboards/hardware-temps.json
  # Home Assistant history (LTSS on core/timescale). Generated by
  # scripts/ha_dashboards.py -- edit that and rerun, not the JSON.
  - name: grafana-dashboard-ha-overview
    files:
      - dashboards/ha-overview.json
  - name: grafana-dashboard-ha-climate
    files:
      - dashboards/ha-climate.json
  - name: grafana-dashboard-ha-energy
    files:
      - dashboards/ha-energy.json
  - name: grafana-dashboard-ha-activity
    files:
      - dashboards/ha-activity.json
  - name: grafana-dashboard-ha-devices
    files:
      - dashboards/ha-devices.json
  - name: grafana-dashboard-ha-explorer
    files:
      - dashboards/ha-explorer.json
