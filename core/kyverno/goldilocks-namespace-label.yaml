apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-goldilocks-label
  annotations:
    policies.kyverno.io/title: Add Goldilocks Label to Namespaces
    policies.kyverno.io/category: Other
    policies.kyverno.io/description: >-
      Automatically adds the goldilocks.fairwinds.com/enabled=true label
      to all namespaces except system namespaces, enabling resource
      recommendations via Goldilocks.
spec:
  failurePolicy: Ignore
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
    mutateExisting:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  matchConditions:
    - name: not-a-system-namespace
      expression: >-
        !(object.metadata.name in ['kube-system', 'kube-public', 'kube-node-lease',
          'longhorn-system', 'vpa', 'goldilocks'])
    - name: not-labelled-yet
      expression: >-
        !has(object.metadata.labels) ||
        object.metadata.labels[?'goldilocks.fairwinds.com/enabled'].orValue('') != 'true'
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          has(object.metadata.labels)
          ? [JSONPatch{op: "add", path: "/metadata/labels/" + jsonpatch.escapeKey("goldilocks.fairwinds.com/enabled"), value: "true"}]
          : [JSONPatch{op: "add", path: "/metadata/labels", value: {"goldilocks.fairwinds.com/enabled": "true"}}]
