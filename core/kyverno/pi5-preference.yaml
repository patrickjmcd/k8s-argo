apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: prefer-pi5-nodes
spec:
  # Pods only. The legacy ClusterPolicy also mutated controller templates
  # (autogen), but that isn't needed: every pod is admitted on its own. CEL
  # autogen can't do this one anyway -- it rewrites object.spec references
  # but not JSONPatch paths, and ApplyConfiguration may not set the atomic
  # affinity lists. Templates that already carry this affinity keep it: the
  # webhook-added field has no managedFields owner (86 of 89 controllers,
  # Nov 2026), so Flux/kro/Helm applies never remove it.
  autogen:
    podControllers:
      controllers: []
  # A preference, not a requirement: never block admission over it.
  failurePolicy: Ignore
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
    mutateExisting:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  # Don't stomp on pods that already declare scheduling intent.
  matchConditions:
    - name: no-scheduling-constraints
      expression: >-
        (!has(object.spec.nodeSelector) || size(object.spec.nodeSelector) == 0) &&
        !has(object.spec.affinity)
  mutations:
    # The scheduler normalizes preferred-affinity scores against the best
    # node, so only the ratio between nodes matters. The old weights (Pi5 80
    # + not-Pi4 50) scored Pi5 100 / x86 38 / Pi4 0, which outvoted free
    # resources: by Oct 2026 the Pi5s carried 61-65% memory requests and
    # crashed under load while the Pi4s sat at 68% free.
    #
    # Now: every node gets the 80 baseline and Pi5s a 20 bonus, so Pi5 100 /
    # everything else 80. Pi5 wins ties, but free memory/CPU
    # (NodeResourcesFit) decides when they're fuller.
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [JSONPatch{op: "add", path: "/spec/affinity", value: Object.spec.affinity{
            nodeAffinity: Object.spec.affinity.nodeAffinity{
              preferredDuringSchedulingIgnoredDuringExecution: [
                Object.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution{
                  weight: 80,
                  preference: Object.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution.preference{
                    matchExpressions: [Object.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution.preference.matchExpressions{key: "kubernetes.io/os", operator: "In", values: ["linux"]}]}},
                Object.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution{
                  weight: 20,
                  preference: Object.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution.preference{
                    matchExpressions: [Object.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution.preference.matchExpressions{key: "node.kubernetes.io/pi-model", operator: "In", values: ["5"]}]}}
              ]}}}]
