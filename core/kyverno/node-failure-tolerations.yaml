apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: node-failure-tolerations
  annotations:
    policies.kyverno.io/title: Node Failure Fast Eviction
    policies.kyverno.io/category: Resiliency
    policies.kyverno.io/description: >-
      Reduces the default 300s eviction window to 30s for unreachable/not-ready
      nodes. The API server's DefaultTolerationSeconds admission plugin runs
      before mutating webhooks and injects both tolerations at 300s onto any
      pod that doesn't declare them, so at webhook time tolerationSeconds=300
      on these keys is the fingerprint of "pod didn't declare it" — this
      policy rewrites exactly that value to 30. Pods declaring any other
      value (the repo convention is an explicit 30) are left alone, as are
      tolerations without tolerationSeconds (DaemonSet forever-tolerations).
      Every other toleration is carried over unchanged (control-plane,
      dedicated=heavy, etc.); if either key is missing entirely (only if
      DefaultTolerationSeconds were disabled) it is appended at 30s. CREATE
      only: pod updates permit only toleration additions, so mutating on
      UPDATE would get the whole request rejected by validation.
      longhorn-system is excluded: an evicted instance-manager kills every
      engine on the node with filesystems mounted (Oct 29 2026).
spec:
  # Pods only: mutating Deployment/Job templates too would make Flux see
  # permanent drift and fight the webhook. Autogen is on by default for a
  # policy matching pods, so it is turned off explicitly.
  autogen:
    podControllers:
      controllers: []
  # Ignore, not Fail: if the webhook ever errors, a pod keeps the 300s
  # default instead of every pod creation in the cluster being rejected.
  # (Nov 2026: a first draft that rebuilt tolerations with `?field:` optional
  # entries panicked Kyverno 1.19's handler on every pod -- hence the
  # index-based patches below.)
  failurePolicy: Ignore
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
    mutateExisting:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [longhorn-system]
  variables:
    - name: tols
      expression: "has(object.spec.tolerations) ? object.spec.tolerations : []"
    - name: keys
      expression: "['node.kubernetes.io/not-ready', 'node.kubernetes.io/unreachable']"
    - name: missing
      expression: >-
        variables.keys.filter(k, !variables.tols.exists(t, has(t.key) && t.key == k))
  mutations:
    # Targeted patches only; the tolerations list is never replaced, so custom
    # tolerations always survive.
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          lists.range(size(variables.tols)).filter(i,
              has(variables.tols[i].key) && variables.tols[i].key in variables.keys &&
              has(variables.tols[i].effect) && variables.tols[i].effect == 'NoExecute' &&
              has(variables.tols[i].tolerationSeconds) && variables.tols[i].tolerationSeconds == 300)
            .map(i, JSONPatch{op: "replace", path: "/spec/tolerations/" + string(i) + "/tolerationSeconds", value: 30})
          + (size(variables.tols) == 0 && size(variables.missing) > 0
              ? [JSONPatch{op: "add", path: "/spec/tolerations", value: []}] : [])
          + variables.missing.map(k, JSONPatch{op: "add", path: "/spec/tolerations/-",
              value: Object.spec.tolerations{key: k, operator: "Exists", effect: "NoExecute", tolerationSeconds: 30}})
