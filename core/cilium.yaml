# Cilium CNI — Phase 1 of the flannel -> Cilium migration.
#
# ORDERING — DO NOT merge this to `main` and let ArgoCD sync it as a
# big-bang install. Cilium taking over CNI on every node at once, while
# flannel is still present, will disrupt pod networking cluster-wide.
# Follow docs/cilium-migration.md: install Cilium out-of-band and migrate
# node-by-node FIRST, then merge this Application so ArgoCD *adopts* the
# already-running install (a no-op reconcile). Delete core/flannel.yaml
# only once every node is migrated (last step of the runbook).
#
# Scope of Phase 1: Cilium replaces flannel as the CNI and adds
# NetworkPolicy + Hubble. kube-proxy, MetalLB, kube-vip and Traefik are
# all left in place. kube-proxy replacement and LB-IPAM are later phases.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Earlier than flannel (-3): the CNI must be the first thing reconciled.
    argocd.argoproj.io/sync-wave: "-4"
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  destination:
    namespace: kube-system
    name: in-cluster
  project: core-components
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - chart: cilium
      repoURL: https://helm.cilium.io/
      targetRevision: 1.20.1
      helm:
        releaseName: cilium
        valuesObject:
          # IPAM: honour the podCIDR k3s already hands each node out of the
          # cluster CIDR (10.42.0.0/16), so pods keep the same address space
          # they had under flannel — no cluster-wide renumber.
          ipam:
            mode: kubernetes

          # Match flannel's current datapath: VXLAN overlay on the flat L2
          # network. Native routing is a later optimisation, not Phase 1.
          routingMode: tunnel
          tunnelProtocol: vxlan
          # flannel's VXLAN backend also defaults to UDP 8472 - since flannel stays
          # running alongside Cilium during this migration, Cilium must use a
          # different port or its own cilium_vxlan device fails to bind ("address
          # already in use"). Per Cilium's own migration docs:
          # https://docs.cilium.io/en/stable/installation/k8s-install-migration/
          tunnelPort: 8473

          # Phase 1 KEEPS kube-proxy. Do not flip this to true without also
          # starting k3s with --disable-kube-proxy and setting k8sServiceHost
          # / k8sServicePort so the agents can still reach the API server.
          kubeProxyReplacement: false

          # Pre-existing NetworkPolicy objects in this cluster (argocd-*, longhorn
          # instance-manager, minio, etc.) were effectively inert for a long time under
          # a broken/inconsistent k3s kube-router netpol controller. Cilium enforces
          # them for real the moment it's active, and many turned out to be too
          # restrictive/stale, breaking legitimate traffic cluster-wide the moment of
          # cutover (argocd, prometheus, cnpg, immich, etc. all went CrashLoopBackOff).
          # Disabled for now - matches the de-facto "not really enforced" behavior of
          # the recent past - until each existing policy is re-audited one at a time as
          # a deliberate follow-up, not mid-cutover. TODO: re-enable once audited.
          policyEnforcementMode: never

          # During the flannel -> Cilium cutover, don't let Cilium take sole
          # ownership of /etc/cni/net.d — a half-migrated node would otherwise
          # lose all CNI config. Flip back to the default (true) in a
          # follow-up once flannel is fully removed.
          cni:
            exclusive: false

          # cilium-agent is squarely on the pod-networking critical path, so
          # NO CPU limit — same reasoning as flannel in CLAUDE.md "Resource
          # requests and limits" (the July 2026 throttling incident). Eviction
          # protection comes from the chart's default system-node-critical
          # priorityClass, not from Guaranteed QoS. Memory limit has headroom.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi

          operator:
            # Two replicas across the 3 Pi 5s / x86 VMs for HA. Off the
            # per-packet path, so a modest CPU limit is acceptable here.
            replicas: 2
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi

          # cilium-envoy crashes on boot on the Pi 4 nodes (pi4-kube0/pi4-kube1): tcmalloc
          # assumes ARM64 always has 48-bit virtual address space, but Raspberry Pi kernels
          # default to 39-bit (CONFIG_ARM64_VA_BITS_39), so it dies instantly with
          # "MmapAligned() failed". Known upstream issue, not fixable from our side —
          # cilium/proxy#1027, envoyproxy/envoy#23339, cilium/cilium#17467. Pi 5 nodes are
          # unaffected (different default VA-bits config). Phase 1 only needs L3/L4
          # NetworkPolicy + Hubble flow visibility, neither of which needs Envoy (only L7
          # HTTP/gRPC/Kafka parsing does), so just disable it rather than patch around the
          # bug. Pass --set envoy.enabled=false to the matching out-of-band `helm install`
          # in §3 of the runbook too, so the manual install matches what this Application
          # later adopts.
          envoy:
            enabled: false
          # envoy.enabled=false only disables the separate Envoy DaemonSet - Cilium 1.20
          # still runs Envoy EMBEDDED inside the main cilium-agent process whenever any L7
          # feature is active (including Hubble L7 flow visibility), which is what actually
          # triggers the Pi4 tcmalloc/ARM64-VA-bits bug above. Confirmed live post-cutover:
          # cilium-agent on pi4-kube0/pi4-kube1 was hitting its 1Gi memory limit and getting
          # OOM-killed, with dmesg showing cilium-envoy/cilium-envoy-starter processes inside
          # the same cgroup as cilium-agent. l7Proxy=false (default true) disables the
          # embedded proxy entirely - safe for Phase 1 since we only need L3/L4 NetworkPolicy
          # + basic flow visibility, neither of which needs L7 parsing.
          l7Proxy: false

          # Observability — the main Phase 1 payoff alongside NetworkPolicy.
          # UI exposed at hubble.x.pmcd.io via the HTTPRoute in ./cilium/ (second
          # source below). No ReferenceGrant needed in the end: the HTTPRoute lives
          # in kube-system alongside hubble-ui (same-namespace backendRef), and
          # traefik-gateway's listeners already allow routes from all namespaces.
          hubble:
            enabled: true
            relay:
              enabled: true
            ui:
              enabled: true
    - path: core/cilium
      repoURL: https://github.com/patrickjmcd/k8s-argo.git
      targetRevision: main
