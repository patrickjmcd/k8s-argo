apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    argocd.argoproj.io/sync-wave: "1"
spec:
  destination:
    namespace: default
    name: in-cluster
  project: core-components
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  sources:
    - path: core/traefik-assets
      repoURL: https://github.com/patrickjmcd/k8s-argo.git
      targetRevision: main
    - chart: traefik
      targetRevision: 41.5.0
      repoURL: https://traefik.github.io/charts
      helm:
        releaseName: traefik
        valuesObject:
          deployment:
            replicas: 2
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: traefik
                    topologyKey: kubernetes.io/hostname
          ports:
            metrics:
              expose:
                default: true
              port: 9101
              exposedPort: 9101
              protocol: TCP
            web:
              port: 80
              http:
                redirections:
                  entryPoint:
                    to: websecure
                    scheme: https
                    permanent: true
            websecure:
              port: 443
              transport:
                respondingTimeouts:
                  readTimeout: 0
            # Entry point for Cloudflare Tunnel traffic only. Not on the
            # LoadBalancer; exposed via the ClusterIP traefik-internal Service
            # that cloudflared forwards to. Routes opt in by attaching to
            # public-gateway (core/traefik-assets/public-gateway.yaml).
            public:
              port: 8000
              expose:
                default: false
                internal: true
              protocol: TCP
              # Only cloudflared (pod network) reaches this entry point. Trust
              # its X-Forwarded-* headers so apps see the original
              # https://<host> - otherwise Traefik rewrites X-Forwarded-Proto
              # to http and OAuth/redirect URLs break (argo, outline, pocketid).
              forwardedHeaders:
                trustedIPs:
                  - 10.42.0.0/16
              # Same as websecure: immich uploads can run long.
              transport:
                respondingTimeouts:
                  readTimeout: 0
          service:
            annotations:
              # kube-vip's svc_enable watches all type=LoadBalancer Services
              # cluster-wide; this opts traefik out while it's piloted on
              # nats-lan only. Remove once traefik itself migrates.
              kube-vip.io/ignore: "true"
            spec:
              loadBalancerIP: 192.168.8.200
            additionalServices:
              internal:
                type: ClusterIP
          additionalArguments:
            - "--api.insecure=true"
          # Memory request follows Goldilocks (~260Mi target; observed peak
          # 221Mi over 7 days) - 160Mi was below real usage.
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          # Traefik carries LAN and public (Cloudflare Tunnel) traffic, so a
          # node drain must never take both replicas down at once.
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          ingressRoute:
            dashboard:
              enabled: false
          providers:
            kubernetesCRD:
              # Not used for routing (all routing stays on Gateway API/HTTPRoute
              # per convention) — enabled solely because Traefik's Gateway API
              # provider only registers `traefik.io/Middleware` as a valid
              # ExtensionRef filter kind when this provider is also running
              # (see FillExtensionBuilderRegistry in Traefik's CRD provider).
              # With this off, every HTTPRoute Middleware ExtensionRef silently
              # fails ("unsupported filter extension ref") — discovered via
              # jellyfin's ipAllowList never actually being enforced.
              enabled: true
            kubernetesGateway:
              enabled: true
          gateway:
            namespacePolicy: All
            listeners:
              web: # HTTP listener that matches entryPoint `web`
                port: 80
                protocol: HTTP
                namespacePolicy:
                  from: All
              websecure: # HTTPS listener that matches entryPoint `websecure`
                port: 443
                protocol: HTTPS  # TLS terminates inside Traefik
                namespacePolicy:
                  from: All
                certificateRefs:
                  - name: pmcdio-tls-le
                  - name: pmcddev-tls-le
          # Enable Observability
          log:
            level: INFO
          accessLog:
            enabled: true

          # Enables Prometheus for Metrics
          metrics:
            prometheus:
              enabled: true
              serviceMonitor:
                enabled: true

  #        persistence:
  #          enabled: true
  #          existingClaim: smb-appconfig-traefik-claim
