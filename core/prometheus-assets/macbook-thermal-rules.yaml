apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: macbook-thermal
  namespace: prometheus
  labels:
    release: kube-prometheus-stack   # required: prometheus ruleSelector matches this
spec:
  groups:
    - name: macbook-thermal
      rules:
        # macbook-debian is a Mid-2012 MacBook Pro running lid-shut in a closet.
        # Fans are driven by mbpfan via applesmc. Coretemp high = 87C, crit =
        # 105C; idles ~60C, peaked ~75C during k3s join.
        - alert: MacbookCpuHot
          expr: max(node_hwmon_temp_celsius{instance="macbook-debian", chip="platform_coretemp_0"}) > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "macbook-debian CPU at {{ $value | humanize }}°C"
            description: >-
              CPU has been above 85°C for 10 minutes. Check closet airflow
              (hinge vents unobstructed), that mbpfan is running
              (systemctl status mbpfan), and that dgpu-off.service kept the
              NVIDIA GPU powered off (cat /sys/kernel/debug/vgaswitcheroo/switch).

        - alert: MacbookCpuCritical
          expr: max(node_hwmon_temp_celsius{instance="macbook-debian", chip="platform_coretemp_0"}) > 95
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "macbook-debian CPU at {{ $value | humanize }}°C, near 105°C thermal shutdown"
            description: >-
              The CPU is approaching its 105°C critical limit and the machine
              will throttle hard or power off. Consider draining the node
              (kubectl drain macbook-debian --ignore-daemonsets --delete-emptydir-data).

        # mbpfan floors the fans at their SMC minimum (~2000 RPM), so a
        # reading near zero means a dead or stalled fan, not a quiet one.
        - alert: MacbookFanStalled
          expr: node_hwmon_fan_rpm{instance="macbook-debian", chip="platform_applesmc_768"} < 500
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "macbook-debian {{ $labels.sensor }} at {{ $value }} RPM"
            description: >-
              A fan has stopped or stalled. With the lid shut in a closet the
              machine will overheat without it.

        # 14-year-old battery held at 100% charge; heat accelerates swelling.
        - alert: MacbookBatteryHot
          expr: node_hwmon_temp_celsius{instance="macbook-debian", chip="power_supply_bat0", sensor="temp1"} > 45
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "macbook-debian battery at {{ $value | humanize }}°C"
            description: >-
              The battery has been above 45°C for 15 minutes. An old battery
              kept at full charge and running hot is a swelling risk. Inspect it.
