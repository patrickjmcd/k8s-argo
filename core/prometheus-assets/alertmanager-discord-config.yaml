apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: discord
  namespace: prometheus
spec:
  route:
    receiver: n8n-claude
    groupBy: ['alertname', 'namespace']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
    matchers:
      - name: alertname
        matchType: "!~"
        value: "^(Watchdog|InfoInhibitor|KubeSchedulerDown|KubeProxyDown|KubeControllerManagerDown)$"
      # This route is matched before the root config's routes, so the root's
      # "CPUThrottlingHigh info -> null" never applied; info alerts (mostly
      # CPUThrottlingHigh) paged every 5 minutes. Keep them in Prometheus only.
      - name: severity
        matchType: "!="
        value: info
  receivers:
    - name: n8n-claude
      webhookConfigs:
        - url: http://n8n.default.svc.cluster.local/webhook/alertmanager
          sendResolved: true
