# Longhorn for the Prometheus TSDB (Oct 31 2026, moved off media-server's USB
# disk). Two replicas: the data is rebuildable metrics, not worth a third copy
# of every compaction write. Retain so deleting the PVC never drops history.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-prometheus
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  dataEngine: v1
  dataLocality: disabled
  disableRevisionCounter: "true"
  fsType: ext4
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  unmapMarkSnapChainRemoved: ignored
