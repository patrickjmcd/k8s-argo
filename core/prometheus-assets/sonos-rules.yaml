apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sonos
  namespace: prometheus
  labels:
    release: kube-prometheus-stack   # required: prometheus ruleSelector matches this
spec:
  groups:
    - name: sonos
      rules:
        # From apps/sonos-exporter (our fork patrickjmcd/sonos-exporter >= 0.2.0,
        # which adds the _total counter: the player resets its PHY count on
        # every read, so rate(sonos_phy_errors) is meaningless).
        #
        # Baseline when added (Nov 12 2026): Kitchen Move ~2,000/s and the
        # Living Room Beam ~1,600/s, both on 2.4 GHz; everything on 5 GHz under
        # ~150/s. The threshold sits above that so it flags a speaker getting
        # clearly worse, not the known state. Provisional: revisit once the
        # dashboard has a week or two of history.
        - alert: SonosRadioNoisy
          expr: rate(sonos_radio_phy_errors_total[30m]) > 3000
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "Sonos {{ $labels.zone }}: {{ $value | humanize }} PHY errors/s for 2h"
            description: >-
              The speaker's radio can't decode much of what it hears (interference
              or weak signal). Expect dropouts on that speaker, and for a soundbar
              its surround/Sub link. Check what changed nearby (new device, moved
              speaker, AP channel change); wiring it or moving it closer to an
              AP fixes it. Dashboard: https://grafana.x.pmcd.io/d/sonos-overview

        # Home theater satellites (Sub, surrounds) talk only to their soundbar,
        # over its dedicated link; the exporter names them "<room> (SW)",
        # "(LR)", "(RR)". Baseline when added: Living Room Sub <-> Beam 72-82.
        # 40 is a provisional threshold for "about to drop out".
        - alert: SonosSatelliteLinkWeak
          expr: >-
            min by (zone, peer_zone) (
              {__name__=~"sonos_link_quality_(from|to)", zone=~".+ \\((SW|LR|RR)\\)"}
            ) < 40
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Sonos {{ $labels.zone }}: link to {{ $labels.peer_zone }} weak ({{ $value }}) for 1h"
            description: >-
              The satellite's link to its soundbar is degraded; expect it to cut
              out. Usually interference near the soundbar or the satellite on
              the link's channel (the soundbar on Wi-Fi shares one radio with
              it). Dashboard: https://grafana.x.pmcd.io/d/sonos-overview

        # Satellites never sleep, unlike the Move/Roam, so one missing means it
        # is unplugged or has lost the soundbar. Covers both "reported down" and
        # "dropped out of the household dump" (series seen today, not up now).
        - alert: SonosSatelliteMissing
          expr: >-
            max by (zone) (max_over_time(sonos_device_up{zone=~".+ \\((SW|LR|RR)\\)"}[1d]))
            unless on (zone) (sonos_device_up == 1)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Sonos {{ $labels.zone }} is missing from the household"
            description: >-
              A home theater satellite hasn't been seen for 15m. Check that it
              has power; if it does, power-cycle it, then the soundbar.

        # Without this, a broken exporter silently disables the alert above.
        - alert: SonosExporterScrapeFailing
          expr: max_over_time(sonos_scrape_success[30m]) == 0 or absent(sonos_scrape_success)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "sonos-exporter has not read the Sonos household for 30m"
            description: >-
              apps/sonos-exporter reads /support/review from one player
              (--sonos-ip in its HomelabApp). Check that the player is on and
              still at that IP, and the exporter pod's logs.
