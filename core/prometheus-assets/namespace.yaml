# Never prune the namespace (docs/flux-migration.md §2): it holds the
# Prometheus TSDB claim and Grafana's PVC.
apiVersion: v1
kind: Namespace
metadata:
  name: prometheus
  labels:
    canUseExternalSecrets: "true"
    # Prometheus only reads ServiceMonitors/PodMonitors from namespaces with
    # this label (serviceMonitorNamespaceSelector), including its own. It was
    # set by hand and lost at the Flux handoff, Oct 27 2026.
    prometheus: enabled
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
