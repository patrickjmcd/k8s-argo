# HomelabApp: kro ResourceGraphDefinition replacing the homelab-app Helm chart
# for single-container apps. kro turns this into a HomelabApp CRD plus a
# controller that keeps each instance's Deployment, Service, HTTPRoutes,
# OnePasswordItem, ConfigMap and ServiceMonitor in sync.
# Instances: any apps/**/homelabapp.yaml (e.g. apps/reedme, apps/media/tautulli).
#
# Writing optional fields (tested on kro 0.9.4, Oct 2026):
# - The container is built as one CEL expression so optional keys can use the
#   optional map-entry syntax `?"key": cond ? optional.of(v) : optional.none()`,
#   which omits the key. A field-level `optional.none()` instead renders null:
#   fine at create time, but toggling it off later leaves e.g. a livenessProbe
#   with no handler, which the API server rejects, wedging the instance.
# - Lists use `cond ? [...] : []`; an empty list removes the field cleanly.
# - Iterating a map (env) has no stable order: sort the keys, or every
#   reconcile renders a different pod template and the Deployment rolls
#   forever (seen Oct 2026: generation 900+ in minutes).
# - Map literals are checked against the target struct: an all-string map
#   (map(string,string)) fails against structs with bool fields, so mounts
#   carry an explicit "readOnly".
#
# Persistence mounts an existing PVC (persistence.claimName) rather than
# creating one: kro deletes includeWhen resources when the condition turns
# false, so a kro-owned PVC would lose its data if persistence were ever
# toggled off. Define the PVC next to the instance (with backup labels and
# argocd.argoproj.io/sync-options: Delete=false).
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: homelabapp
spec:
  schema:
    apiVersion: v1alpha1
    kind: HomelabApp
    group: homelab.pmcd.io
    types:
      # One source per volume: claimName | configMap | secret | hostPath | emptyDir.
      ExtraVolume:
        name: string | required=true
        claimName: string | default=""
        configMap: string | default=""
        secret: string | default=""
        hostPath: string | default=""
        emptyDir: boolean | default=false
        sizeLimit: string | default="" description="emptyDir sizeLimit"
      VolumeMount:
        name: string | required=true
        mountPath: string | required=true
        subPath: string | default=""
        readOnly: boolean | default=false
      Toleration:
        key: string | default=""
        operator: string | default="Equal"
        value: string | default=""
        effect: string | default=""
        tolerationSeconds: integer | default=0 description="0 = unset"
    spec:
      image: string | required=true description="Full image reference including tag, e.g. ghcr.io/org/app:v1.2.3"
      port: integer | default=80 description="Service port"
      containerPort: integer | default=0 description="Container port; 0 means same as port"
      env: "map[string]string"
      # Extra Secrets to load as env vars, beyond the 1Password one.
      envFromSecrets: "[]string"
      imagePullSecrets: "[]string"
      command: "[]string"
      args: "[]string"
      # Volumes beyond persistence/configMap; mounts may also reference the
      # built-in "data" (persistence) and "config" (configMap) volumes.
      extraVolumes: "[]ExtraVolume"
      extraVolumeMounts: "[]VolumeMount"
      nodeSelector: "map[string]string"
      tolerations: "[]Toleration"
      # Pod on the node's network namespace (dnsPolicy follows).
      hostNetwork: boolean | default=false
      podAnnotations: "map[string]string"
      # Sets dnsConfig.options ndots when non-empty.
      dnsNdots: string | default=""
      securityContext:
        # 0 / false = unset.
        runAsUser: integer | default=0
        runAsGroup: integer | default=0
        runAsNonRoot: boolean | default=false
        fsGroup: integer | default=0 description="pod-level"
      resources:
        cpuRequest: string | default="25m"
        memoryRequest: string | default="128Mi"
        # Empty string = no CPU limit (see CLAUDE.md on CPU limits).
        cpuLimit: string | default="500m"
        memoryLimit: string | default="512Mi"
      # One handler for all probes, on the "http" container port.
      probes:
        type: string | default="tcpSocket" description="tcpSocket or httpGet"
        path: string | default="/" description="Path for httpGet"
        startup:
          type: string | default="" description="Override probes.type"
          path: string | default="" description="Override probes.path"
          enabled: boolean | default=true
          failureThreshold: integer | default=30
          periodSeconds: integer | default=5
        readiness:
          type: string | default="" description="Override probes.type"
          path: string | default="" description="Override probes.path"
          initialDelaySeconds: integer | default=10
          periodSeconds: integer | default=10
          timeoutSeconds: integer | default=1
          failureThreshold: integer | default=3
        liveness:
          type: string | default="" description="Override probes.type"
          path: string | default="" description="Override probes.path"
          enabled: boolean | default=false
          initialDelaySeconds: integer | default=60
          periodSeconds: integer | default=10
          timeoutSeconds: integer | default=10
          failureThreshold: integer | default=5
      route:
        enabled: boolean | default=true
        hostnames: "[]string"
        gatewayName: string | default="traefik-gateway"
        gatewayNamespace: string | default="default"
        # Served through Cloudflare Tunnel via public-gateway; external-dns
        # creates the DNS records. Same as the chart's httproute.publicHostnames.
        publicHostnames: "[]string"
        # Traefik Middleware names (same namespace), internal route only.
        middlewares: "[]string"
      onePassword:
        enabled: boolean | default=false
        # Defaults to vaults/Kubernetes/items/<name>. Every field of the item
        # becomes an env var via the <name>-1pw Secret.
        itemPath: string | default=""
        # false = only create the Secret (e.g. mounted as a file via
        # extraVolumes), don't load it as env vars.
        envFrom: boolean | default=true
      configMap:
        enabled: boolean | default=false
        mountPath: string | default="/config"
        subPath: string | default=""
        data: "map[string]string"
      persistence:
        # Existing PVC to mount as volume "data"; empty = none. mountPath ""
        # = don't auto-mount (mount it via extraVolumeMounts, e.g. subPaths).
        claimName: string | default=""
        mountPath: string | default="/data"
      serviceMonitor:
        enabled: boolean | default=false
        path: string | default="/metrics"
        interval: string | default="30s"
        # Secret with username/password keys for basic auth on the scrape.
        basicAuthSecret: string | default=""
      # Read by scripts/generate_glance_monitors.py, not by kro.
      glance:
        monitor: boolean | default=false
        title: string | default=""
        group: string | default=""
    status:
      availableReplicas: ${deployment.status.availableReplicas}
      serviceIP: ${service.spec.clusterIP}

  resources:
    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          # kro 0.9 tracks children with ApplySet labels, not ownerReferences;
          # Argo CD draws its resource tree from ownerReferences, so without
          # this an app's Deployment/pods/routes don't show up under it.
          ownerReferences:
            - apiVersion: homelab.pmcd.io/v1alpha1
              kind: HomelabApp
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              blockOwnerDeletion: false
              controller: false
          labels:
            app.kubernetes.io/name: ${schema.metadata.name}
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/managed-by: kro
          annotations:
            # kro can't hash the ConfigMap into the pod template the way the
            # chart does, so a config change wouldn't restart the pod on its
            # own. Stakater Reloader (if installed) acts on this annotation.
            reloader.stakater.com/auto: "true"
        spec:
          replicas: 1
          revisionHistoryLimit: 3
          strategy:
            type: Recreate
          # Same selector labels as the homelab-app chart, so a chart app can
          # move to HomelabApp without a selector change (selectors are immutable).
          selector:
            matchLabels:
              app.kubernetes.io/name: ${schema.metadata.name}
              app.kubernetes.io/instance: ${schema.metadata.name}
          # The whole pod template is one CEL expression so every optional
          # field can use ?"key" entries (omitted entirely when unset). The
          # container is named after the app, matching the chart's.
          template: '${{
            "metadata": {
              "labels": {
                "app.kubernetes.io/name": schema.metadata.name,
                "app.kubernetes.io/instance": schema.metadata.name
              },
              ?"annotations": has(schema.spec.podAnnotations) && size(schema.spec.podAnnotations) > 0
                ? optional.of(schema.spec.podAnnotations) : optional.none()
            },
            "spec": {
              "enableServiceLinks": false,
              ?"imagePullSecrets": has(schema.spec.imagePullSecrets) && size(schema.spec.imagePullSecrets) > 0
                ? optional.of(schema.spec.imagePullSecrets.map(n, {"name": n})) : optional.none(),
              ?"hostNetwork": schema.spec.hostNetwork ? optional.of(true) : optional.none(),
              ?"dnsPolicy": schema.spec.hostNetwork ? optional.of("ClusterFirstWithHostNet") : optional.none(),
              ?"dnsConfig": schema.spec.dnsNdots != ""
                ? optional.of({"options": [{"name": "ndots", "value": schema.spec.dnsNdots}]}) : optional.none(),
              ?"nodeSelector": has(schema.spec.nodeSelector) && size(schema.spec.nodeSelector) > 0
                ? optional.of(schema.spec.nodeSelector) : optional.none(),
              ?"tolerations": has(schema.spec.tolerations) && size(schema.spec.tolerations) > 0
                ? optional.of(schema.spec.tolerations.map(t, {
                    "operator": t.operator,
                    ?"key": t.key != "" ? optional.of(t.key) : optional.none(),
                    ?"value": t.value != "" ? optional.of(t.value) : optional.none(),
                    ?"effect": t.effect != "" ? optional.of(t.effect) : optional.none(),
                    ?"tolerationSeconds": t.tolerationSeconds != 0 ? optional.of(t.tolerationSeconds) : optional.none()}))
                : optional.none(),
              ?"securityContext": schema.spec.securityContext.fsGroup != 0
                ? optional.of({"fsGroup": schema.spec.securityContext.fsGroup}) : optional.none(),
              "containers": [{
                "name": schema.metadata.name,
                "image": schema.spec.image,
                ?"command": has(schema.spec.command) && size(schema.spec.command) > 0
                  ? optional.of(schema.spec.command) : optional.none(),
                ?"args": has(schema.spec.args) && size(schema.spec.args) > 0
                  ? optional.of(schema.spec.args) : optional.none(),
                ?"securityContext": schema.spec.securityContext.runAsUser != 0 || schema.spec.securityContext.runAsGroup != 0 || schema.spec.securityContext.runAsNonRoot
                  ? optional.of({
                      ?"runAsUser": schema.spec.securityContext.runAsUser != 0 ? optional.of(schema.spec.securityContext.runAsUser) : optional.none(),
                      ?"runAsGroup": schema.spec.securityContext.runAsGroup != 0 ? optional.of(schema.spec.securityContext.runAsGroup) : optional.none(),
                      ?"runAsNonRoot": schema.spec.securityContext.runAsNonRoot ? optional.of(true) : optional.none()})
                  : optional.none(),
                "ports": [{
                  "name": "http",
                  "containerPort": schema.spec.containerPort != 0 ? schema.spec.containerPort : schema.spec.port,
                  "protocol": "TCP"
                }],
                ?"env": has(schema.spec.env) && size(schema.spec.env) > 0
                  ? optional.of(schema.spec.env.map(k, k).sort().map(k, {"name": k, "value": schema.spec.env[k]}))
                  : optional.none(),
                "envFrom":
                  (schema.spec.onePassword.enabled && schema.spec.onePassword.envFrom ? [{"secretRef": {"name": schema.metadata.name + "-1pw", "optional": false}}] : [])
                  + (has(schema.spec.envFromSecrets) ? schema.spec.envFromSecrets.map(n, {"secretRef": {"name": n, "optional": false}}) : []),
                "resources": {
                  "requests": {"cpu": schema.spec.resources.cpuRequest, "memory": schema.spec.resources.memoryRequest},
                  "limits": {
                    ?"cpu": schema.spec.resources.cpuLimit != "" ? optional.of(schema.spec.resources.cpuLimit) : optional.none(),
                    "memory": schema.spec.resources.memoryLimit
                  }
                },
                ?"startupProbe": schema.spec.probes.startup.enabled
                  ? optional.of((schema.spec.probes.startup.type != "" ? schema.spec.probes.startup.type : schema.spec.probes.type) == "httpGet"
                      ? {"httpGet": {"path": (schema.spec.probes.startup.path != "" ? schema.spec.probes.startup.path : schema.spec.probes.path), "port": "http"}, "failureThreshold": schema.spec.probes.startup.failureThreshold, "periodSeconds": schema.spec.probes.startup.periodSeconds}
                      : {"tcpSocket": {"port": "http"}, "failureThreshold": schema.spec.probes.startup.failureThreshold, "periodSeconds": schema.spec.probes.startup.periodSeconds})
                  : optional.none(),
                "readinessProbe": ((schema.spec.probes.readiness.type != "" ? schema.spec.probes.readiness.type : schema.spec.probes.type) == "httpGet"
                      ? {"httpGet": {"path": (schema.spec.probes.readiness.path != "" ? schema.spec.probes.readiness.path : schema.spec.probes.path), "port": "http"}, "initialDelaySeconds": schema.spec.probes.readiness.initialDelaySeconds, "periodSeconds": schema.spec.probes.readiness.periodSeconds, "timeoutSeconds": schema.spec.probes.readiness.timeoutSeconds, "failureThreshold": schema.spec.probes.readiness.failureThreshold}
                      : {"tcpSocket": {"port": "http"}, "initialDelaySeconds": schema.spec.probes.readiness.initialDelaySeconds, "periodSeconds": schema.spec.probes.readiness.periodSeconds, "timeoutSeconds": schema.spec.probes.readiness.timeoutSeconds, "failureThreshold": schema.spec.probes.readiness.failureThreshold}),
                ?"livenessProbe": schema.spec.probes.liveness.enabled
                  ? optional.of((schema.spec.probes.liveness.type != "" ? schema.spec.probes.liveness.type : schema.spec.probes.type) == "httpGet"
                      ? {"httpGet": {"path": (schema.spec.probes.liveness.path != "" ? schema.spec.probes.liveness.path : schema.spec.probes.path), "port": "http"}, "initialDelaySeconds": schema.spec.probes.liveness.initialDelaySeconds, "periodSeconds": schema.spec.probes.liveness.periodSeconds, "timeoutSeconds": schema.spec.probes.liveness.timeoutSeconds, "failureThreshold": schema.spec.probes.liveness.failureThreshold}
                      : {"tcpSocket": {"port": "http"}, "initialDelaySeconds": schema.spec.probes.liveness.initialDelaySeconds, "periodSeconds": schema.spec.probes.liveness.periodSeconds, "timeoutSeconds": schema.spec.probes.liveness.timeoutSeconds, "failureThreshold": schema.spec.probes.liveness.failureThreshold})
                  : optional.none(),
                "volumeMounts":
                  (schema.spec.configMap.enabled
                    ? [{"name": "config", "mountPath": schema.spec.configMap.mountPath, "readOnly": true,
                        ?"subPath": schema.spec.configMap.subPath != "" ? optional.of(schema.spec.configMap.subPath) : optional.none()}]
                    : [])
                  + (schema.spec.persistence.claimName != "" && schema.spec.persistence.mountPath != ""
                    ? [{"name": "data", "mountPath": schema.spec.persistence.mountPath, "readOnly": false}]
                    : [])
                  + (has(schema.spec.extraVolumeMounts)
                    ? schema.spec.extraVolumeMounts.map(m, {"name": m.name, "mountPath": m.mountPath, "readOnly": m.readOnly,
                        ?"subPath": m.subPath != "" ? optional.of(m.subPath) : optional.none()})
                    : [])
              }],
              "volumes":
                (schema.spec.configMap.enabled
                  ? [{"name": "config", "configMap": {"name": schema.metadata.name + "-config"}}]
                  : [])
                + (schema.spec.persistence.claimName != ""
                  ? [{"name": "data", "persistentVolumeClaim": {"claimName": schema.spec.persistence.claimName}}]
                  : [])
                + (has(schema.spec.extraVolumes)
                  ? schema.spec.extraVolumes.map(v, {
                      "name": v.name,
                      ?"persistentVolumeClaim": v.claimName != "" ? optional.of({"claimName": v.claimName}) : optional.none(),
                      ?"configMap": v.configMap != "" ? optional.of({"name": v.configMap}) : optional.none(),
                      ?"secret": v.secret != "" ? optional.of({"secretName": v.secret}) : optional.none(),
                      ?"hostPath": v.hostPath != "" ? optional.of({"path": v.hostPath}) : optional.none(),
                      ?"emptyDir": v.emptyDir
                        ? optional.of({?"sizeLimit": v.sizeLimit != "" ? optional.of(v.sizeLimit) : optional.none()})
                        : optional.none()})
                  : [])
            }
          }}'

    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          # kro 0.9 tracks children with ApplySet labels, not ownerReferences;
          # Argo CD draws its resource tree from ownerReferences, so without
          # this an app's Deployment/pods/routes don't show up under it.
          ownerReferences:
            - apiVersion: homelab.pmcd.io/v1alpha1
              kind: HomelabApp
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              blockOwnerDeletion: false
              controller: false
          labels:
            app.kubernetes.io/name: ${schema.metadata.name}
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/managed-by: kro
        spec:
          type: ClusterIP
          selector: ${deployment.spec.selector.matchLabels}
          ports:
            - name: http
              port: ${schema.spec.port}
              targetPort: http
              protocol: TCP

    - id: httproute
      includeWhen:
        - ${schema.spec.route.enabled}
      template:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          # kro 0.9 tracks children with ApplySet labels, not ownerReferences;
          # Argo CD draws its resource tree from ownerReferences, so without
          # this an app's Deployment/pods/routes don't show up under it.
          ownerReferences:
            - apiVersion: homelab.pmcd.io/v1alpha1
              kind: HomelabApp
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              blockOwnerDeletion: false
              controller: false
          labels:
            app.kubernetes.io/managed-by: kro
        spec:
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: ${schema.spec.route.gatewayName}
              namespace: ${schema.spec.route.gatewayNamespace}
          hostnames: ${schema.spec.route.hostnames}
          rules: '${[{
            "matches": [{"path": {"type": "PathPrefix", "value": "/"}}],
            ?"filters": has(schema.spec.route.middlewares) && size(schema.spec.route.middlewares) > 0
              ? optional.of(schema.spec.route.middlewares.map(m, {"type": "ExtensionRef",
                  "extensionRef": {"group": "traefik.io", "kind": "Middleware", "name": m}}))
              : optional.none(),
            "backendRefs": dyn([{"name": service.metadata.name, "kind": "Service", "port": schema.spec.port}])
          }]}'

    - id: publicroute
      includeWhen:
        - ${has(schema.spec.route) && has(schema.spec.route.publicHostnames) && size(schema.spec.route.publicHostnames) > 0}
      template:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: ${schema.metadata.name}-public
          namespace: ${schema.metadata.namespace}
          # kro 0.9 tracks children with ApplySet labels, not ownerReferences;
          # Argo CD draws its resource tree from ownerReferences, so without
          # this an app's Deployment/pods/routes don't show up under it.
          ownerReferences:
            - apiVersion: homelab.pmcd.io/v1alpha1
              kind: HomelabApp
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              blockOwnerDeletion: false
              controller: false
          labels:
            app.kubernetes.io/managed-by: kro
        spec:
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: public-gateway
              namespace: default
          hostnames: ${schema.spec.route.publicHostnames}
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /
              backendRefs:
                - name: ${service.metadata.name}
                  kind: Service
                  port: ${schema.spec.port}

    - id: onepassword
      includeWhen:
        - ${has(schema.spec.onePassword) && schema.spec.onePassword.enabled}
      template:
        apiVersion: onepassword.com/v1
        kind: OnePasswordItem
        metadata:
          name: ${schema.metadata.name}-1pw
          namespace: ${schema.metadata.namespace}
          # kro 0.9 tracks children with ApplySet labels, not ownerReferences;
          # Argo CD draws its resource tree from ownerReferences, so without
          # this an app's Deployment/pods/routes don't show up under it.
          ownerReferences:
            - apiVersion: homelab.pmcd.io/v1alpha1
              kind: HomelabApp
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              blockOwnerDeletion: false
              controller: false
          labels:
            app.kubernetes.io/managed-by: kro
        spec:
          itemPath: '${schema.spec.onePassword.itemPath != "" ? schema.spec.onePassword.itemPath : "vaults/Kubernetes/items/" + schema.metadata.name}'

    - id: config
      includeWhen:
        - ${has(schema.spec.configMap) && schema.spec.configMap.enabled}
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-config
          namespace: ${schema.metadata.namespace}
          # kro 0.9 tracks children with ApplySet labels, not ownerReferences;
          # Argo CD draws its resource tree from ownerReferences, so without
          # this an app's Deployment/pods/routes don't show up under it.
          ownerReferences:
            - apiVersion: homelab.pmcd.io/v1alpha1
              kind: HomelabApp
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              blockOwnerDeletion: false
              controller: false
          labels:
            app.kubernetes.io/managed-by: kro
        data: ${schema.spec.configMap.data}

    - id: servicemonitor
      includeWhen:
        - ${schema.spec.serviceMonitor.enabled}
      template:
        apiVersion: monitoring.coreos.com/v1
        kind: ServiceMonitor
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          # kro 0.9 tracks children with ApplySet labels, not ownerReferences;
          # Argo CD draws its resource tree from ownerReferences, so without
          # this an app's Deployment/pods/routes don't show up under it.
          ownerReferences:
            - apiVersion: homelab.pmcd.io/v1alpha1
              kind: HomelabApp
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              blockOwnerDeletion: false
              controller: false
          labels:
            app.kubernetes.io/name: ${schema.metadata.name}
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/managed-by: kro
        spec:
          selector:
            matchLabels: ${deployment.spec.selector.matchLabels}
          endpoints: '${[{
            "port": "http",
            "path": schema.spec.serviceMonitor.path,
            "interval": schema.spec.serviceMonitor.interval,
            ?"basicAuth": schema.spec.serviceMonitor.basicAuthSecret != ""
              ? optional.of({
                  "username": {"name": schema.spec.serviceMonitor.basicAuthSecret, "key": "username"},
                  "password": {"name": schema.spec.serviceMonitor.basicAuthSecret, "key": "password"}})
              : optional.none()
          }]}'
