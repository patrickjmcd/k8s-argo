# HomelabApp: an experiment in replacing the homelab-app Helm chart with a kro
# ResourceGraphDefinition. kro turns this into a HomelabApp CRD plus a
# controller that keeps each instance's Deployment, Service and HTTPRoute in
# sync. Covers stateless apps: optional public route (Cloudflare Tunnel),
# 1Password secret and ConfigMap. Not yet: persistence, ServiceMonitor.
# See apps/iss-in-space-kro for an instance.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: homelabapp
spec:
  schema:
    apiVersion: v1alpha1
    kind: HomelabApp
    group: homelab.pmcd.io
    spec:
      image: string | required=true description="Full image reference including tag, e.g. ghcr.io/org/app:v1.2.3"
      port: integer | default=80 description="Service port"
      containerPort: integer | default=0 description="Container port; 0 means same as port"
      env: "map[string]string"
      imagePullSecrets: "[]string"
      resources:
        cpuRequest: string | default="25m"
        memoryRequest: string | default="128Mi"
        cpuLimit: string | default="500m"
        memoryLimit: string | default="512Mi"
      route:
        enabled: boolean | default=true
        hostnames: "[]string"
        gatewayName: string | default="traefik-gateway"
        gatewayNamespace: string | default="default"
        # Served through Cloudflare Tunnel via public-gateway; external-dns
        # creates the DNS records. Same as the chart's httproute.publicHostnames.
        publicHostnames: "[]string"
      onePassword:
        enabled: boolean | default=false
        # Defaults to vaults/Kubernetes/items/<name>. Every field of the item
        # becomes an env var via the <name>-1pw Secret.
        itemPath: string | default=""
      configMap:
        enabled: boolean | default=false
        mountPath: string | default="/config"
        subPath: string | default=""
        data: "map[string]string"
    status:
      availableReplicas: ${deployment.status.availableReplicas}
      serviceIP: ${service.spec.clusterIP}

  resources:
    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/name: ${schema.metadata.name}
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/managed-by: kro
          annotations:
            # kro can't hash the ConfigMap into the pod template the way the
            # chart does, so a config change wouldn't restart the pod on its
            # own. Stakater Reloader (if installed) acts on this annotation.
            reloader.stakater.com/auto: "true"
        spec:
          replicas: 1
          revisionHistoryLimit: 3
          strategy:
            type: Recreate
          selector:
            matchLabels:
              app.kubernetes.io/name: ${schema.metadata.name}
              app.kubernetes.io/instance: ${schema.metadata.name}
          template:
            metadata:
              labels:
                app.kubernetes.io/name: ${schema.metadata.name}
                app.kubernetes.io/instance: ${schema.metadata.name}
            spec:
              # Same reason as the homelab-app chart: legacy Docker-links env
              # vars can shadow an app's own same-named env var.
              enableServiceLinks: false
              imagePullSecrets: '${has(schema.spec.imagePullSecrets) ? schema.spec.imagePullSecrets.map(n, {"name": n}) : []}'
              containers:
                - name: app
                  image: ${schema.spec.image}
                  ports:
                    - name: http
                      containerPort: '${schema.spec.containerPort != 0 ? schema.spec.containerPort : schema.spec.port}'
                      protocol: TCP
                  env: '${has(schema.spec.env) ? schema.spec.env.map(k, {"name": k, "value": schema.spec.env[k]}) : []}'
                  # Always declared (kro can't type-check a conditional list of
                  # nested objects); optional unless 1Password is enabled.
                  envFrom:
                    - secretRef:
                        name: ${schema.metadata.name}-1pw
                        optional: ${!(has(schema.spec.onePassword) && schema.spec.onePassword.enabled)}
                  # Static for the same reason; when configMap is disabled the
                  # (empty, optional) volume goes to an unused path so it can't
                  # shadow anything the image ships at /config.
                  volumeMounts:
                    - name: config
                      mountPath: '${has(schema.spec.configMap) && schema.spec.configMap.enabled ? schema.spec.configMap.mountPath : "/var/run/homelabapp/unused-config"}'
                      subPath: '${has(schema.spec.configMap) && schema.spec.configMap.enabled ? schema.spec.configMap.subPath : ""}'
                      readOnly: true
                  resources:
                    requests:
                      cpu: ${schema.spec.resources.cpuRequest}
                      memory: ${schema.spec.resources.memoryRequest}
                    limits:
                      cpu: ${schema.spec.resources.cpuLimit}
                      memory: ${schema.spec.resources.memoryLimit}
                  startupProbe:
                    tcpSocket:
                      port: http
                    failureThreshold: 30
                    periodSeconds: 5
                  readinessProbe:
                    tcpSocket:
                      port: http
                    initialDelaySeconds: 10
                    periodSeconds: 10
              # Always declared for the same reason as envFrom; only mounted
              # (volumeMounts above) when configMap.enabled.
              volumes:
                - name: config
                  configMap:
                    name: ${schema.metadata.name}-config
                    optional: true

    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/name: ${schema.metadata.name}
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/managed-by: kro
        spec:
          type: ClusterIP
          selector: ${deployment.spec.selector.matchLabels}
          ports:
            - name: http
              port: ${schema.spec.port}
              targetPort: http
              protocol: TCP

    - id: httproute
      includeWhen:
        - ${schema.spec.route.enabled}
      template:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
        spec:
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: ${schema.spec.route.gatewayName}
              namespace: ${schema.spec.route.gatewayNamespace}
          hostnames: ${schema.spec.route.hostnames}
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /
              backendRefs:
                - name: ${service.metadata.name}
                  kind: Service
                  port: ${schema.spec.port}

    - id: publicroute
      includeWhen:
        - ${has(schema.spec.route) && has(schema.spec.route.publicHostnames) && size(schema.spec.route.publicHostnames) > 0}
      template:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: ${schema.metadata.name}-public
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
        spec:
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: public-gateway
              namespace: default
          hostnames: ${schema.spec.route.publicHostnames}
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /
              backendRefs:
                - name: ${service.metadata.name}
                  kind: Service
                  port: ${schema.spec.port}

    - id: onepassword
      includeWhen:
        - ${has(schema.spec.onePassword) && schema.spec.onePassword.enabled}
      template:
        apiVersion: onepassword.com/v1
        kind: OnePasswordItem
        metadata:
          name: ${schema.metadata.name}-1pw
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
        spec:
          itemPath: '${schema.spec.onePassword.itemPath != "" ? schema.spec.onePassword.itemPath : "vaults/Kubernetes/items/" + schema.metadata.name}'

    - id: config
      includeWhen:
        - ${has(schema.spec.configMap) && schema.spec.configMap.enabled}
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-config
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
        data: ${schema.spec.configMap.data}
