# HomelabApp: an experiment in replacing the homelab-app Helm chart with a kro
# ResourceGraphDefinition. kro turns this into a HomelabApp CRD plus a
# controller that keeps each instance's Deployment, Service and HTTPRoute in
# sync. Covers the simple stateless case only (no persistence, configMap,
# 1Password or ServiceMonitor yet) - see apps/iss-in-space-kro for an instance.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: homelabapp
spec:
  schema:
    apiVersion: v1alpha1
    kind: HomelabApp
    group: homelab.pmcd.io
    spec:
      image: string | required=true description="Full image reference including tag, e.g. ghcr.io/org/app:v1.2.3"
      port: integer | default=80 description="Service port"
      containerPort: integer | default=0 description="Container port; 0 means same as port"
      env: "map[string]string"
      imagePullSecrets: "[]string"
      resources:
        cpuRequest: string | default="25m"
        memoryRequest: string | default="128Mi"
        cpuLimit: string | default="500m"
        memoryLimit: string | default="512Mi"
      route:
        enabled: boolean | default=true
        hostnames: "[]string"
        gatewayName: string | default="traefik-gateway"
        gatewayNamespace: string | default="default"
    status:
      availableReplicas: ${deployment.status.availableReplicas}
      serviceIP: ${service.spec.clusterIP}

  resources:
    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/name: ${schema.metadata.name}
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/managed-by: kro
        spec:
          replicas: 1
          revisionHistoryLimit: 3
          strategy:
            type: Recreate
          selector:
            matchLabels:
              app.kubernetes.io/name: ${schema.metadata.name}
              app.kubernetes.io/instance: ${schema.metadata.name}
          template:
            metadata:
              labels:
                app.kubernetes.io/name: ${schema.metadata.name}
                app.kubernetes.io/instance: ${schema.metadata.name}
            spec:
              # Same reason as the homelab-app chart: legacy Docker-links env
              # vars can shadow an app's own same-named env var.
              enableServiceLinks: false
              imagePullSecrets: '${has(schema.spec.imagePullSecrets) ? schema.spec.imagePullSecrets.map(n, {"name": n}) : []}'
              containers:
                - name: app
                  image: ${schema.spec.image}
                  ports:
                    - name: http
                      containerPort: '${schema.spec.containerPort != 0 ? schema.spec.containerPort : schema.spec.port}'
                      protocol: TCP
                  env: '${has(schema.spec.env) ? schema.spec.env.map(k, {"name": k, "value": schema.spec.env[k]}) : []}'
                  resources:
                    requests:
                      cpu: ${schema.spec.resources.cpuRequest}
                      memory: ${schema.spec.resources.memoryRequest}
                    limits:
                      cpu: ${schema.spec.resources.cpuLimit}
                      memory: ${schema.spec.resources.memoryLimit}
                  startupProbe:
                    tcpSocket:
                      port: http
                    failureThreshold: 30
                    periodSeconds: 5
                  readinessProbe:
                    tcpSocket:
                      port: http
                    initialDelaySeconds: 10
                    periodSeconds: 10

    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/name: ${schema.metadata.name}
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/managed-by: kro
        spec:
          type: ClusterIP
          selector: ${deployment.spec.selector.matchLabels}
          ports:
            - name: http
              port: ${schema.spec.port}
              targetPort: http
              protocol: TCP

    - id: httproute
      includeWhen:
        - ${schema.spec.route.enabled}
      template:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: kro
        spec:
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: ${schema.spec.route.gatewayName}
              namespace: ${schema.spec.route.gatewayNamespace}
          hostnames: ${schema.spec.route.hostnames}
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /
              backendRefs:
                - name: ${service.metadata.name}
                  kind: Service
                  port: ${schema.spec.port}
