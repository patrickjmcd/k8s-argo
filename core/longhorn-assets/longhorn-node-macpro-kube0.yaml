apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: macpro-kube0
  namespace: longhorn-system
  finalizers:
    - longhorn.io
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  # Lima VM on a laptop -- gone whenever the MacBook sleeps, so it must never
  # hold replicas. Volumes can still attach here if a pod lands on it.
  allowScheduling: false
  disks:
    default-disk-98f3dc154aec32f1:
      allowScheduling: false
      diskDriver: ""
      diskType: filesystem
      evictionRequested: false
      path: /var/lib/longhorn/
      storageReserved: 18958516224
      tags: []
  evictionRequested: false
  instanceManagerCPURequest: 0
  name: macpro-kube0
  tags: []
