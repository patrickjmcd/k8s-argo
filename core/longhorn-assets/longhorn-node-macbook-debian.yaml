apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: macbook-debian
  namespace: longhorn-system
  finalizers:
    - longhorn.io
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  # Bare-metal Mid-2012 MacBook Pro (replaced the macpro-kube0 Lima VM).
  # Disk lives on the root filesystem, hence the large reserve.
  allowScheduling: true
  disks:
    default-disk-38cbd75dd7c41cb2:
      allowScheduling: true
      diskDriver: ""
      diskType: filesystem
      evictionRequested: false
      path: /var/lib/longhorn/
      storageReserved: 216154359398
      tags: []
  evictionRequested: false
  instanceManagerCPURequest: 0
  name: macbook-debian
  tags: []
