apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: longhorn-prometheus-servicemonitor
  namespace: longhorn-system
  labels:
    name: longhorn-prometheus-servicemonitor
spec:
  selector:
    matchLabels:
      app: longhorn-manager
  namespaceSelector:
    matchNames:
      - longhorn-system
  endpoints:
    - port: manager
      metricRelabelings:
        # longhorn-manager's own client/workqueue latency histograms (~22k
        # series); no rule or dashboard reads them.
        - sourceLabels: [__name__]
          regex: longhorn_(rest_client_.*|workqueue_.*)_bucket
          action: drop
