apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - httproute.yaml
  - service-monitor.yaml
  - prometheus-networkpolicy.yaml
  - 1password.secret.yaml
  - backup-target.yaml
  - longhorn-node-pi4-kube0.yaml
  - longhorn-node-pi4-kube1.yaml
  - longhorn-node-kube-macmini.yaml
  - longhorn-node-kube-n3160.yaml
  - longhorn-node-kube-leader-2.yaml
  - longhorn-node-pi5-kube0.yaml
  - longhorn-node-pi5-kube1.yaml
  - longhorn-node-pi5-kube2.yaml
  - longhorn-node-media-server.yaml
  - longhorn-node-macbook-debian.yaml
  - storageclass-best-effort.yaml
  - recurring-jobs.yaml
  - settings.yaml

# Never let Flux prune Longhorn's node/disk config, backup target, recurring
# jobs, settings or StorageClass (docs/flux-migration.md §2): deleting a
# Longhorn Node object drops its disks from scheduling.
patches:
  - target:
      kind: (Node|BackupTarget|RecurringJob|Setting|StorageClass)
    patch: |
      apiVersion: v1
      kind: Ignored
      metadata:
        name: ignored
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
