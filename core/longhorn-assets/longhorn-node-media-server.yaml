apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: media-server
  namespace: longhorn-system
  finalizers:
    - longhorn.io
spec:
  # Beelink running bare-metal Plex/Jellyfin: the root disk is theirs, so
  # replicas go only on the USB drive. That drive occasionally drops off the
  # bus; with 3 replicas that just faults the local copy, which rebuilds once
  # it re-mounts. storageReserved leaves room for the Prometheus TSDB and
  # cluster-backups that share the drive.
  #
  # usb-disk takes no new replicas (Oct 30 2026): under rebuild load the drive
  # was too slow, its replicas timed out mid-rebuild and faulted again in a
  # loop, and the timescale volume briefly remounted read-only. Existing
  # replicas stay; new and rebuilt ones go to the other nodes.
  #
  # Existing replicas evicted too (Oct 31 2026): the ones left behind kept
  # hitting Longhorn's 8s r/w timeout -- 05:07 (timescale journal aborted),
  # 07:04-07:43 (homebridge EIO, down 5h) and 14:39 (homebridge, subwave,
  # timescale all degraded). The drive averages a queue depth of ~6 with the
  # Prometheus TSDB on it, so it can't serve a synchronous replica.
  allowScheduling: true
  disks:
    usb-disk:
      allowScheduling: false
      diskDriver: ""
      diskType: filesystem
      evictionRequested: true
      path: /mnt/usb/longhorn
      storageReserved: 214748364800
      tags: []
  evictionRequested: false
  instanceManagerCPURequest: 0
  name: media-server
  tags: []
