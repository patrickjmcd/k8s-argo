# Purely for Hubble labeling: makes Cilium allocate a distinct identity per local
# VLAN (see ./local-cidr-groups.yaml) instead of collapsing all non-cluster traffic
# into generic reserved:world. `endpointSelector: {}` selects every pod in the
# cluster, same as before.
#
# RE-ADDED 2026-09-08 after being removed the same day for causing a cluster-wide
# outage — see git log for the incident (identify-local-vlans, commits around
# b7869eb) and memory/cilium-migration-progress.md for the full writeup. Root
# cause: the egress/ingress rules ONLY listed the 6 CIDR groups, no broad allow,
# so the moment policyEnforcementMode left "never" this became a cluster-wide
# default-deny-except-LAN policy on every pod.
#
# THE FIX: `toEntities: [all]` / `fromEntities: [all]` below are a second rule in
# each direction's list (rules within a policy are OR'd/unioned per standard
# NetworkPolicy semantics), so this policy can only ever ADD identity labels —
# it can never narrow traffic, regardless of what the CIDR-group rule does or
# doesn't cover. The CIDR-group rule is kept purely to force per-VLAN identity
# allocation for Hubble; `toEntities: [all]` alone would not create those labels.
#
# Verified live under policyEnforcementMode: default (not "never" — "never" can't
# catch this class of bug) before committing: applied via kubectl first, confirmed
# DNS + kube-apiserver + a real cross-namespace app (Longhorn scrape) all still
# worked, THEN committed to git.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: identify-local-vlans
spec:
  endpointSelector: {}
  egress:
    - toCIDRSet:
        - cidrGroupRef: kube-lan
        - cidrGroupRef: default-lan
        - cidrGroupRef: kamera-lan
        - cidrGroupRef: jolly-roger-lan
        - cidrGroupRef: cari-ads-lan
        - cidrGroupRef: home-automation-lan
    - toEntities:
        - all
  ingress:
    - fromCIDRSet:
        - cidrGroupRef: kube-lan
        - cidrGroupRef: default-lan
        - cidrGroupRef: kamera-lan
        - cidrGroupRef: jolly-roger-lan
        - cidrGroupRef: cari-ads-lan
        - cidrGroupRef: home-automation-lan
    - fromEntities:
        - all
