# DISABLED (2026-09-08) — removed from kustomization.yaml, kept here for reference.
#
# WRONG ASSUMPTION when this was written: "safe once enforcement is re-enabled,
# since it's a superset allow of the existing LAN" is false. `endpointSelector: {}`
# selects EVERY pod in the cluster, and this policy's egress rule lists ONLY the
# 6 local CIDR groups — no toEntities: [cluster, kube-apiserver, world], no pod-to-pod
# allow. Under policyEnforcementMode: never this was inert, so the mistake went
# unnoticed for 2 days. The moment policyEnforcementMode flipped to "default"
# (2026-09-08), this became a cluster-wide default-deny-except-LAN egress policy on
# every pod — broke DNS, kube-apiserver ClusterIP access, and everything else that
# isn't the local LAN. Caused a real (if brief) cluster-wide outage; diagnosed via
# a hostNetwork pod succeeding where a normal pod failed (hostNetwork bypasses
# Cilium identity-based enforcement entirely) — that asymmetry was the key clue.
#
# If this Hubble-visibility feature is wanted again, it MUST also carry a broad
# allow (e.g. toEntities: [cluster, kube-apiserver, world] alongside the CIDR
# groups) so it only adds identity labels without narrowing anything. Test it
# under policyEnforcementMode: default specifically, not "never" — "never" cannot
# catch this class of bug since it disables enforcement entirely.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: identify-local-vlans
spec:
  endpointSelector: {}
  egress:
    - toCIDRSet:
        - cidrGroupRef: kube-lan
        - cidrGroupRef: default-lan
        - cidrGroupRef: kamera-lan
        - cidrGroupRef: jolly-roger-lan
        - cidrGroupRef: cari-ads-lan
        - cidrGroupRef: home-automation-lan
  ingress:
    - fromCIDRSet:
        - cidrGroupRef: kube-lan
        - cidrGroupRef: default-lan
        - cidrGroupRef: kamera-lan
        - cidrGroupRef: jolly-roger-lan
        - cidrGroupRef: cari-ads-lan
        - cidrGroupRef: home-automation-lan
