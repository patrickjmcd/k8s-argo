apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
    argocd.argoproj.io/tracking-method: annotation
    argocd.argoproj.io/manifest-generate-paths: .
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: core-components
  destination:
    name: in-cluster
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - chart: kyverno
      repoURL: https://kyverno.github.io/kyverno/
      targetRevision: 3.9.1
      helm:
        releaseName: kyverno
        valuesObject:
          config:
            preserve: false
            excludeNamespaces:
              - kube-flannel
              - argocd
          webhookLabels:
            app.kubernetes.io/managed-by: argocd
          admissionController:
            # Single replica was a cluster-wide SPOF: its webhook has
            # failurePolicy=Fail, so one slow/overloaded pod blocks every
            # pod admission cluster-wide. Caused a wide BackOff cascade on
            # 2026-09-17 when it landed on the most memory-pressured node.
            replicas: 2

          # background-controller and reports-controller watch a large
          # number of CRD types each. Their watches periodically drop
          # ("http2: client connection lost") and all reconnect/re-list at
          # once, which was enough to exhaust the default 300 QPS/burst
          # client-side rate limit - starving the leader-election lease
          # renewal itself, so they'd lose leadership and cleanly exit
          # every few minutes (482+ and 500+ restarts respectively as of
          # Sep 2026). Doesn't fix the underlying watch drops, but gives
          # enough headroom to survive a reconnect storm without cascading
          # into a leadership-loss restart loop.
          backgroundController:
            extraArgs:
              clientRateLimitQPS: "600"
              clientRateLimitBurst: "1200"
          reportsController:
            extraArgs:
              clientRateLimitQPS: "600"
              clientRateLimitBurst: "1200"


    - repoURL: https://github.com/patrickjmcd/k8s-argo.git
      targetRevision: main
      path: core/kyverno
