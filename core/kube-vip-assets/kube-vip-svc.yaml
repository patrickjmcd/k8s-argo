apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: kube-vip-svc-ds
    app.kubernetes.io/version: v1.2.3
  name: kube-vip-svc-ds
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip-svc-ds
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip-svc-ds
        app.kubernetes.io/version: v1.2.3
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              # pi4-kube0 has a chronic frr-k8s/liveness-probe crash loop under
              # MetalLB (see core/metallb-system.yaml) — kept out of the LB
              # election pool here too until it's proven stable under kube-vip.
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - pi4-kube0
      containers:
        - args:
            - manager
          env:
            - name: vip_arp
              value: "true"
            # Watches all type=LoadBalancer Services cluster-wide; a Service
            # opts out via the `kube-vip.io/ignore: "true"` annotation. Used
            # during migration off MetalLB to pilot one Service at a time.
            - name: svc_enable
              value: "true"
            # Per-Service leader election (one Lease per Service, backed by
            # the k3s API server/etcd) instead of one kube-vip instance
            # owning every VIP. vip_leaderelection must stay false — the two
            # are mutually exclusive election modes.
            - name: svc_election
              value: "true"
            - name: vip_leaderelection
              value: "false"
            - name: cp_enable
              value: "false"
            - name: vip_leaseduration
              value: "5"
            - name: vip_renewdeadline
              value: "3"
            - name: vip_retryperiod
              value: "1"
            # Distinct from the control-plane DaemonSet's :2112 — both run on
            # the control-plane nodes with hostNetwork, so they'd otherwise
            # collide on the same port.
            - name: prometheus_server
              value: :2113
            - name: vip_nodename
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          image: ghcr.io/kube-vip/kube-vip:v1.2.3
          imagePullPolicy: IfNotPresent
          name: kube-vip
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
      hostNetwork: true
      serviceAccountName: kube-vip
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
