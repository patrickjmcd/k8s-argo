apiVersion: batch/v1
kind: Job
metadata:
  name: shared-postgres-backup-grants
  namespace: postgres
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: grants
          image: postgres:18-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-superuser
                  key: password
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-superuser
                  key: username
          command:
            - /bin/sh
            - -c
            # Kubernetes expands $(VAR) in command and turns $$ into $, so the
            # dollar quotes are written $$$$ (they ran as `DO $` and failed,
            # silently, until Oct 2026). ON_ERROR_STOP fails the Job on SQL errors.
            - |
              set -e
              psql -h shared-postgres-rw -U "$PGUSER" -d postgres -v ON_ERROR_STOP=1 << 'ENDSQL'
              DO $$$$
              DECLARE
                db RECORD;
              BEGIN
                FOR db IN
                  SELECT datname FROM pg_database
                  WHERE datistemplate = false AND datname NOT IN ('postgres')
                LOOP
                  EXECUTE format('GRANT CONNECT ON DATABASE %I TO backup', db.datname);
                END LOOP;
                GRANT pg_read_all_data TO backup;
              END $$$$;
              ENDSQL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
