apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared-postgres
  namespace: postgres
spec:
  instances: 3

  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-standard-trixie
    major: 18

  storage:
    storageClass: local-path
    size: 10Gi

  primaryUpdateMethod: switchover

  # Soft-prefer the Pi 5s over the Pi 4s. CNPG's own anti-affinity only
  # spreads replicas of *this* cluster apart from each other - it has no
  # concept of weaker vs. stronger nodes, so without this, replicas from
  # unrelated CNPG clusters (e.g. immich) can all land on the same weak
  # nodes by chance, as happened Sep 2026 when both shared-postgres
  # replicas and immich's postgres-1/2 ended up on pi4-kube0/1.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 80
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - pi5-kube0
                  - pi5-kube1
                  - pi5-kube2

  enableSuperuserAccess: true

  postgresql:
    pg_hba:
      - host all mealie all trust
      - host all radarr all trust
      - host all sonarr all trust
      - host all prowlarr all trust
      - host all readarr all trust
      - host all lidarr all trust
      - host all pocketid all trust
      - host all outline all trust
      - host all reedme all trust
      - host all n8n all trust
      - host all homebox all trust
      - host all dispatcharr all trust
      - host all romm all trust
      - host all sparkyfitness all trust
      - host all backup all trust

  managed:
    roles:
      - name: mealie
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
      - name: radarr
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
      - name: sonarr
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
      - name: prowlarr
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
      - name: readarr
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
      - name: lidarr
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
      - name: pocketid
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
      - name: outline
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
      - name: reedme
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
      - name: n8n
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
      - name: homebox
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
      - name: dispatcharr
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
      - name: romm
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
      - name: sparkyfitness
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        # SparkyFitness' server boots as this owner role to run migrations and
        # to create its own least-privilege runtime role (sparkyfitness_app),
        # so it needs CREATEROLE. sparkyfitness_app is created by the app, not
        # managed here, and authenticates via scram (no pg_hba trust line).
        createrole: true
      - name: adsb
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        # password set by CNPG from the 1Password-synced secret (adsb-postgres-1pw)
        passwordSecret:
          name: adsb-postgres-1pw
      - name: backup
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
