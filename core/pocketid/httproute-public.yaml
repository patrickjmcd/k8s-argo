# Public via Cloudflare Tunnel (core/traefik-assets/public-gateway.yaml);
# external-dns creates the DNS record.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pocketid-public
  namespace: pocketid
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
      namespace: default
  hostnames:
    - auth.pmcd.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pocketid
          kind: Service
          namespace: pocketid
          port: 80
