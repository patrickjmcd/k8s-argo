apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  project: default
  sources:
    - chart: cloudnative-pg
      repoURL: https://cloudnative-pg.github.io/charts
      # renovate: datasource=helm depName=cloudnative-pg registryUrl=https://cloudnative-pg.github.io/charts
      targetRevision: 0.29.1
    # Barman Cloud plugin: WAL archiving + base backups for shared-postgres
    # (core/postgres/objectstore-b2.yaml). Replaces the deprecated in-tree
    # spec.backup.barmanObjectStore. Needs cert-manager.
    - chart: plugin-barman-cloud
      repoURL: https://cloudnative-pg.github.io/charts
      # renovate: datasource=helm depName=plugin-barman-cloud registryUrl=https://cloudnative-pg.github.io/charts
      targetRevision: 0.8.1
    - repoURL: https://github.com/patrickjmcd/k8s-argo.git
      targetRevision: main
      path: core/cnpg
  destination:
    namespace: cnpg-system
    name: in-cluster
