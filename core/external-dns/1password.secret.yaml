# Cloudflare API token scoped to Zone:DNS:Edit (+ Zone:Zone:Read) on the zones
# listed in domainFilters in core/external-dns.yaml. The 1Password item needs a
# field named CF_API_TOKEN.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: external-dns-cloudflare-1pw
  namespace: external-dns
spec:
  itemPath: "vaults/Kubernetes/items/external-dns-cloudflare"
