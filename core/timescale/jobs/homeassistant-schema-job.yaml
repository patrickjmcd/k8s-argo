# Applies homeassistant-schema.sql (LTSS compression, hourly rollup, entity
# table, Grafana helper functions and grants) whenever the SQL changes. Runs as
# the homeassistant role, which owns the database and LTSS' ltss table.
apiVersion: batch/v1
kind: Job
metadata:
  name: homeassistant-schema
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:18-alpine
          env:
            - name: PGHOST
              value: timescale-rw
            - name: PGDATABASE
              value: homeassistant
            - name: PGSSLMODE
              value: require
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: homeassistant-timescale-1pw
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: homeassistant-timescale-1pw
                  key: password
          command: ["psql", "-X", "-f", "/sql/homeassistant-schema.sql"]
          volumeMounts:
            - name: sql
              mountPath: /sql
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: sql
          configMap:
            name: homeassistant-schema
