apiVersion: postgresql.cnpg.io/v1
kind: ClusterImageCatalog
metadata:
  name: postgresql-standard-trixie
spec:
  images:
    # Pinned to a digest (rather than the floating :18-system-trixie tag) after
    # nodes ended up caching two different builds behind the same tag: one with
    # pgvector 0.8.5, one with only 0.8.2. A CNPG failover promoted a replica on
    # the stale 0.8.2 build as primary, crashing immich-server. See Sep 2026
    # incident: git log for this file.
    #
    # Keep the tag alongside the digest. With a bare digest Renovate assumes
    # :latest, which for this image is a legacy PostgreSQL 17.5 build (b1deeed);
    # it kept "updating" us to it (#830, #837, #840) and replicas crashlooped
    # on the PG18 data directory. The digest still decides what is pulled.
    - major: 18
      image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:3e89ea90485ffda67094fd6950d9d61dec9ec314aabc8d63c048c67759918621
