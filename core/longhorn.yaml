apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  project: default
  sources:
    - path: core/longhorn-assets
      repoURL: http://gitea.gitea.svc.cluster.local:3000/patrickjmcd/k8s-argo.git
      targetRevision: main
    - chart: longhorn
      repoURL: https://charts.longhorn.io/
      # renovate: datasource=helm depName=longhorn registryUrl=https://charts.longhorn.io/
      targetRevision: 1.13.0
      helm:
        values: |
          preUpgradeChecker:
            jobEnabled: false
          defaultSettings:
            # dedicated=heavy lets Longhorn run on media-server (disk at /mnt/usb/longhorn)
            taintToleration: "node-role.kubernetes.io/control-plane:NoSchedule;dedicated=heavy:NoSchedule"
            replicaAutoBalance: "best-effort"
          longhornManager:
            tolerations:
              - key: "node-role.kubernetes.io/control-plane"
                effect: "NoSchedule"
                operator: "Exists"
              - key: "dedicated"
                value: "heavy"
                effect: "NoSchedule"
                operator: "Equal"
              - key: "node.kubernetes.io/not-ready"
                effect: "NoExecute"
                operator: "Exists"
                tolerationSeconds: 30
              - key: "node.kubernetes.io/unreachable"
                effect: "NoExecute"
                operator: "Exists"
                tolerationSeconds: 30
            # Steady state is 250-300Mi on every node. The old 300Mi limit
            # OOM-killed it on pi5-kube1 minutes before that node hung
            # (Oct 11 2026). No CPU limit: it's on the CSI critical path.
            resources:
              requests:
                cpu: 50m
                memory: 320Mi
              limits:
                memory: 768Mi
          longhornDriver:
            tolerations:
              - key: "dedicated"
                value: "heavy"
                effect: "NoSchedule"
                operator: "Equal"
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi
  destination:
    namespace: longhorn-system
    name: in-cluster
