apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: core-components
  destination:
    name: in-cluster
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - chart: trivy-operator
      repoURL: https://aquasecurity.github.io/helm-charts/
      targetRevision: 0.36.0
      helm:
        releaseName: trivy-operator
        valuesObject:
          operator:
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 128Mi
            metricsConfigAuditInfo: true
            metricsExposedSecretInfo: true
            # Sep 2026: standalone mode has every scan-job container download its
            # own copy of the trivy-db into a fresh per-pod emptyDir cache. A scan
            # job gets one container per container in the target workload's pod,
            # started in parallel -- for any multi-container workload they raced
            # to open the same boltdb cache file and lost: "Failed to acquire
            # cache or database lock ... cache may be in use by another process:
            # timeout", failing every such scan with BackoffLimitExceeded. The
            # built-in server downloads the DB once and scan jobs become thin
            # HTTP clients against it, removing the race entirely.
            builtInTrivyServer: true
          trivy:
            ignoreUnfixed: true
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                cpu: 500m
                memory: 500Mi
          serviceMonitor:
            enabled: true
          nodeCollector:
            tolerations:
              - operator: Exists

    - path: core/trivy-operator
      repoURL: https://github.com/patrickjmcd/k8s-argo.git
      targetRevision: main
