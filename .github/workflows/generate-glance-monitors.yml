name: Generate Glance Monitors

on:
  push:
    branches: [main]
    paths:
      - "**/httproute*.yaml"
      - "apps/**/values.yaml"
      - "scripts/generate_glance_monitors.py"
      - ".github/workflows/generate-glance-monitors.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Regenerate glance monitor lists
        run: python3 scripts/generate_glance_monitors.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- apps/glance/values.yaml; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/glance/values.yaml
          git commit -m "chore: regenerate glance monitor list from HTTPRoutes [skip ci]"
          git push
